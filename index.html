const CONTENT  = {"README.md": "# Guía de uso — Módulo Sunset / Vehicle Rental (Odoo 19)\n\nManual operativo en español para las personas que van a utilizar día a día el módulo de alquiler de vehículos de Sunset Rent. No es documentación técnica: aquí se explica **qué se ve en pantalla, qué se hace clic a clic, y qué ocurre detrás**.\n\n---\n\n## Índice general\n\n| # | Tema | Contenido |\n|---|------|-----------|\n| 00 | [Introducción](./01-introduccion.md) | Qué es el módulo, recorrido por el menú principal, glosario de términos. |\n| 01 | [Panel y disponibilidad](./02-panel-y-disponibilidad.md) | Dashboard con métricas, gráficos, cronograma Gantt y consulta de disponibilidad por fechas. |\n| 02 | [Flota y vehículos](./03-flota-y-vehiculos.md) | Alta y edición de vehículos, modelos, categorías, estados, fotos, kilometraje. |\n| 03 | [Clientes](./04-clientes.md) | Alta de clientes, gestión de documentos (DNI, carnet, pasaporte), portal del cliente. |\n| 04 | [Consultas web y leads](./05-consultas-web-y-leads.md) | Gestión de consultas entrantes desde la web, pipeline CRM, conversión a contrato. |\n| 05 | [Reservas](./06-reservas.md) | Asistente de reserva paso a paso y reserva múltiple de varios vehículos. |\n| 06 | [Contratos](./07-contratos.md) | Ciclo de vida del contrato (borrador → en progreso → devuelto/cancelado), facturación, ampliaciones, contratos en grupo, firma digital, PDF. |\n| 07 | [Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) | Configuración de precios por vehículo/temporada, pólizas de seguro, reglas de depósito y depósito dinámico. |\n| 08 | [Pagos y Redsys](./09-pagos-y-redsys.md) | Opciones de pago, pasarela Redsys, enlaces de pago al cliente, seguimiento. |\n| 09 | [Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md) | Solicitudes de mantenimiento, horarios, facturación a proveedores, gastos y sustitución de vehículo durante el alquiler. |\n| 10 | [Daños y rayones](./11-danos-y-rayones.md) | Registro de daños, painter visual, facturación al cliente, informes de rayones. |\n| 11 | [Devolución y facturación final](./12-devolucion-y-facturacion.md) | Proceso completo de devolución, cálculo de cargos finales, devolución de depósito. |\n| 12 | [Portal web público](./13-portal-web-publico.md) | Páginas públicas (home, flota, contacto, detalle de vehículo) y proceso de reserva online. |\n| 13 | [Emails y reportes](./14-emails-y-reportes.md) | Plantillas de email automáticas y documentos PDF (contrato, anexos, informes). |\n| 14 | [Configuración](./15-configuracion.md) | Políticas de cancelación, términos de acuerdo, horarios de mantenimiento, secuencias. |\n| 15 | [Solución de problemas](./16-solucion-de-problemas.md) | Errores comunes, mensajes típicos y buenas prácticas. |\n\n---\n\n## Convenciones del manual\n\n- **Ruta de menú**: cuando lees algo como *Vehicles Rental → Contratos → Crear*, significa que en el menú principal de Odoo vas haciendo clic en ese orden.\n- **\"Botón Confirmar\"**, **\"Botón Devolver\"**: son botones reales en la cabecera del formulario en Odoo. El nombre que ves en pantalla puede variar según el idioma del usuario; aquí siempre se usa el nombre en español.\n- **Estado**: la etiqueta superior derecha de un formulario (borrador, en progreso, devuelto, cancelado…). Cambia automáticamente al pulsar los botones de acción.\n- **Wizard / Asistente**: ventana emergente que pide datos para realizar una acción (por ejemplo, \"Devolver depósito\").\n\n---\n\n## ¿Por dónde empezar?\n\n- Si nunca has usado el módulo: empieza por la [Introducción](./01-introduccion.md).\n- Si quieres reservar un vehículo ya mismo: ve a [Reservas](./06-reservas.md).\n- Si te ha entrado una consulta por la web: ve a [Consultas web y leads](./05-consultas-web-y-leads.md).\n- Si tienes que cerrar un alquiler que vuelve: ve a [Devolución y facturación final](./12-devolucion-y-facturacion.md).\n- Si algo no funciona: mira primero [Solución de problemas](./16-solucion-de-problemas.md).\n", "01-introduccion.md": "# 01 · Introducción\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué es el módulo Sunset / Vehicle Rental?\n\nEs una aplicación de gestión integral de alquiler de vehículos integrada en Odoo 19 Enterprise. Permite a una empresa de rent-a-car gestionar **todo el ciclo del negocio en un solo sitio**:\n\n- Mantener una **flota de vehículos** con sus precios, fotos, kilometraje y estado.\n- Recibir **consultas y reservas** desde la página web pública o registrarlas manualmente.\n- Generar **contratos de alquiler** con cálculo automático de tarifas, seguros y depósito.\n- **Cobrar online** al cliente mediante Redsys (TPV virtual).\n- Controlar el **mantenimiento** de los vehículos, **daños** que se producen y **sustituciones** durante un alquiler activo.\n- Registrar el **estado físico** de cada coche con un *painter* visual de rayones y daños.\n- Emitir **facturas** automáticas, anexos PDF de ampliación y sustitución, y enviar **emails** automáticos al cliente.\n- Visualizar el negocio en un **dashboard** con métricas en tiempo real y un **cronograma Gantt** de todos los contratos.\n\nEl módulo es una **aplicación** completa de Odoo: aparece como un icono propio en el menú principal y reemplaza/extiende los módulos estándar de Flota, Ventas, Facturación y CRM con la lógica específica del alquiler.\n\n---\n\n## ¿Para quién es esta guía?\n\nPara cualquier persona que vaya a operar el sistema desde su cuenta de Odoo:\n\n- **Recepción / oficina**: dar de alta clientes, contratar, devolver vehículos, cobrar.\n- **Gerencia**: ver el panel, métricas, facturación.\n- **Taller / mantenimiento**: registrar mantenimientos, daños, rayones.\n- **Administración**: facturas, pagos, conciliaciones.\n\nNo hace falta saber programar ni entender la estructura interna de Odoo.\n\n---\n\n## Recorrido por el menú principal\n\nAl entrar en Odoo verás un icono **Vehicles Rental** en el menú lateral o superior. Al hacer clic se despliega la siguiente estructura:\n\n```\nVehicles Rental\n├── Panel                          → Dashboard con métricas y gráficos\n├── Consultas de Reserva           → Leads CRM entrantes desde la web\n├── Disponibilidad                 → Vista de disponibilidad por fechas\n├── Reservar Vehículo              → Asistente para crear una reserva\n├── Reserva Múltiple               → Reservar varios vehículos al mismo cliente\n├── Vehículos                      → La flota completa\n├── Contratos                      → Todos los contratos de alquiler\n├── Contratos Grupo                → Agrupaciones de contratos del mismo cliente\n├── Ampliaciones                   → Ampliaciones de contratos activos\n├── Clientes                       → Listado de contactos\n├── Solicitudes de mantenimiento   → Órdenes de mantenimiento\n├── Sustituciones de Vehículos     → Cambios de vehículo durante un alquiler\n├── Tarifas de Vehículos           → Precios por vehículo / temporada\n├── Tarifas de Seguros             → Pólizas y precios de seguro\n├── Reglas de Depósitos            → Cálculo dinámico del depósito\n└── Configuraciones\n    ├── Políticas de Cancelación\n    ├── Términos de Acuerdo de Alquiler\n    ├── Informes de Rayones\n    └── Horarios de Mantenimiento\n```\n\nCada entrada del menú está documentada en su archivo correspondiente de esta guía (ver el [índice](./README.md)).\n\n---\n\n## Flujos de trabajo típicos\n\n### Flujo 1 — Reserva manual de un cliente que llega presencial\n\n1. **Disponibilidad** → comprobar que el coche está libre las fechas pedidas.\n2. **Reservar Vehículo** → asistente paso a paso que crea contrato + cliente.\n3. **Contrato** → confirmar, imprimir/enviar PDF, firmar (digital o en papel).\n4. *(Opcional)* Enviar **enlace de pago Redsys** al cliente.\n5. Cuando vuelve el coche → botón **Devolver** → registrar daños y cargos.\n6. **Devolución de depósito** → wizard de cierre.\n\n### Flujo 2 — Reserva entrante por la web\n\n1. El cliente rellena el formulario en la web pública → se crea una **Consulta de Reserva** (lead CRM).\n2. Recepción la abre, contacta al cliente y confirma datos.\n3. Botón **Convertir en contrato** → wizard que crea el contrato.\n4. Continúa igual que el flujo 1 desde el paso 3.\n\n### Flujo 3 — Reserva con varios vehículos a la vez\n\n1. **Reserva Múltiple** → añadir varios vehículos al mismo cliente.\n2. Se generan los contratos enlazados y, opcionalmente, un **Contrato Grupo** que los agrupa para facturación conjunta.\n\n### Flujo 4 — Sustitución durante un alquiler\n\n1. El cliente reporta avería o el taller necesita el vehículo.\n2. Desde el contrato activo → botón **Sustituir vehículo** → wizard.\n3. Se genera un **anexo PDF de sustitución** que firma el cliente.\n4. El contrato sigue activo con el nuevo vehículo.\n\n---\n\n## Glosario\n\n| Término | Significado |\n|---------|-------------|\n| **Lead / Consulta de reserva** | Solicitud de información que llega normalmente desde la web. No es un contrato, es solo interés. Vive en el CRM. |\n| **Contrato de alquiler** | Documento operativo y legal del alquiler. Tiene un estado (borrador, en progreso, devuelto, cancelado) y líneas de facturación. |\n| **Contrato grupo** | Conjunto de contratos del mismo cliente agrupados, normalmente para facturarlos en bloque. |\n| **Ampliación (extension)** | Prórroga de un contrato activo. Cambia la fecha de fin y genera un anexo PDF. |\n| **Sustitución** | Cambio de vehículo durante un alquiler activo, sin cerrar el contrato. Genera un anexo PDF. |\n| **Wizard / Asistente** | Ventana emergente que recoge datos para realizar una acción concreta. |\n| **Painter de daños** | Herramienta visual para señalar dónde hay un rayón o daño sobre el dibujo del vehículo. |\n| **Informe de rayones (scratch report)** | Registro histórico permanente de los daños conocidos de un vehículo. |\n| **Depósito** | Importe en garantía que el cliente paga al inicio y se devuelve al final si todo está en orden. |\n| **Depósito dinámico** | Depósito que se calcula automáticamente según reglas (categoría de vehículo, edad del conductor, duración…). |\n| **Redsys** | Pasarela de pago bancaria española integrada en Odoo para cobros con tarjeta online. |\n| **Categoría de vehículo** | Agrupación (económico, compacto, SUV, etc.). Las tarifas, seguros y depósitos se configuran por categoría. |\n| **Tarifa (pricing rule)** | Regla que define el precio del alquiler según vehículo, fechas y duración. |\n| **Política de cancelación** | Condiciones que se aplican si el cliente cancela el contrato. |\n| **Términos de acuerdo** | Cláusulas legales que aparecen en el contrato impreso y/o en la web. |\n\n---\n\n## Permisos y usuarios\n\nEl módulo respeta los grupos de permisos estándar de Odoo. En general:\n\n- **Usuario interno (operador de recepción)**: puede crear contratos, devolver, cobrar, gestionar consultas.\n- **Manager**: además puede configurar tarifas, políticas, términos, reglas de depósito.\n- **Cliente final (portal)**: ve sólo sus propias reservas/contratos desde el portal web público.\n\nLos permisos detallados están en `security/ir.model.access.csv` y se aplican automáticamente al instalar el módulo.\n\n---\n\n## Sobre esta guía\n\nCada capítulo de la guía es independiente y arranca con un enlace al índice. Dentro de cada capítulo encontrarás:\n\n1. **Qué es** y para qué sirve.\n2. **Cómo acceder** (ruta del menú).\n3. **Paso a paso** con campos y botones.\n4. **Ejemplos reales** de uso.\n5. **Validaciones / errores frecuentes**.\n6. **Enlaces a capítulos relacionados**.\n\n---\n\n[← Volver al índice](./README.md) · Siguiente: [02 · Panel y disponibilidad →](./02-panel-y-disponibilidad.md)\n", "02-panel-y-disponibilidad.md": "# 02 · Panel y Disponibilidad\n\n[← Volver al índice](./README.md)\n\n---\n\n## A. Panel (Dashboard)\n\n### ¿Qué es?\n\nEl **Panel** es la pantalla resumen del negocio. Muestra en una sola vista cuántos vehículos tienes, cuántos están alquilados, cuánto has facturado este mes y qué contratos están actualmente en curso. Es el primer sitio donde mirar cada mañana.\n\n### Cómo acceder\n\n**Vehicles Rental → Panel**\n\nEs el primer ítem del menú (sequence 0) — el que se abre por defecto al entrar en la aplicación.\n\n### Indicadores que muestra\n\nEl panel se divide en **tarjetas numéricas (KPI)** y **gráficos**.\n\n#### Tarjetas numéricas\n\n| Tarjeta | Qué cuenta |\n|---|---|\n| **Total Vehicles** | Vehículos totales en la flota. |\n| **Available Vehicles** | Vehículos en estado *Operacional* (disponibles para alquilar). |\n| **Under Maintenance Vehicles** | Vehículos en estado *En Mantenimiento*. |\n| **Draft Vehicle** | Total de contratos de vehículo registrados (en cualquier estado). |\n| **In Progress** | Contratos actualmente activos (vehículo en manos del cliente). |\n| **Return** | Contratos ya devueltos. |\n| **Cancel** | Contratos cancelados. |\n| **Customers** | Total de contactos (clientes) en la base de datos. |\n| **Customer Invoice** | Facturas de cliente vinculadas a contratos de alquiler. |\n| **Pending Invoices** | Facturas de contrato aún no pagadas. |\n\nCada tarjeta es **navegable**: al pulsarla se abre el listado correspondiente con el filtro pre-aplicado. Por ejemplo, pulsar \"Pending Invoices\" abre la lista de facturas pendientes para que las gestiones.\n\n#### Gráfico de facturación por mes\n\nGráfico de barras del año en curso, agrupado por mes (Enero a Diciembre). Sólo se contabilizan facturas de contratos **devueltos** (cerrados), no las de contratos aún abiertos.\n\n> Sirve para ver de un vistazo la estacionalidad del negocio: en julio-agosto subirán las barras si trabajas en zona turística.\n\n#### Tabla de contratos en curso\n\nLista de los contratos *In Progress* con:\n\n- Referencia del contrato (ej. `Contracts/0001`).\n- Fecha de inicio.\n- Fecha de fin.\n\nEs la \"línea de tiempo\" rápida: qué coches están alquilados y hasta cuándo.\n\n### Filtros\n\nEl panel se filtra **automáticamente por compañía activa** (multi-empresa). Si en tu instalación coexisten Sunset y Pinveco, sólo verás los datos de la compañía actualmente seleccionada en la barra superior de Odoo.\n\n### Ejemplos de uso\n\n- **Apertura de turno**: nada más entrar, mirar *In Progress* y *Pending Invoices*. Sabes cuántos coches están fuera y cuántas facturas hay sin cobrar.\n- **Cierre de mes**: revisar el gráfico de facturación mensual y compararlo con meses anteriores.\n- **Auditoría rápida**: si *Total Vehicles ≠ Available + Under Maintenance + In Progress*, hay un descuadre y conviene revisar estados.\n\n---\n\n## B. Disponibilidad\n\n### ¿Qué es?\n\nUna vista a **página completa con cronograma Gantt** donde se ven, en una línea de tiempo horizontal, todos los contratos de alquiler activos o futuros agrupados por vehículo. Permite ver de un vistazo qué coches están ocupados y cuándo se liberan.\n\n### Cómo acceder\n\n**Vehicles Rental → Disponibilidad**\n\n### Qué se ve en pantalla\n\n- **A la izquierda**: la lista de **vehículos** (icono coche). Bajo cada vehículo, sus **contratos** como sub-líneas expandibles (icono llave).\n- **Columnas del grid**: Vehículo · Fecha de inicio · Fecha de fin · Duración.\n- **A la derecha**: la **escala temporal** con barras horizontales. Cada barra es un contrato.\n- **El texto sobre cada barra** es la referencia del contrato (`Contracts/0001`, `Contracts/0002`...).\n\n### Qué datos incluye\n\n- Trae **todos los contratos** del vehículo que **NO estén cancelados**.\n- Considera sólo las compañías activas en tu sesión (cookies `cids` de Odoo).\n- Si un vehículo tiene varios contratos, queda agrupado: el vehículo es el \"padre\" y cada contrato es un hijo expandible.\n\n### Qué puedes hacer\n\n- **Ver ocupación**: scroll horizontal en la barra temporal para mirar el pasado, el presente o el futuro.\n- **Abrir un contrato directamente**: clic sobre el texto de una barra (la referencia). El sistema busca el contrato por referencia y lo abre en la misma pestaña.\n- **Expandir/colapsar** un vehículo para ver sólo los que te interesan.\n\n### Limitaciones\n\n- **Es sólo lectura**: no se reservan contratos arrastrando barras. Para crear una reserva nueva tienes que ir a [Reservar Vehículo](./06-reservas.md) o [Reserva Múltiple](./06-reservas.md#b-reserva-multiple).\n- **No hay filtro por categoría** ni por fechas dentro del propio Gantt. Se navega visualmente con la barra temporal.\n\n### Ejemplos de uso\n\n- **Llama un cliente preguntando si tiene libre un coche del 15 al 20**: abres Disponibilidad, buscas el vehículo en la columna izquierda y miras si hay barras en ese rango. Si no, está libre.\n- **Quieres ver cuándo se libera el Audi A3**: clic sobre el vehículo, ves su barra en curso y la fecha de fin.\n- **Mantenimiento programado**: identificar visualmente huecos sin contratos donde puedes meter una revisión sin afectar reservas.\n\n---\n\n## Cómo se actualiza la información\n\nTanto el Panel como Disponibilidad son **vistas dinámicas en tiempo real**. Cualquier cambio (nuevo contrato, devolución, cancelación) se refleja inmediatamente al recargar la página.\n\nLos **estados de contrato** y **estados de vehículo** que alimentan las métricas se gestionan en:\n\n- Estados del vehículo → ver [03 · Flota y vehículos](./03-flota-y-vehiculos.md#estado-del-vehiculo).\n- Estados del contrato → ver [07 · Contratos](./07-contratos.md#ciclo-de-vida).\n\n---\n\n## Relacionado\n\n- [07 · Contratos](./07-contratos.md) — para entender los estados que se ven aquí.\n- [03 · Flota y vehículos](./03-flota-y-vehiculos.md) — para entender el campo \"Available Vehicles\".\n- [06 · Reservas](./06-reservas.md) — para crear nuevas reservas desde otro punto.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [01 · Introducción](./01-introduccion.md) · Siguiente: [03 · Flota y vehículos →](./03-flota-y-vehiculos.md)\n", "03-flota-y-vehiculos.md": "# 03 · Flota y Vehículos\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué es?\n\nLa flota es el catálogo de todos los **vehículos** que tu empresa alquila. Cada vehículo tiene una **ficha** con sus datos (matrícula, modelo, color, asientos, combustible, kilometraje…), sus **precios de alquiler**, sus **cargos extras** y su **estado operativo** (disponible o en mantenimiento).\n\nEl módulo amplía el modelo estándar de Flota (`fleet.vehicle`) de Odoo con la información específica del alquiler.\n\n## Cómo acceder\n\n**Vehicles Rental → Vehículos**\n\nSe muestra una lista con todos los vehículos. Las vistas disponibles son: **Lista, Kanban, Calendario, Pivot y Gráfico**.\n\n---\n\n## Estado del vehículo\n\nEl estado es la **etiqueta superior derecha** de la ficha. El módulo sustituye los estados estándar de Odoo por dos valores propios:\n\n| Estado | Color | Significado |\n|--------|-------|-------------|\n| **Operacional** | Verde | Vehículo disponible para alquilar. |\n| **En Mantenimiento** | Rojo | Vehículo bloqueado en taller o revisión. No se puede alquilar. |\n\nVisualmente verás una cinta lateral verde (*Operacional*) o roja (*En Mantenimiento*) sobre la ficha, y en las vistas lista y kanban un *badge* con el mismo color.\n\n### Botones de la cabecera\n\n| Botón | Cuándo aparece | Qué hace |\n|---|---|---|\n| **Under Maintenance** (rojo) | Estado actual = Operacional | Pasa el vehículo a *En Mantenimiento*. **Bloquea** si hay un contrato en curso con ese vehículo. |\n| **Operational** (verde) | Estado actual = En Mantenimiento | Devuelve el vehículo a *Operacional* (disponible). |\n| **Crear Solicitud de Mantenimiento** (amarillo) | Cualquier estado | Genera una nueva orden de mantenimiento programado a partir del *Horario de Mantenimiento* asignado al vehículo. Ver [10 · Mantenimiento](./10-mantenimiento-y-sustituciones.md). |\n\n> Si intentas pasar a *En Mantenimiento* un coche que tiene un contrato activo, sale un aviso: *\"Devuelve el contrato antes de pasar el vehículo a mantenimiento\"*.\n\n### Botones estadísticos (esquina superior derecha)\n\n| Botón | Qué muestra |\n|---|---|\n| **Rental Contracts** (icono taxi) | Todos los contratos donde aparece este vehículo (lista / kanban / pivot / actividad). |\n| **M. Requests** (icono engranajes) | Solicitudes de mantenimiento del vehículo. Sólo visible si hay al menos una. |\n| **Maintenance Bills** (icono dinero) | Facturas de mantenimiento (de proveedores) del vehículo. Sólo visible si hay al menos una. |\n\n---\n\n## Crear / editar un vehículo\n\n### Paso a paso\n\n1. **Vehicles Rental → Vehículos → Crear** (botón \"Nuevo\").\n2. Rellenar la cabecera:\n   - **Matrícula** (`License Plate`).\n   - **Modelo** (`Model`) — se selecciona del catálogo de modelos (Renault Master, Ford Transit, etc.). Al elegirlo, autorrellena marca, transmisión y combustible si están definidos en el modelo.\n   - **Color**.\n   - **Asientos**.\n   - **Año del modelo**.\n   - **Conductor por defecto** (`driver_id`) — opcional, asignado si el vehículo tiene un conductor habitual.\n   - **Ubicación** — texto libre o ciudad donde está aparcado.\n3. Ir a la pestaña **Rent Details** y fijar precios (al menos día, semana y mes son habituales).\n4. Ir a la pestaña **Extra Charge Details** y fijar los cargos por exceso.\n5. Asignar **Horario de Mantenimiento** (`maintenance_schedule_id`) — ver [Configuración](./15-configuracion.md#c-horarios-de-mantenimiento).\n6. Si vas a llevar control de gastos del coche, marcar **¿Hay Gastos del Vehículo?**.\n7. **Guardar**. El vehículo nace en estado **Operacional**.\n\n### Campos relevantes (heredados de Odoo)\n\n- **Conductor por defecto** — debe ser un *empleado autorizado*. Hay validación.\n- **Odómetro** y **Unidad** (km o mi).\n- **Imagen principal** — la foto del coche que aparece en la web pública.\n\n---\n\n## Pestañas de la ficha del vehículo\n\n### Pestaña \"Rent Details\" (Datos del Alquiler)\n\nAquí se configuran los **precios base** de alquiler por unidad de tiempo o distancia:\n\n| Campo | Significado |\n|---|---|\n| **Alquiler por Hora** | Precio por hora. |\n| **Alquiler por Día** | Precio por día completo. |\n| **Alquiler por Semana** | Precio por semana. |\n| **Alquiler por Mes** | Precio por mes. |\n| **Alquiler por Año** | Precio por año. |\n| **Alquiler por Kilómetro** | Precio por km recorrido. |\n| **Alquiler por Milla** | Precio por milla recorrida. |\n\n> Si tienes activado el sistema de **Tarifas dinámicas** (ver [Tarifas](./08-tarifas-seguros-depositos.md)), los precios concretos que se aplican a un contrato pueden venir de una regla de tarifa por categoría/temporada y no de estos campos. Estos campos son el **precio de respaldo** del vehículo.\n\n### Pestaña \"Extra Charge Details\" (Cargos Adicionales)\n\nEstos importes se cobran al cliente cuando **se pasa de lo contratado**:\n\n| Campo | Cuándo se cobra |\n|---|---|\n| **Cargo Extra por Hora** | Devuelve el coche más tarde, por cada hora extra. |\n| **Cargo Extra por Día** | Por cada día extra que se queda con el coche. |\n| **Cargo Extra por Semana / Mes / Año** | Idem para alquileres más largos. |\n| **Cargo Extra por Kilómetro** | Por cada km que exceda el cupo contratado. |\n| **Cargo Extra por Milla** | Idem para millas. |\n\nEstos cargos se aplican al generar la **Extra Charge Invoice** desde el contrato. Ver [07 · Contratos](./07-contratos.md#cargos-extras).\n\n### Pestaña \"Vehicle Expenses\"\n\n**Sólo aparece si has marcado la casilla \"¿Hay Gastos del Vehículo?\"**.\n\nPermite registrar gastos asociados al vehículo: combustible, peajes, multas, lavados… Cada línea tiene:\n\n- **Producto** (de tipo gasto).\n- **Importe** (con impuestos si procede).\n- **Fecha**.\n- **Distribución analítica** (cuenta analítica de costes).\n- **Recibo adjunto** (foto del ticket/factura).\n- Botón **Create Report** para enviar el gasto a aprobación.\n\nEl conductor del vehículo se hereda automáticamente como empleado responsable del gasto.\n\n> Útil para imputar el coste real de cada coche y saber qué vehículo te está dando pérdidas.\n\n### Pestañas estándar de Odoo (heredadas)\n\n- **Modelo** — marca, categoría, tipo (coche/furgoneta/etc.).\n- **Indicadores** — KPIs del vehículo.\n- **Historial de contratos** — contratos de Odoo Fleet (no confundir con los Contratos de Alquiler del módulo).\n\n---\n\n## Modelos de vehículo\n\nLos **modelos** son las plantillas que usan los vehículos: \"Ford Transit Custom 2.0 TDCI\", \"Renault Master Furgón\", \"Citroën Berlingo Combi\", etc.\n\n### Cómo acceder\n\n**Flota → Configuración → Modelos de vehículos**\n\n### Campos importantes\n\n- **Tipo de Vehículo** — el módulo añade **\"Furgoneta\" (`van`)** a los tipos estándar (Coche, Bicicleta, etc.).\n- Si el tipo es **Coche** o **Furgoneta**, se muestran dos grupos extra:\n  - **Modelo**: asientos, color por defecto, año.\n  - **Motor**: combustible, transmisión, potencia, cilindrada, emisiones.\n- Para otros tipos (bici eléctrica, patinete…), esos bloques se ocultan automáticamente.\n\n### Categorías de vehículo\n\nLas **categorías** (Tipo A, Tipo C, Tipo F, etc.) se gestionan también desde la configuración de Flota. Son **muy importantes** porque las [tarifas](./08-tarifas-seguros-depositos.md#a-tarifas-de-vehiculos), [seguros](./08-tarifas-seguros-depositos.md#b-tarifas-de-seguros) y [reglas de depósito](./08-tarifas-seguros-depositos.md#c-reglas-de-deposito) se configuran **por categoría**, no por vehículo individual.\n\nCategorías típicas del sistema:\n\n- **Tipo A** — Mini / Económico.\n- **Tipo C** — Compacto.\n- **Tipo F** — SUV.\n- **Tipo K** — Furgoneta pequeña.\n- **Tipo T, V, W, X, Z** — Variantes según tamaño/uso.\n\nCada coche tiene asignada **una sola categoría** y heredará automáticamente los precios y depósitos configurados para esa categoría.\n\n---\n\n## Ejemplos de uso\n\n### Alta de un coche nuevo en la flota\n\n> **Caso:** acabas de comprar un Renault Clio 2026, matrícula `1234ABC`, blanco, 5 asientos, gasolina, manual, categoría Tipo A.\n\n1. Menú **Vehicles Rental → Vehículos → Crear**.\n2. Matrícula: `1234ABC`, Modelo: `Renault Clio` (si no existe, crearlo primero en Modelos de vehículo), Color: blanco, Año: 2026, Asientos: 5.\n3. Confirmar que el Modelo lleva asociada la **Categoría Tipo A**.\n4. En **Rent Details** dejar los campos a 0 si vas a usar Tarifas por categoría (recomendado), o poner ahí el precio por día (40 €) y semana (210 €).\n5. En **Extra Charge Details** poner 10 €/día y 0,30 €/km como cargo por exceso.\n6. Asignar el **Horario de Mantenimiento** \"Cada 30 días\" o \"Cada 10.000 km\".\n7. Guardar.\n8. Comprobar que aparece como **Operacional** y está disponible en el [Asistente de Reserva](./06-reservas.md).\n\n### Pasar un coche a mantenimiento\n\n1. Abrir la ficha del vehículo.\n2. Botón **Under Maintenance** (rojo) en la cabecera.\n3. El sistema valida que NO haya contratos en curso con ese coche.\n4. Si todo OK, el estado pasa a **En Mantenimiento** y la cinta lateral cambia a roja.\n5. El vehículo deja de aparecer en el asistente de reserva.\n6. Cuando vuelve del taller, pulsar **Operational** (verde) para reactivarlo.\n\n### Quitar un vehículo del catálogo sin borrarlo\n\nNo hay un botón \"dar de baja\" propio. Lo recomendable es **archivar** el vehículo desde la cabecera (icono estrella en la esquina superior derecha — *Acción → Archivar*). Queda invisible para nuevas reservas pero sigue en el histórico.\n\n---\n\n## Validaciones y restricciones\n\n- **Conductor por defecto** debe ser un empleado válido (si activas el sistema de conductor obligatorio).\n- **Matrícula** debería ser única en la flota (Odoo lo respeta a nivel de unicidad por compañía).\n- **No puedes pasar a En Mantenimiento** un vehículo con contrato activo. Devuelve el contrato primero.\n- **El kilometraje** sólo se puede actualizar al alza desde el contrato (el botón *Update Vehicle Data* del contrato avisa si el odómetro nuevo es menor que el actual).\n\n---\n\n## Relacionado\n\n- [02 · Panel y disponibilidad](./02-panel-y-disponibilidad.md) — para ver ocupación visual de la flota.\n- [06 · Reservas](./06-reservas.md) — el vehículo se selecciona dentro del asistente de reserva.\n- [07 · Contratos](./07-contratos.md) — el contrato usa la información de la ficha del vehículo.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — los precios reales se configuran por categoría.\n- [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md) — solicitudes de mantenimiento y horarios.\n- [15 · Configuración](./15-configuracion.md) — gestión de horarios y categorías.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [02 · Panel y disponibilidad](./02-panel-y-disponibilidad.md) · Siguiente: [04 · Clientes →](./04-clientes.md)\n", "04-clientes.md": "# 04 · Clientes\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué es?\n\nLos **clientes** son los contactos (`res.partner` en términos de Odoo) que alquilan vehículos. Pueden ser:\n\n- **Particulares** — personas físicas con DNI/NIE.\n- **Empresas** — personas jurídicas con CIF.\n\nEl módulo no añade un modelo nuevo de cliente: reutiliza el de Odoo (**Contactos**). Pero exige unos datos extra para el alquiler que se rellenan en el contrato y se conservan asociados al cliente: **DNI/NIE, carnet de conducir, dirección, fecha de nacimiento**.\n\nAdemás, cada contrato puede llevar **documentos escaneados del cliente** (foto del carnet, del DNI…) que se almacenan en un repositorio centralizado.\n\n## Cómo acceder\n\n**Vehicles Rental → Clientes**\n\nEsta entrada de menú abre la **lista de contactos estándar de Odoo** (la misma que aparece en el menú \"Contactos\"). Es decir, todos los contactos de Odoo, no sólo los clientes de alquiler.\n\n> Si quieres filtrar sólo los que han tenido contratos de alquiler, puedes aplicar el filtro **\"Contratos > 0\"** en la barra de búsqueda.\n\n---\n\n## Alta de un cliente\n\n### Paso a paso (manual)\n\n1. **Vehicles Rental → Clientes → Crear** (botón \"Nuevo\").\n2. Rellenar el **nombre** (persona o empresa).\n3. Marcar **Individual** o **Empresa** según el caso.\n4. Cumplimentar:\n   - **Email**.\n   - **Teléfono**.\n   - **Dirección**: calle, ciudad, código postal, provincia, país.\n   - **NIF / DNI** (en el campo VAT/CIF estándar de Odoo, o en un campo personalizado del contrato).\n5. **Guardar**.\n\n> En el alquiler, lo más eficiente es **no crear el cliente desde aquí**. Es mejor que se cree automáticamente al procesar una [consulta de reserva web](./05-consultas-web-y-leads.md) o desde el [asistente de reserva](./06-reservas.md). Ambos crean el contacto automáticamente si no existe (buscan primero por email/teléfono).\n\n### Alta automática desde la web\n\nCuando un cliente paga una reserva en la web pública con Redsys:\n\n1. El sistema busca un contacto existente por **email** y, si no, por **teléfono**.\n2. Si lo encuentra: actualiza la dirección con los datos del formulario.\n3. Si NO lo encuentra: crea un contacto nuevo con `customer_rank = 1` (marcado como cliente).\n\nDe esta forma no se duplican contactos cuando un mismo cliente alquila varias veces.\n\n---\n\n## Datos requeridos para alquilar\n\nCuando se crea un contrato de alquiler, **además de los datos básicos**, hacen falta estos campos:\n\n### Identificación\n\n- **DNI / NIE / Pasaporte**.\n- **Fecha de expiración del DNI**.\n- **Fecha de nacimiento** (importante: determina si es un *conductor especial* de menos de 25 o más de 60 años, lo que afecta al precio del seguro).\n\n### Carnet de conducir\n\n- **Número de carnet**.\n- **Fecha de expedición**.\n- **Fecha de caducidad**.\n\n> Estos campos se rellenan dentro del propio contrato (en el bloque \"Carnet de Conducir\") y se conservan asociados al cliente para futuras reservas.\n\n### Dirección postal\n\n- Calle (línea 1), Calle 2 (opcional), Ciudad, Código Postal, Provincia, País.\n\n---\n\n## Documentos del cliente\n\n### ¿Qué es?\n\nCada contrato puede llevar adjuntos los **escaneos o fotos** de los documentos del conductor: copia del DNI, del carnet de conducir, del pasaporte… Es un repositorio centralizado para que cualquier operario pueda recuperarlos sin tener que abrir los correos del cliente.\n\n### Cómo acceder\n\n**Acceso directo**: dentro de cada contrato hay un botón estadístico **Documents** que abre los documentos vinculados.\n\n**Acceso global**: no hay una entrada de menú propia; los documentos viven dentro del contrato y se gestionan en línea desde la pestaña/lista correspondiente.\n\n### Tipos de documento\n\nEl campo \"Tipo de documento\" tiene estos valores predefinidos:\n\n| Valor interno | Etiqueta visible |\n|---|---|\n| `driving_license` | Carnet de conducir |\n| `passport` | Pasaporte |\n| `aadhaar_card` | Aadhaar card (India) |\n| `voter_id_card` | Voter ID card |\n| `ration_card` | Ration card |\n| `photo_id_card` | Documento con foto / DNI |\n\n> Los tipos *Aadhaar*, *Voter ID* y *Ration card* son los típicos de la India (el módulo original es de un proveedor indio). En la práctica, los relevantes en España son **Carnet de Conducir**, **Pasaporte** y **Photo ID / DNI**.\n\n### Cómo subir un documento\n\n1. Abrir el contrato del cliente.\n2. Pulsar el botón estadístico **Documents** (esquina superior derecha del contrato).\n3. **Crear** una nueva línea:\n   - **Tipo de documento**: elegir el tipo.\n   - **Documento**: arrastrar el archivo o pulsar el botón de subida (PDF, JPG, PNG…).\n   - **Nombre del fichero** se rellena solo.\n4. **Guardar**.\n\nEl documento queda vinculado al contrato y al vehículo. Cuando el contrato pasa a estado **Devuelto**, ya **NO se pueden añadir** más documentos a ese contrato (queda cerrado documentalmente).\n\n### Recuperar documentos\n\nDesde cualquier contrato del mismo cliente, los documentos que se subieron en contratos anteriores **no aparecen automáticamente** — están vinculados al contrato concreto donde se subieron. Si necesitas verlos, abre el contrato anterior del cliente.\n\n---\n\n## Portal del cliente\n\nOdoo permite que cada cliente acceda a un **portal web privado** donde ve sus reservas, facturas y datos personales. El módulo Vehicle Rental hereda esta funcionalidad estándar.\n\n### Acceso del cliente al portal\n\n1. Desde el contacto, el operario pulsa **Acción → Conceder acceso al portal**.\n2. Se introduce el email del cliente.\n3. Odoo le manda un email con un enlace para crear contraseña.\n4. El cliente entra en `https://<tu-dominio>/my` y ve:\n   - Sus **facturas** (puede descargarlas en PDF y pagarlas con Redsys).\n   - Sus **pedidos de venta** (si los hay).\n   - Sus **consultas de reserva**.\n\n### Qué NO ve el cliente en el portal\n\n- Los **contratos de alquiler** (`vehicle.contract`) no tienen vista de portal pública por defecto en este módulo. Si necesitas que el cliente vea su contrato, mándale el PDF por email con el botón [Enviar Contrato](./07-contratos.md#boton-enviar-contrato).\n\n---\n\n## Ejemplos de uso\n\n### Dar de alta a un cliente que llega presencialmente\n\n> **Caso:** Juan García viene a alquilar un coche. No tiene cuenta todavía.\n\n1. Lo más eficiente: ir directamente al [Asistente de Reserva](./06-reservas.md). Cuando rellenes el campo *Cliente*, escribe el nombre y pulsa **\"Crear nuevo\"** → Odoo abrirá la ficha de contacto para que rellenes email, teléfono y dirección.\n2. Una vez creado, el asistente continúa con la reserva normal.\n\n### Cliente recurrente con varios alquileres\n\n> **Caso:** María López ya alquila por tercera vez.\n\n1. En el asistente de reserva, en *Cliente*, **buscar su nombre o email**. Odoo lo encuentra inmediatamente.\n2. Los datos personales (DNI, dirección…) que rellenaste la primera vez se pueden copiar a mano al nuevo contrato, pero **no se autorrellenan al 100%** porque el módulo guarda algunos datos (DNI, carnet) **en el contrato**, no en el contacto. Conviene comprobarlos cada vez.\n\n### Cliente que reservó por web\n\n> **Caso:** Carlos Sánchez pagó una reserva online el sábado a las 22:00.\n\n1. El sistema le **creó solo un Lead** (Consulta de Reserva) y un contacto nuevo.\n2. El lunes, recepción abre **Consultas de Reserva**, ve el lead de Carlos con TODOS sus datos (DNI, dirección, carnet, fecha de nacimiento, depósito ya pagado).\n3. Pulsa **Convertir a Oportunidad** y luego **Crear Contrato** → el contrato sale ya con todos los datos del cliente precargados.\n\n---\n\n## Validaciones y errores\n\n- **Email duplicado**: Odoo no obliga a que el email sea único, pero la búsqueda automática del cliente desde la web sí usa el email como criterio de identificación. Procurar no duplicar contactos.\n- **DNI / Carnet caducados**: el sistema NO bloquea automáticamente si el DNI o el carnet están caducados. Es responsabilidad del operario revisar las fechas de expiración antes de cerrar el contrato.\n\n---\n\n## Relacionado\n\n- [05 · Consultas web y leads](./05-consultas-web-y-leads.md) — alta automática del cliente al pagar online.\n- [06 · Reservas](./06-reservas.md) — el cliente se selecciona o se crea desde el asistente.\n- [07 · Contratos](./07-contratos.md) — donde se rellenan los datos completos (DNI, carnet, dirección).\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [03 · Flota y vehículos](./03-flota-y-vehiculos.md) · Siguiente: [05 · Consultas web y leads →](./05-consultas-web-y-leads.md)\n", "05-consultas-web-y-leads.md": "# 05 · Consultas Web y Leads\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué es una Consulta de Reserva?\n\nUna **Consulta de Reserva** es un Lead u Oportunidad del CRM de Odoo enriquecido con datos específicos del alquiler (vehículo, categoría, fechas, datos del conductor). Sirve para tres cosas:\n\n1. **Recoger una petición de la web pública**: cuando un cliente reserva y paga online, el sistema crea automáticamente una consulta para que el equipo la procese.\n2. **Permitir el alta manual**: el comercial puede crear una consulta antes de generar el contrato (útil para reservas pendientes de confirmar por teléfono).\n3. **Bloquear huecos de disponibilidad**: una consulta abierta con categoría + fechas reserva virtualmente un hueco de esa categoría, evitando sobre-reservas.\n\n> Una consulta **NO es un contrato**. Es interés/intención de alquilar. El paso del lead al contrato lo hace el operario expresamente.\n\n---\n\n## Cómo acceder\n\n**Vehicles Rental → Consultas de Reserva**\n\nSe abre una vista **Kanban + Formulario** filtrada automáticamente para mostrar sólo los Leads cuyo nombre contenga `Consulta de Reserva` y estén en la **primera etapa** del pipeline (las consultas pendientes de procesar).\n\nEs la \"bandeja de entrada\" de reservas web.\n\n---\n\n## ¿Cómo llegan las consultas?\n\n### Origen 1 — Desde la web pública\n\nCuando un cliente:\n\n1. Entra en `https://<tu-dominio>/web/booking-enquiry`.\n2. Selecciona una categoría de vehículo.\n3. Elige fechas, ubicación y rellena el formulario completo (datos de contacto, DNI, carnet, dirección, tarjeta).\n4. Paga el **depósito** con Redsys.\n5. Al volver de la pasarela en `/rental/success`, el sistema:\n   - Crea/recupera el **contacto** (busca primero por email, luego por teléfono).\n   - Genera el **Lead/Oportunidad** llamado `Consulta de Reserva - <Nombre del cliente>`.\n   - Crea automáticamente la **factura del depósito** y la marca como pagada.\n\nVer [13 · Portal web público](./13-portal-web-publico.md) para el detalle del flujo web.\n\n### Origen 2 — Manual desde el backend\n\nEl comercial puede crear un Lead desde:\n\n- **CRM → Pipeline → Crear** (lead estándar de Odoo).\n- O directamente desde **Consultas de Reserva → Crear**.\n\nY rellenar a mano todos los campos del alquiler.\n\n### Origen 3 — Formulario de contacto web\n\nSi el cliente usa el formulario genérico de **`/contactus`** (no el de booking), también se genera un Lead, pero **sin datos de alquiler**. Es un lead \"frío\" que requiere contactar al cliente para sacar info.\n\n---\n\n## Campos específicos del módulo\n\nDentro de la ficha del Lead, en una pestaña adicional llamada **\"Detalles de Consulta de Reserva\"**, se ven estos campos extra:\n\n### Bloque \"Detalles\"\n\n| Campo | Significado |\n|---|---|\n| **Vehículo** | Vehículo concreto solicitado (sólo se permite elegir uno en estado *Disponible*). |\n| **Categoría** | Se rellena sola al elegir el vehículo. |\n| **Nº de asientos** | Informativo, heredado del vehículo. |\n| **Fecha de recogida** | Día de inicio del alquiler. |\n| **Fecha de devolución** | Día de fin del alquiler. |\n| **Hora de inicio / Hora de fin** | Texto, formato `09:00`. |\n| **Contrato** | Sólo aparece si ya se generó el contrato (sólo lectura). |\n| **Categoría seleccionada** | La que escogió el cliente en la web. Permite asignar luego cualquier vehículo de esa categoría. |\n| **Precio de Reserva** | Lo que pagó el cliente online. |\n| **Ubicación de Recogida** | Ciudad/delegación donde recoge. |\n\n### Bloque \"Datos de Identificación del Cliente\"\n\n| Campo | Significado |\n|---|---|\n| **DNI / NIE** | Documento de identidad. |\n| **Fecha de expiración del DNI** | Para validar que está vigente. |\n| **Domicilio** | Dirección completa. |\n| **Fecha de nacimiento** | Para determinar si es *conductor especial* (<25 o >60). |\n| **Carnet de Conducir** | Número de carnet. |\n| **Fecha expedición del carnet** | |\n| **Fecha de caducidad del carnet** | |\n\nCada Lead recibe además un **token de acceso interno** (no se ve en pantalla) usado para construir enlaces seguros del cliente.\n\n---\n\n## Estados del lead\n\nEl módulo usa la **pipeline estándar de CRM** de Odoo (Nuevo · Cualificado · Propuesta · Ganado · …) con algunos matices:\n\n| Estado | Comportamiento |\n|---|---|\n| **Nueva** (primera etapa) | La consulta entra aquí al crearse. Está **bloqueando un hueco** de su categoría. |\n| **En cualquier etapa abierta** | Si todavía no tiene contrato, sigue bloqueando hueco. |\n| **Ganado** | Deja de bloquear hueco (próximo paso: crear el contrato real). |\n| **Perdido** | Libera el hueco. |\n| **Descartado / Cancelado** | Libera el hueco. |\n\n> El botón nativo morado **\"Ganado\"** de Odoo se oculta si la consulta ya tiene vehículo asignado, para forzar el uso del flujo propio del módulo (Convertir a Oportunidad → Crear Contrato) y evitar errores con la fecha de cierre.\n\n---\n\n## Acciones disponibles desde la ficha del Lead\n\nEn la cabecera del Lead aparecen botones contextuales según el estado:\n\n| Botón | Cuándo aparece | Qué hace |\n|---|---|---|\n| **Convertir a Oportunidad** (gris) | Lead de tipo lead, con vehículo asignado, sin contrato | Convierte el lead en oportunidad. Si no hay contacto, lo crea (busca por email, luego teléfono, y si no existe lo da de alta). Si no había vehículo concreto pero sí categoría, **asigna automáticamente el primer vehículo disponible de esa categoría**. Marca probabilidad 100%. |\n| **Crear Contrato** (resaltado) | Oportunidad ganada / lead con vehículo, sin contrato todavía | Abre el wizard de conversión a contrato (ver sección siguiente). |\n| **Imprimir Contrato** (icono impresora) | Si ya hay contrato | Genera el PDF del contrato. |\n| **Enviar Contrato** (icono sobre, verde) | Si ya hay contrato | Envía un email al cliente con el PDF adjunto, usando la plantilla `email_template_vehicle_contract`. Si la plantilla no existe, muestra error. |\n\n---\n\n## Convertir un Lead en Contrato\n\n### Cuándo se usa\n\nCuando una consulta ya tiene la información mínima (cliente, vehículo o categoría, fechas) y queremos materializarla como **contrato real de alquiler**.\n\n### Paso a paso\n\n1. Abrir la consulta desde **Vehicles Rental → Consultas de Reserva**.\n2. Revisar/cualificar los datos del cliente y del vehículo.\n3. Si no tiene vehículo concreto asignado, pulsar **Convertir a Oportunidad** — el sistema asigna automáticamente el primer vehículo disponible de la categoría.\n4. Pulsar **Crear Contrato**. Se abre el wizard \"Crear Contrato de Vehículo\".\n\n### Qué pide el wizard\n\nEs una ventana modal con dos bloques:\n\n**Bloque \"Información del Cliente y Vehículo\"**\n\n| Campo | Notas |\n|---|---|\n| **Cliente** | Obligatorio. Hereda del Lead. NO se puede crear uno nuevo desde aquí. |\n| **Tipo de Vehículo** (Categoría) | Sólo lectura. La que tenía el Lead. |\n| **Buscar por Marca/Modelo** | Texto libre, ej. `Mercedes` o `Sprinter`. Filtra los vehículos disponibles. |\n| **Vehículo Disponible** | Obligatorio. Desplegable filtrado por estado *Disponible* + misma compañía + misma categoría. Si el Lead ya traía vehículo, se preselecciona; si solo había categoría, se elige el primer disponible. |\n\n**Bloque \"Fechas del Alquiler\"**\n\n| Campo | Notas |\n|---|---|\n| **Fecha de Recogida** | Obligatorio. Combina `start_date + start_time` del lead. |\n| **Fecha de Devolución** | Obligatorio. Combina `end_date + end_time` del lead. |\n\n### Qué se valida internamente\n\nEl wizard busca, **a la sombra**, la **transacción Redsys** asociada al cliente (por email, en las últimas 48h). De esa transacción extrae:\n\n- `selected_price` → precio por día.\n- `total_price` → total pagado.\n- `num_days` → días reservados.\n- Ubicación de recogida.\n\nSi no encuentra precio por día explícito, lo calcula dividiendo el importe total entre los días. También detecta la provincia (state) buscando el nombre dentro de España.\n\n### Qué genera al confirmar (botón \"Crear Contrato\")\n\n1. **Un Pedido de Venta (`sale.order`)** vinculado al Lead:\n   - Compañía del vehículo.\n   - Producto `vehicle_rent_charge`.\n   - Cantidad = días.\n   - Precio unitario = tarifa diaria.\n   - Descripción con marca, modelo, matrícula, periodo y nº de días.\n   - **Se confirma automáticamente** (estado *sale*) porque el pago ya está realizado.\n\n2. **Un Contrato de Vehículo (`vehicle.contract`)** con:\n   - Cliente + teléfono + email.\n   - DNI, expiración del DNI, dirección, nº de carnet, fechas de expedición y caducidad (todo copiado del Lead).\n   - Vehículo + modelo + año + transmisión + combustible.\n   - Fechas de recogida y devolución.\n   - Ciudad/provincia/país (basadas en la ubicación de la web).\n   - Tarifa por día + tipo `días`.\n   - **Motivo de descuento**: `Precio de reserva web` (para evitar la validación que pide motivo si el precio difiere del calculado).\n   - Vinculación al Lead (`crm_lead_id`) y al Sale Order (`sale_order_id`).\n\n3. **Una línea de pago Redsys** dentro de los \"Detalles de pago del vehículo\" del contrato, con:\n   - Referencia de la transacción.\n   - Fecha de hoy.\n   - Importe total pagado.\n\n4. El **Lead queda enlazado al contrato** (`contract_id`). A partir de aquí ya no aparece el botón \"Crear Contrato\" y sí aparecen \"Imprimir Contrato\" y \"Enviar Contrato\".\n\nAl terminar, **se abre directamente la ficha del contrato recién creado**.\n\n---\n\n## Errores y validaciones comunes\n\n| Error | Causa | Solución |\n|---|---|---|\n| El cliente y/o vehículo está vacío al pulsar Crear Contrato | Faltan datos en el Lead | Rellenarlos manualmente o usar Convertir a Oportunidad. |\n| No se crea el Pedido de Venta | No existe el producto `vehicle_rent_charge` en la base | Crear el producto (ver [Configuración](./15-configuracion.md)). El contrato se crea igualmente. |\n| Contrato sin precio o sin línea de pago | La transacción Redsys no se encontró (cliente sin email, o > 48h desde el pago) | Ajustar precio a mano en el contrato y registrar manualmente el pago. |\n| El botón \"Enviar Contrato\" da error | La plantilla `email_template_vehicle_contract` no está cargada | Verificar instalación; reinstalar o cargar el dato `data/email_templates.xml`. |\n\n---\n\n## Ejemplos de uso\n\n### Cliente que pagó por web el viernes a las 23:00\n\n> **Caso:** El sábado por la mañana, el operario abre **Consultas de Reserva**.\n\n1. Ve un lead nuevo \"Consulta de Reserva - Pedro Sánchez\" con etiqueta naranja.\n2. Lo abre y revisa: tiene vehículo de la categoría Tipo C, fechas 10-15 de junio, DNI 12345678X, carnet con fecha de caducidad 2031, dirección completa, depósito de 150 € ya pagado.\n3. Pulsa **Convertir a Oportunidad** → el sistema asigna un Renault Megane (primer disponible de Tipo C).\n4. Pulsa **Crear Contrato** → se abre el wizard precargado, confirma fechas, **Crear**.\n5. El contrato sale en estado *Borrador* con todos los datos rellenos y la línea de pago Redsys ya registrada.\n6. Revisa, pulsa **In Progress** para activarlo, **Enviar Contrato** para mandar el PDF al cliente, y le concierta la cita de recogida.\n\n### Cliente que llama por teléfono pidiendo presupuesto\n\n> **Caso:** Una empresa quiere alquilar 2 furgonetas durante 3 meses.\n\n1. Recepción abre **CRM → Pipeline → Crear** (lead nuevo).\n2. Tipo: **Lead**.\n3. Rellena nombre de la empresa, teléfono, email.\n4. En la pestaña \"Detalles de Consulta de Reserva\", indica categoría (Tipo K, Tipo W) y fechas aproximadas.\n5. Guarda. Llama al cliente, le pasa presupuesto, el cliente acepta.\n6. **Convertir a Oportunidad**, **Crear Contrato** (o, mejor, **Reserva Múltiple** si son varios coches — ver [06 · Reservas](./06-reservas.md#b-reserva-multiple)).\n\n### Consulta web fallida (pago rechazado)\n\nSi Redsys rechaza el pago, el cliente vuelve a `/rental/error` y **NO se crea el lead**. Si quieres rescatar al cliente, mira en **Configuración técnica → Transacciones de pago** y busca su email/teléfono — desde ahí puedes contactarlo manualmente.\n\n---\n\n## Relacionado\n\n- [04 · Clientes](./04-clientes.md) — alta automática del contacto al recibir el lead.\n- [06 · Reservas](./06-reservas.md) — el asistente equivalente para reservas manuales sin lead web.\n- [07 · Contratos](./07-contratos.md) — el contrato que se genera al convertir el lead.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — la transacción de pago que alimenta al lead.\n- [13 · Portal web público](./13-portal-web-publico.md) — el formulario que el cliente rellena.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [04 · Clientes](./04-clientes.md) · Siguiente: [06 · Reservas →](./06-reservas.md)\n", "06-reservas.md": "# 06 · Reservas\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué encontrarás aquí?\n\nDos asistentes (wizards) que crean contratos desde cero:\n\n1. **Reservar Vehículo** — para una reserva con **un único vehículo**.\n2. **Reserva Múltiple** — para alquilar **varios vehículos al mismo cliente** en la misma operación.\n\nPara procesar reservas que vienen ya pagadas desde la web, ve a [05 · Consultas web y leads](./05-consultas-web-y-leads.md).\n\n---\n\n## A. Asistente de Reserva (un vehículo)\n\n### Cómo acceder\n\n**Vehicles Rental → Reservar Vehículo**\n\nSe abre directamente una ventana modal grande con el asistente `rental.contract.booking`.\n\n### ¿Cuándo usarlo?\n\n- El cliente **llama por teléfono** o viene al mostrador.\n- Reserva **manual**, sin pago previo por web.\n- Se quiere usar el sistema de **tarifas dinámicas** (precio calculado por categoría + duración + km).\n\n### Estructura del asistente\n\nEl formulario tiene **tres grupos de campos** y una **pestaña con resultados**.\n\n#### Datos básicos (obligatorios)\n\n| Campo | Notas |\n|---|---|\n| **Cliente** | Many2one a Contactos. Si no existe, hay que crearlo primero desde *Contactos*. Desde este wizard NO se crea. |\n| **Compañía** | Se rellena con la compañía activa del usuario. |\n| **Pick-up Date** | Fecha y hora de recogida. |\n| **Drop-off Date** | Fecha y hora de devolución. |\n\n#### Datos de tarifa\n\n| Campo | Notas |\n|---|---|\n| **Tipo de Vehículo** (Categoría) | Obligatorio. Filtrará los vehículos disponibles. |\n| **Duración** | Desplegable dinámico: sus valores se leen de las **reglas de tarifa** activas. Típicamente: `4h`, `1-2d`, `3-5d`, `6-10d`, `11-20d`, `21-29d`. Al cambiarla, **autocompleta la fecha de fin** sumando los días mínimos a la fecha de inicio. |\n| **Buscar por marca o modelo** | Texto libre, opcional. Filtra la lista de vehículos. |\n| **Rango de Km** | Desplegable dinámico. Los km incluidos en el alquiler (100, 350, 500, 650, 850, sin límite). |\n| **Tipo de Tarifa** | Por defecto `standard`. También puede ser `FLEXIRENT` u otros tipos definidos en las reglas. |\n| **Tarifa (€/día)** | **Calculado y sólo lectura.** Se calcula cruzando categoría + duración + km + tipo contra `vehicle.pricing.rule`. Si no hay regla aplicable, queda en 0. |\n\n> El campo Tarifa se recalcula automáticamente cada vez que cambias cualquiera de los criterios anteriores.\n\n#### Pestaña \"Vehículos Disponibles\"\n\n**Sólo aparece** si están definidos categoría y fechas. Es una tabla con:\n\n- Nombre del vehículo.\n- Modelo.\n- Matrícula.\n- Año.\n- Transmisión.\n- Combustible.\n- Categoría.\n\nCada fila lleva un botón **\"Reservar\"** (azul, contorno).\n\n### Cómo se calcula la disponibilidad\n\nLa tabla se filtra automáticamente cuando cambian los criterios. Los vehículos que aparecen cumplen TODO esto:\n\n1. Vehículos de la **compañía activa**.\n2. Estado = **Disponible** (no en mantenimiento).\n3. Misma **categoría** (directa o por modelo).\n4. **NO tienen contratos en curso o devueltos** que se solapen con las fechas elegidas.\n5. **NO tienen contratos en borrador** con vehículo asignado solapado.\n6. Si hay texto en *Buscar*, su nombre o modelo coincide parcialmente.\n\n### Paso a paso típico\n\n1. Abre **Reservar Vehículo**.\n2. Elige el **Cliente** (lo buscas por nombre o email).\n3. Indica **Pick-up Date** y **Drop-off Date**.\n4. Elige **Tipo de Vehículo** (categoría).\n5. Opcionalmente ajusta **Duración** y **Rango de Km** — el sistema calcula la tarifa €/día.\n6. Mira la pestaña **Vehículos Disponibles**: aparece la lista filtrada.\n7. Pulsa **Reservar** en la fila del vehículo que quieras.\n8. El sistema crea un **contrato en Borrador** y abre directamente su ficha.\n\n### Qué crea al pulsar \"Reservar\"\n\nGenera un **contrato de vehículo (`vehicle.contract`)** con:\n\n- Vehículo + conductor por defecto + matrícula + odómetro inicial + unidad + año + transmisión + combustible (todo heredado del vehículo).\n- Cliente + teléfono + email.\n- Fechas de inicio y fin del wizard.\n- Compañía activa.\n- **Tarifa (`rent`)** = el precio calculado.\n- **Tipo de alquiler** = `días`.\n- **Tipo de tarifa** = el seleccionado.\n\nA partir de aquí continúa el flujo del contrato (ver [07 · Contratos](./07-contratos.md)): rellenar DNI/carnet, confirmar In Progress, etc.\n\n### Diferencia con \"Crear Contrato\" desde un Lead\n\n| Aspecto | Reservar Vehículo | Crear Contrato desde Lead |\n|---|---|---|\n| **Origen** | Manual, sin lead | Lead web ya pagado |\n| Cliente | Hay que elegirlo | Hereda del Lead |\n| DNI / carnet / dirección | NO se rellenan | Sí, copia del Lead |\n| **Tarifa** | Calculada por reglas de pricing | Sale del importe Redsys pagado |\n| **Genera Pedido de Venta** | No | Sí, confirmado |\n| **Genera línea de pago Redsys** | No | Sí (importe pagado) |\n| **Vincula Lead** | No | Sí |\n\n---\n\n## B. Reserva Múltiple\n\n### ¿Qué es?\n\nPermite alquilar a un **mismo cliente varios vehículos en la misma operación**, generalmente con condiciones comunes (mismo tipo de pago, misma tarjeta de depósito) pero con fechas y vehículos distintos. Al confirmar se generan **un Contrato Grupo \"paraguas\" + un contrato individual por cada vehículo**.\n\n### Ejemplo de caso real\n\n> **Caso:** Juan Pérez quiere alquilar un Tipo A del 1 al 7 de junio Y un Tipo K del 3 al 5 de junio.\n>\n> Se crea **una sola Reserva Múltiple `BR/00001`**, se añaden las dos líneas, y al pulsar \"Crear Reserva Múltiple\" se generan:\n> - El **Contrato Grupo** (con cliente Juan, fechas 1-7 junio).\n> - El **contrato del Tipo A** (1-7 junio).\n> - El **contrato del Tipo K** (3-5 junio).\n> - Todos a nombre de Juan, con la misma tarjeta de depósito.\n\n### Cómo acceder\n\n**Vehicles Rental → Reserva Múltiple**\n\nLista con:\n\n| Columna | Significado |\n|---|---|\n| Referencia | Autonumerada (`BR/00001`...). |\n| Cliente | Quien alquila. |\n| Nº de vehículos | Líneas creadas. |\n| Tipo de pago | Diario / Semanal / Mensual / Pago Completo / etc. |\n| Estado | *Borrador* (azul) · *Completada* (verde) · *Cancelada* (gris tachado). |\n| Grupo Creado | Sólo aparece cuando ya se generó. |\n| Fecha de creación | Cuándo se hizo. |\n\n### Formulario de Reserva Múltiple\n\n#### Cabecera\n\n- Barra de estado: `Borrador → Completada`.\n- **Botones**:\n\n| Botón | Cuándo aparece | Qué hace |\n|---|---|---|\n| **Añadir Vehículo** (verde, icono `+`) | Sólo en Borrador | Abre el wizard de Reservar Vehículo en *modo Reserva Múltiple*. |\n| **Crear Reserva Múltiple** (verde, check) | Sólo en Borrador con ≥ 1 línea | Lanza un diálogo de confirmación: *\"Se crearán el contrato grupo y los contratos individuales. ¿Continuar?\"*. |\n| **Cancelar** (gris) | Cualquier estado | Cambia a *Cancelada*. Confirmación previa: *\"¿Cancelar esta reserva múltiple?\"*. |\n\n#### Cuerpo\n\n| Campo | Notas |\n|---|---|\n| **Referencia** | Autonumerada. Hasta confirmar, muestra `Borrador`. |\n| **Cliente** | Obligatorio. NO se puede crear desde aquí. Sólo lectura tras confirmar. |\n| **Tipo de Pago** | Diario / Semanal / Mensual / Trimestral / Anual / **Pago Completo** (por defecto). |\n| **Tipo de Tarjeta** | Débito / Crédito (por defecto Débito) — afecta al depósito de los contratos hijos. |\n| **Grupo Creado** | Enlace sólo lectura al `vehicle.contract.group` resultante. |\n| **Observaciones** | Textarea libre. Sólo visible/editable en Borrador. |\n\n#### Tabla \"Vehículos seleccionados\"\n\n| Columna | Notas |\n|---|---|\n| Vehículo | El que se va a alquilar. |\n| Matrícula | Auto. |\n| Categoría | Auto. |\n| Fecha de recogida | De ese vehículo. |\n| Fecha de devolución | De ese vehículo. |\n| Tipo de tarifa | Estándar / FLEXIRENT. |\n| Precio/día | Calculado por reglas. |\n\n> Las líneas **no se pueden crear ni editar directamente en la tabla**. Se añaden con el botón **Añadir Vehículo** (que abre el asistente con el cliente prefijado). Sí se pueden **borrar** desde aquí mientras estamos en Borrador.\n\n### Flujo paso a paso\n\n1. **Vehicles Rental → Reserva Múltiple → Crear** (botón \"Nuevo\").\n2. Elegir **Cliente**, **Tipo de Pago** y **Tipo de Tarjeta**.\n3. Pulsar **Añadir Vehículo**. Se abre el asistente `rental.contract.booking` en modo Reserva Múltiple:\n   - Cliente y Compañía aparecen **bloqueados** (sólo lectura).\n   - Sale un aviso azul: *\"Modo Reserva Múltiple: al pulsar 'Reservar' el vehículo se añadirá a la reserva múltiple\"*.\n   - El operario elige categoría, fechas, duración, km y tarifa.\n   - Selecciona un vehículo de la lista y pulsa **Reservar**.\n   - Vuelve a la Reserva Múltiple con una **línea nueva**.\n4. **Repetir** tantas veces como vehículos hagan falta. Cada vehículo puede tener fechas distintas.\n5. Pulsar **Crear Reserva Múltiple** → confirmar el diálogo.\n\n### Qué crea al confirmar\n\n#### Un Contrato Grupo (`vehicle.contract.group`)\n\n- **Cliente, compañía, tipo de pago, tipo de tarjeta, observaciones**.\n- **Fecha de inicio** = la **más temprana** de todas las líneas.\n- **Fecha de fin** = la **más tardía** de todas las líneas.\n\n#### Un contrato `vehicle.contract` por cada línea\n\nTodos enlazados al grupo (`group_id`), cada uno con:\n\n- Su **vehículo** y **fechas individuales**.\n- Su **tarifa**.\n- **Motivo de descuento**: `Reserva múltiple <nombre del grupo>`.\n- Tipo de tarjeta y tipo de pago **heredados del grupo**.\n- Datos del cliente.\n\n#### La Reserva Múltiple pasa a Completada\n\nQueda enlazada al grupo creado, y **se abre automáticamente la ficha del Contrato Grupo**.\n\n### Validaciones\n\n- **No se puede añadir vehículo sin cliente** → error: *\"Seleccione un cliente antes de añadir vehículos.\"*\n- **No se puede confirmar si no hay líneas** → error: *\"Añada al menos un vehículo.\"*\n- En el asistente, si la reserva múltiple ya no existe (borrada en otra pestaña): *\"La reserva múltiple ya no existe.\"*\n- Sólo se puede editar/cancelar mientras esté en **Borrador**.\n\n### Diferencia con Contrato Grupo manual\n\nEl **Contrato Grupo** (`vehicle.contract.group`) se puede crear también **a mano** desde el menú **Contratos Grupo** y añadir contratos uno a uno. Pero el flujo **Reserva Múltiple** es más rápido si sabes desde el principio que vas a alquilar varios coches: hace todo en una sola operación.\n\nVer [07 · Contratos · Contratos en grupo](./07-contratos.md#contratos-en-grupo) para más detalles del grupo.\n\n---\n\n## Comparativa rápida de los tres caminos\n\n| Camino | Cuándo se usa | Pago previo | Genera |\n|---|---|---|---|\n| **Reservar Vehículo** | Recepción / teléfono, un coche | No | 1 contrato |\n| **Reserva Múltiple** | Recepción, varios coches mismo cliente | No | 1 grupo + N contratos |\n| **Convertir Lead → Contrato** | Cliente reservó por web | Sí (Redsys) | 1 contrato + 1 Sale Order + línea de pago |\n\n---\n\n## Errores y validaciones comunes\n\n| Mensaje | Causa | Solución |\n|---|---|---|\n| \"Seleccione un cliente antes de añadir vehículos\" | Falta el cliente en la Reserva Múltiple | Rellenarlo antes de pulsar *Añadir Vehículo*. |\n| \"Añada al menos un vehículo\" | Reserva Múltiple sin líneas | Añadir al menos uno antes de confirmar. |\n| \"El precio calculado automáticamente es X pero el precio actual es Y...\" | Editaste el precio a mano y el sistema lo detecta | Rellenar el campo **Motivo del Descuento** en el contrato resultante. |\n| El vehículo que esperabas no aparece en la lista | Tiene contrato solapado, está en mantenimiento o es de otra categoría | Verificar fechas, estado del vehículo y categoría. |\n| \"El vehículo seleccionado no tiene una categoría asignada\" | El modelo del vehículo no tiene categoría | Asignar categoría en *Flota → Modelos*. |\n\n---\n\n## Relacionado\n\n- [05 · Consultas web y leads](./05-consultas-web-y-leads.md) — para reservas que vienen ya pagadas.\n- [07 · Contratos](./07-contratos.md) — el contrato que se crea al final.\n- [07 · Contratos · Contratos en grupo](./07-contratos.md#contratos-en-grupo) — cómo funciona el grupo creado por la Reserva Múltiple.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — origen del precio €/día calculado.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [05 · Consultas web y leads](./05-consultas-web-y-leads.md) · Siguiente: [07 · Contratos →](./07-contratos.md)\n", "07-contratos.md": "# 07 · Contratos\n\n[← Volver al índice](./README.md)\n\n---\n\n## Índice de este capítulo\n\n- [¿Qué es un contrato?](#que-es-un-contrato)\n- [Cómo acceder](#como-acceder)\n- [Ciclo de vida](#ciclo-de-vida)\n- [Botones de la cabecera](#botones-de-la-cabecera)\n- [Botones estadísticos](#botones-estadisticos)\n- [Campos importantes](#campos-importantes)\n- [Pestañas del contrato](#pestanas-del-contrato)\n- [Validaciones](#validaciones)\n- [Líneas que se facturan](#lineas-que-se-facturan)\n- [Generación de facturas](#generacion-de-facturas)\n- [Ampliación de contrato](#ampliacion-de-contrato)\n- [Contratos en grupo](#contratos-en-grupo)\n- [Firma digital](#firma-digital)\n- [Imprimir y enviar contrato](#imprimir-y-enviar-contrato)\n\n---\n\n## ¿Qué es un contrato?\n\nEl **Contrato de Alquiler** (`vehicle.contract`) es el documento operativo y legal que regula un alquiler concreto. Tiene un **estado**, un **cliente**, un **vehículo**, **fechas**, un **precio**, un **seguro**, un **depósito** y genera **facturas**.\n\nEs el centro neurálgico del módulo: todo lo demás (reservas, leads, sustituciones, ampliaciones, devoluciones, facturas, daños) gira alrededor del contrato.\n\n## Cómo acceder\n\n**Vehicles Rental → Contratos**\n\nLista con todos los contratos. Vistas disponibles: **Lista, Kanban, Calendario, Gantt (Ocupación de Flota), Pivot (Análisis Financiero) y Gráfico**.\n\nFiltros disponibles en la barra de búsqueda: por estado, tipo de tarifa, vehículo, categoría, cliente, grupo, mes y trimestre.\n\n---\n\n## Ciclo de vida\n\nLa barra superior del contrato muestra **cuatro pasos**:\n\n| Estado | Color | Significado |\n|---|---|---|\n| **Nuevo / Borrador** (`a_draft`) | Azul | Editable, no compromete vehículo. Se puede cambiar fechas, cliente, tarifa. |\n| **En Progreso** (`b_in_progress`) | Verde/amarillo | Alquiler activo. Vehículo comprometido. Se pueden generar facturas. |\n| **Devuelto** (`c_return`) | Gris | El cliente entregó el vehículo. Quedan acciones de daños y devolución de depósito. |\n| **Cancelado** (`d_cancel`) | Rojo | Contrato no ejecutado o interrumpido. Se factura el cargo de cancelación. |\n\n> En **Lista** y **Gantt**, cada estado se ve con su color distintivo.\n\n### Transiciones\n\n```\n[Borrador] --In Progress--> [En Progreso] --Return--> [Devuelto]\n                                        \\\n                                         --Cancel--> [Cancelado]\n```\n\nUn contrato **devuelto** o **cancelado** ya no se puede reactivar. Si necesitas volver atrás, duplica el contrato.\n\n---\n\n## Botones de la cabecera\n\nSólo aparecen cuando tiene sentido según el estado:\n\n| Botón | Cuándo aparece | Qué hace |\n|---|---|---|\n| **Update Vehicle Data** | No Devuelto ni Cancelado | Copia al fichero de flota (Fleet) el modelo, transmisión, combustible, odómetro y unidad del odómetro definidos en el contrato. Exige que el odómetro nuevo sea mayor que el actual; si no, avisa. |\n| **In Progress** | Sólo en Borrador | Activa el contrato. Antes valida: tipo de alquiler informado, fechas informadas, sin solapamiento con otro contrato en curso del mismo vehículo. Si pasa, abre el compositor de email con la plantilla de reserva ya cargada para enviar al cliente. |\n| **Create Extra Service Invoice** | Hay servicios extras y contrato no devuelto/cancelado | Crea una factura de cliente con todas las líneas de la pestaña *Extra Services*. |\n| **Create Installment** | En Progreso, sin cuotas creadas | Genera el calendario de cuotas según el *Payment Type* elegido (Daily/Weekly/Monthly/Quarterly/Yearly/Full Payment). |\n| **Return** | En Progreso y con cuotas creadas | Marca el contrato como Devuelto. |\n| **Sustituir Vehículo** | En Progreso | Abre el asistente de sustitución (ver [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md#e-sustituciones)). |\n| **Damage Invoice** | Devuelto y sin factura de daños | Lanza el wizard de daños del vehículo para registrar y facturar daños. |\n| **Return Deposit Invoice** | Devuelto, con depósito y factura de depósito, sin devolución aún | Abre el wizard \"Devolver depósito\" (ver [12 · Devolución](./12-devolucion-y-facturacion.md)). |\n| **Create Trip Expense Reports** | Hay conductor obligatorio, gastos de viaje activados y gastos en borrador | Envía a aprobación los gastos del conductor asociados al contrato. |\n| **Cancel** | En Progreso | Cambia a Cancelado y hace visible la pestaña *Cancellation Policy*. |\n| **Cancellation Charge** | Cancelado y sin factura de cancelación | Genera la factura del cargo de cancelación según política. |\n| **Imprimir Contrato** | Siempre | Imprime el PDF del contrato. |\n| **Enviar Contrato** | Siempre | Genera el PDF, lo adjunta y abre el compositor de email con la plantilla del contrato. |\n\n---\n\n## Botones estadísticos\n\nEn la esquina superior derecha:\n\n| Botón | Qué muestra |\n|---|---|\n| **Documents** | Documentos del cliente vinculados al contrato (DNI, carnet…). Si el contrato está Devuelto, NO permite crear nuevos. |\n| **Invoices** | Todas las facturas que tienen este contrato como referencia (alquiler, depósito, devolución de depósito, servicios, daños, cancelación). |\n| **Sustituciones** | Sólo si hubo sustituciones; abre el listado de las mismas. |\n\n---\n\n## Campos importantes\n\nLos campos se agrupan visualmente como en el formulario:\n\n### Cabecera\n\n| Campo | Notas |\n|---|---|\n| **Reference No** | Código autogenerado por secuencia (`Contracts/0001`...). |\n\n### Detalles del Cliente\n\n| Campo | Notas |\n|---|---|\n| **Lead** | Sólo lectura si viene de un Lead CRM. |\n| **Cliente** | Obligatorio. Sólo editable en Borrador. |\n| **Phone / Email** | Se autorrellenan al elegir cliente. Editables en Borrador. |\n| **DNI / NIE** | Documento de identidad. |\n| **Fecha de expiración del DNI** | Para validación. |\n| **Domicilio** | Dirección del cliente. |\n\n### Carnet de Conducir\n\n| Campo | Notas |\n|---|---|\n| **Carnet de Conducir** | Número. |\n| **Fecha Expedición** | Cuándo se sacó. |\n| **Fecha Caducidad** | Cuándo expira. |\n\n### Detalles de Recogida y Devolución\n\n| Campo | Notas |\n|---|---|\n| **Pick-up Date** | Fecha y hora de recogida (obligatoria). |\n| **Dirección de recogida** | Calle 1, Calle 2, Ciudad, Provincia, CP, País. Se autorrellena con los datos de la compañía si están vacíos. |\n| **Drop-off Date** | Fecha y hora de devolución (obligatoria). |\n| **Dirección de devolución** | Misma estructura. |\n\n> Si en un contrato existente cambias la **ciudad de devolución**, el sistema **actualiza automáticamente la ubicación del vehículo en la flota** a esa ciudad.\n\n### Vehicle Details\n\n| Campo | Notas |\n|---|---|\n| **Vehicle** | Combo de vehículos disponibles (sin solapamientos). Obligatorio si hay fechas. |\n| **License Plate** | Matrícula. Sólo lectura. |\n| **Model / Transmission / Fuel Type / Categoría** | Heredados del vehículo. Sólo lectura. |\n| **Last Odometer** y **Unit** (km o mi) | Kilometraje. |\n| **Driver Required** | ¿Requiere conductor? Si está activo aparecen los siguientes. |\n| **Driver** | Sólo conductores que sean empleados (lo valida el sistema). |\n| **Charge Type** | Incluido en el alquiler / Aparte. |\n| **Driver Charge** | Importe del conductor. Obligatorio > 0 si está visible. |\n| **Trip Expenses** | Gastos del viaje del conductor. |\n| **Custom Scratch Report** + **Scratch Report** | Para anexar el informe de rayones inicial. |\n\n### Rent Details\n\n| Campo | Notas |\n|---|---|\n| **Tipo de Tarifa** | *Tarifa Estándar* o *FLEXIRENT*. Si eliges FLEXIRENT y la duración es menor al mínimo configurado, sale aviso amarillo y vuelve a Standard automáticamente. |\n| **Tipo de Alquiler** (`rent_type`) | Horas / Días / Semanas / Meses / Años / Kilómetros / Millas. (Oculto si tipo FLEXIRENT). |\n| **Precio del alquiler** (`rent`) | La etiqueta cambia dinámicamente según el tipo de alquiler (Alquiler por Día, por Semana, por Mes, etc.). |\n| **Total Days/Weeks/Months/Hours/Years/KM/Miles** | Cantidad. Para días/semanas/meses/horas/años se calcula automáticamente de las fechas. Para km/millas el usuario teclea el total previsto. |\n| **Total Renta del Vehículo** | Calculado: precio × cantidad + cargo del conductor (si es *Excluido*). |\n| **Impuestos** (`tax_ids`) | Impuestos aplicables (varios). |\n\n### Extra Charges Details\n\nCargos adicionales si el cliente excede el contrato:\n\n| Campo | Notas |\n|---|---|\n| **If any extra charges** | Checkbox que muestra el resto. |\n| **Total Extra Days/Weeks/Months/Hours/Years/KM/Miles** | Unidades extras según el tipo de alquiler. |\n| **Extra Charge per Day/Week/Month/Hour/Year/KM/MI** | Precio extra por unidad. |\n| **Total Extra Charges** | Calculado. |\n\n> **Ejemplo:** si el tipo de alquiler es \"Días\" y activas el checkbox de cargos extras, aparecen *Total Extra Days* y *Extra Charge per Day*. Si fuera \"KM\", aparecerían *Total Extra KM* y *Extra Charge per KM*.\n\n### Invoice Details (lado derecho)\n\nResúmenes con *badge* de estado de pago (`paid`, `not_paid`, `in_payment`, `partial`, `reversed`):\n\n- **Extra Charge Invoice**\n- **Extra Service Invoice**\n- **Deposit Invoice**\n- **Return Deposit**\n- **Cancellation Invoice**\n\nJunto al bloque, un botón **Extra Charge Invoice** para crear la factura de cargos extras.\n\n### Payment Details\n\n| Campo | Notas |\n|---|---|\n| **Payment Type** | Cómo se factura el alquiler: Daily · Weekly · Monthly · Quarterly · Yearly · Full Payment. |\n\n### Detalles de Depósito Dinámico\n\n| Campo | Notas |\n|---|---|\n| **Deposit Card Type** | Tarjeta de Débito / Crédito. |\n| **Use Deposit from Rule** | Si está marcado, el depósito lo calcula automáticamente una [regla configurada](./08-tarifas-seguros-depositos.md#c-reglas-de-deposito). |\n| **Deposit Rule** | Sólo lectura. Indica qué regla se aplicó. |\n| **Calculated Deposit** | Sólo lectura. Importe calculado. |\n| **Invoice Item** | Producto que se usará para facturar el alquiler. |\n| **If any deposit** | Checkbox; si está activo permite editar el depósito manual. |\n| **Deposit** | Importe. Editable sólo si NO usa regla y aún no hay factura de depósito. |\n\n### Detalles de la Compañía\n\n- **Company** (multicompañía).\n- **Responsible** — usuario responsable del contrato.\n\n### Bloque inferior (firma)\n\n- **Date** — fecha de firma (no puede ser anterior a hoy).\n- **Signature** — pad táctil para que el cliente firme con dedo/lápiz.\n\n---\n\n## Pestañas del contrato\n\n### 1. Vehicle Payment Details\n\nCalendario de **cuotas (installments)** generadas a partir del *Payment Type*.\n\nPor cada cuota:\n- Ítem de factura (producto).\n- Nombre (ej. *Installment 3*).\n- Fecha.\n- Importe.\n- Factura asociada.\n- Estado de pago (badge de color).\n- Botón **Create Invoice** por cuota para emitir su factura.\n\n### 2. Términos de Alquiler\n\n- **Acuerdo de Alquiler** (rental.agreement.terms) — al seleccionarlo, rellena automáticamente:\n- **Terms & Conditions** — HTML editable.\n\n### 3. Trip Expenses\n\nSólo si hay **conductor obligatorio** y **gastos de viaje activados**. Edita gastos (`hr.expense`) ligados al contrato.\n\n### 4. Extra Services\n\nLíneas de servicios extras: producto, cantidad, descripción, importe y total. Se suma en *Total Service Charge*.\n\n### 5. Vehicle Images\n\nGalería kanban de fotos del vehículo al inicio del alquiler (con indicador del tamaño del archivo).\n\n### 6. Insurance Policy\n\nPólizas de seguro asociadas: número, nombre, descripción, importe y archivo PDF.\n\n### 7. Cancellation Policy\n\n**Sólo visible cuando el estado es Cancelado**. Contiene política, cargo, términos y motivos de cancelación.\n\n### 8. Daños del Vehículo\n\nVisor de la \"imagen pintada\" de daños — un canvas donde el operario marca los golpes. Tiene:\n- **Abrir Editor de Daños** (lanza el lienzo).\n- **Limpiar Imagen**.\n\nVer [11 · Daños y rayones](./11-danos-y-rayones.md).\n\n### 9. Vehicle Damages\n\n**Sólo visible cuando ya hay factura de daños**. Muestra importe, descripción y galería de fotos del daño.\n\n---\n\n## Validaciones\n\nQué impide guardar o pasar de estado:\n\n- **Fecha de inicio**: no puede ser anterior a hoy.\n- **Fecha de firma**: no puede ser anterior a hoy.\n- **Drop-off ≥ Pick-up**: si no, error *\"Drop-off Date debe ser mayor\"*.\n- **Duración mínima por tipo de alquiler**:\n  - Week → mínimo 7 días.\n  - Month → 28 días.\n  - Year → 365 días.\n- **Renta > 0** según tipo (mensaje *\"The Rent per Day/Week/... must be greater than zero\"*).\n- **Total KM > 0** y **Total Millas > 0**.\n- **Si cargos extras activos**: contador (días/semanas/etc.) y precio extra deben ser > 0.\n- **Si requiere conductor**: cargo del conductor (si *Excluding*) debe ser > 0.\n- **Driver = empleado**: el conductor debe ser uno de los empleados permitidos.\n- **Sin solapamiento**: al pulsar *In Progress* se verifica que NO exista otro contrato En Progreso o Devuelto para el mismo vehículo en el período. Si lo hay: *\"No se puede activar este contrato porque las fechas se solapan con otro(s) contrato(s) en curso para el mismo vehículo: REF1 (dd/mm/yyyy → dd/mm/yyyy)...\"*.\n- **Activación sin tipo de alquiler o sin fechas**: notificación amarilla (*\"Elija su unidad de alquiler preferida\"* / *\"Debe definir las fechas de recogida y devolución antes de activar el contrato\"*).\n- **Odómetro**: el último odómetro debe ser mayor que el actual del vehículo al hacer *Update Vehicle Data*.\n- **Diario de ventas**: si la compañía no tiene diario de tipo *Ventas*, las acciones de facturar abortan con mensaje guía hacia *Contabilidad → Configuración → Diarios*.\n- **FLEXIRENT**: si los días totales no llegan al mínimo configurado, el sistema cambia automáticamente la tarifa a Estándar y muestra aviso amarillo.\n\n---\n\n## Líneas que se facturan\n\nUn contrato **NO es una factura única**: genera **varias facturas separadas**, cada una con su propio estado de pago y badge:\n\n| Tipo de factura | Producto | Cuándo se genera |\n|---|---|---|\n| **Cuotas del alquiler** | `vehicle_rent_charge` | Manualmente con *Create Invoice* en cada cuota, o automáticamente por el cron diario. |\n| **Depósito** | `vehicle_rent_deposit` | Al inicio del alquiler. Si viene de Redsys, se crea y paga automáticamente. |\n| **Devolución del depósito** | `vehicle_rent_deposit` (out_refund) | Al devolver, vía wizard *Return Deposit*. |\n| **Cargos extras** | `vehicle_rent_extra_charge` | Al pulsar *Extra Charge Invoice*. |\n| **Servicios extras** | Producto de la línea | Al pulsar *Create Extra Service Invoice*. |\n| **Daños** | `vehicle_damage_amount` | Al pulsar *Damage Invoice* (sólo Devuelto). |\n| **Cancelación** | `vehicle_contract_cancellation_charge` | Al pulsar *Cancellation Charge* (sólo Cancelado). |\n\nTodas se ven desde el botón estadístico **Invoices** del contrato.\n\n> Cuando una factura pasa a *paid*, se publica automáticamente un mensaje en el chatter del contrato: *\"💰 Factura Pagada — La factura X por importe Y ha sido pagada completamente\"*.\n\n---\n\n## Generación de facturas\n\n### Cuotas — manual\n\n1. Contrato en estado *En Progreso*.\n2. Pulsar **Create Installment** en la cabecera (sólo aparece si no hay cuotas creadas).\n3. El sistema genera el calendario según el *Payment Type*:\n   - **Daily**: una cuota por día.\n   - **Weekly**: una cuota por semana.\n   - **Monthly**: una cuota por mes.\n   - **Quarterly**: una cuota por trimestre.\n   - **Yearly**: una cuota anual.\n   - **Full Payment**: una sola cuota por el importe total.\n4. En la pestaña *Vehicle Payment Details*, pulsar **Create Invoice** en cada cuota cuando llegue su fecha.\n\n### Cuotas — automático (cron diario)\n\nExiste una **tarea programada** (`action_create_rent_payment_invoice`) que cada día revisa los contratos *En Progreso* y factura automáticamente las cuotas cuya fecha es hoy. Esto evita tener que crear las facturas manualmente.\n\nEsa cuota generada incluye **automáticamente todas las líneas** del contrato en este orden:\n\n1. **Alquiler del vehículo** — con descripción que incluye matrícula, fechas, días y km.\n2. **Seguro** — precio/día × días totales (con etiqueta \"Conductor Especial\" si aplica).\n3. **Depósito de Seguridad** — el calculado por la regla si está activo, o el manual.\n4. **Km Extra FLEXIRENT** — si el alquiler ha excedido el paquete.\n5. **Servicios Extras** del contrato.\n6. **Cargos Extras** — por superación del tiempo contratado.\n\nEl importe total de la factura sustituye al *Payment Amount* de la cuota.\n\n### Cargos extras\n\n- Botón **Extra Charge Invoice** en el bloque *Extra Charges Details*.\n- Genera una factura con el producto `vehicle_rent_extra_charge` por las unidades extras × precio extra.\n\n### Servicios extras\n\n- Botón **Create Extra Service Invoice** en la cabecera.\n- Genera una factura con una línea por cada producto/servicio extra cargado.\n\n### Daños\n\n- Botón **Damage Invoice** en la cabecera (sólo Devuelto).\n- Abre wizard para indicar importe y descripción.\n- Genera la factura con el producto `vehicle_damage_amount`.\n\n### Cancelación\n\n- Botón **Cancellation Charge** en la cabecera (sólo Cancelado).\n- Genera la factura del cargo de cancelación según política.\n\n### Devolución de depósito\n\n- Botón **Return Deposit Invoice** en la cabecera (sólo Devuelto y con depósito previo).\n- Abre wizard para indicar importe a devolver.\n- Genera una **nota de crédito** (`out_refund`).\n\n> Todas las facturas se crean **en estado borrador**, ligadas al contrato (`vehicle_contract_id` en `account.move`), con el cliente del contrato, fecha = hoy, vencimiento = hoy y en el diari
