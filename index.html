n\n\nUna vez emitida la nota de crédito y validada, el contable la concilia contra el pago original del depósito desde **Contabilidad**. Cuando el pago real se hace (transferencia al cliente, devolución a la tarjeta…), se registra en la factura.\n\nEl campo **Estado Devolución Depósito** (`return_deposit_state`) del contrato se actualiza automáticamente.\n\n---\n\n## Resumen de facturas que se generan en el cierre\n\n| Factura | Tipo | Cuándo se emite |\n|---|---|---|\n| **Cuotas del alquiler** | `out_invoice` | Durante el contrato (manual o por cron diario). |\n| **Depósito** | `out_invoice` | Al inicio (o automático si vino de Redsys). |\n| **Cargos extras** | `out_invoice` | Al cerrar, si hubo exceso. |\n| **Servicios extras** | `out_invoice` | Al cerrar, si quedaban pendientes. |\n| **Daños** | `out_invoice` | Al cerrar, si hubo desperfectos. |\n| **Devolución de depósito** | `out_refund` | Al cerrar, nota de crédito al cliente. |\n| **Cancelación** | `out_invoice` | Sólo si se cancela el contrato. |\n\nTodas accesibles desde el botón estadístico **Invoices** del contrato.\n\n---\n\n## Verificar que el cliente está al día\n\nAntes de despedir al cliente, comprobar en el contrato:\n\n1. Botón estadístico **Invoices** → todas las facturas deben estar en estado **Pagado** o tener un plan claro de cobro.\n2. **Estado del Depósito**: si era reembolsable, debe estar marcado *Devolución emitida*.\n3. **Botón Imprimir Contrato**: el cliente puede llevarse una copia del PDF actualizado con las facturas finales.\n\n---\n\n## Cancelación de contrato (caso especial)\n\nSi el contrato se **cancela** en lugar de devolverse (porque el cliente nunca llegó a recogerlo, o porque hubo un problema):\n\n### Cómo se cancela\n\n1. Contrato en estado **En Progreso** → pulsar **Cancel** (botón rojo, icono ⊘) en la cabecera.\n2. El estado pasa a **Cancelado** (`d_cancel`).\n3. Se hace visible la **pestaña Cancellation Policy**.\n\n### Pestaña \"Cancellation Policy\"\n\nRellenar:\n\n| Campo | Notas |\n|---|---|\n| **Policy** | Política de cancelación predefinida (ver [15 · Configuración](./15-configuracion.md#a-politicas-de-cancelacion)). Al elegirla rellena automáticamente los términos. |\n| **Cancellation Charge** | Cargo a aplicar al cliente. |\n| **Terms & Conditions** | Texto rico (editable). |\n| **Cancellation Reasons** | Texto rico explicando el motivo. |\n\n### Factura de cancelación\n\nUna vez relleno, en la cabecera aparece el botón **Cancellation Charge**.\n\nAl pulsarlo:\n\n- Crea una factura al cliente con el producto **\"Vehicle Contract Cancellation Charge\"** por el importe.\n- Si el importe es 0, igualmente permite generarla (cancelación sin cargo), pero la factura llevará líneas vacías y se crea vacía.\n\n### Impacto en facturas previas y depósito\n\n- Las facturas de cuotas/depósito/servicios **ya emitidas NO se anulan automáticamente**.\n- El operario debe gestionar sus **reembolsos manualmente** desde Contabilidad si procede.\n- El depósito ya cobrado se puede devolver con el wizard **Return Deposit Invoice** (mismo flujo que en devolución normal).\n\n---\n\n## Ejemplos de uso\n\n### Ejemplo 1 — Cierre limpio sin incidencias\n\n> **Caso:** Renault Clio alquilado 7 días. Depósito 150 €. Cuotas ya facturadas y pagadas.\n\n1. Cliente devuelve el coche, todo correcto.\n2. Operario inspecciona, todo OK.\n3. Pulsa **Return** en el contrato.\n4. Pulsa **Return Deposit Invoice** → Amount to Return = 150 € (por defecto).\n5. **Crear** → nota de crédito de 150 € emitida.\n6. Contable concilia, el cliente recibe la devolución en su tarjeta.\n7. Fin.\n\n### Ejemplo 2 — Cierre con rayón y exceso de km\n\n> **Caso:** Renault Megane alquilado 5 días, 500 km incluidos. Devuelto con 580 km (80 km extra a 0,30 €/km) y rayón en puerta (60 €).\n\n1. Operario inspecciona → consulta scratch reports, el rayón es nuevo.\n2. Pulsa **Return**.\n3. **Pinta el rayón** en el painter, lo guarda.\n4. Pulsa **Damage Invoice** → 60 €, descripción detallada → **Create Invoice**.\n5. Marca **If any extra charges** → Total Extra KM = 80, Extra Charge per KM = 0,30 → Total = 24 €.\n6. Pulsa **Extra Charge Invoice** → factura de 24 €.\n7. Pulsa **Return Deposit Invoice** → Amount to Return = 150 − 60 − 24 = **66 €**.\n8. Cliente recibe: nota de crédito 66 € + factura daños 60 € + factura cargos extras 24 €.\n\n### Ejemplo 3 — Daño grave que supera el depósito\n\n> **Caso:** Coche devuelto con golpe que cuesta reparar 500 €. Depósito sólo de 200 €.\n\n1. Operario pinta el daño y emite **Damage Invoice** por 500 €.\n2. Emite **Return Deposit Invoice** por 0 € (no se devuelve nada).\n3. La factura de daños queda emitida íntegramente. El cliente debe pagar la diferencia (500 − 200 = 300 € adicionales después de descontar el depósito ya retenido).\n4. En la práctica esto se gestiona contablemente: la nota de crédito de 0 € + la factura de daños de 500 € − el pago del depósito de 200 € = saldo a cobrar 300 €.\n\n### Ejemplo 4 — Cancelación\n\n> **Caso:** Cliente reservó por web y pagó 200 € (alquiler 150 + depósito 50). El día antes avisa que no podrá venir.\n\n1. Operario abre el contrato, pulsa **Cancel**.\n2. En la pestaña *Cancellation Policy* selecciona la política \"No reembolsable 24h antes\" y pone Cancellation Charge = 150 € (el alquiler).\n3. Pulsa **Cancellation Charge** → factura de 150 € al cliente.\n4. Pulsa **Return Deposit Invoice** → Amount to Return = 50 € (sólo se devuelve el depósito).\n5. Cliente pierde el importe del alquiler pero recupera el depósito.\n\n---\n\n## Validaciones y restricciones\n\n- **No se puede pulsar Return** si todavía no hay cuotas creadas. Pulsar primero *Create Installment*.\n- **No se puede facturar dos veces el mismo concepto**: tras Damage Invoice no aparece más el botón. Tras Return Deposit Invoice tampoco.\n- **No se puede modificar Last Odometer ni Signature** tras devolver. Si te equivocas, hay que pedir corrección al administrador.\n- **Pestaña Documents bloqueada** en Devuelto: para añadir documentos nuevos hay que crear un nuevo contrato.\n\n---\n\n## Errores frecuentes\n\n| Mensaje | Causa | Solución |\n|---|---|---|\n| *\"Please note: A return deposit amount is required\"* | Wizard de devolución con importe vacío | Indicar el importe a devolver. |\n| El botón *Return* no aparece | El contrato no tiene cuotas creadas | Pulsar primero *Create Installment*. |\n| El botón *Return Deposit Invoice* no aparece | No había depósito o no se llegó a facturar | Revisar el campo *Deposit Invoice* del contrato. |\n| La nota de crédito sale con cliente vacío | El cliente del contrato fue borrado | Recuperar el cliente o crear uno nuevo. |\n| Factura de daños no aparece en *Invoices* | Falló la creación interna | Recargar y volver a pulsar *Damage Invoice*. Revisar logs si persiste. |\n\n---\n\n## Relacionado\n\n- [07 · Contratos](./07-contratos.md) — estados, botones y campos.\n- [11 · Daños y rayones](./11-danos-y-rayones.md) — registro de daños y painter.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — cómo se calcula el depósito que ahora se devuelve.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — formas de cobrar pendientes y devolver al cliente.\n- [15 · Configuración](./15-configuracion.md#a-politicas-de-cancelacion) — políticas de cancelación.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [11 · Daños y rayones](./11-danos-y-rayones.md) · Siguiente: [13 · Portal web público →](./13-portal-web-publico.md)\n", "13-portal-web-publico.md": "# 13 · Portal Web Público\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué es?\n\nEl **portal web público** son las **páginas accesibles desde Internet** sin necesidad de iniciar sesión, donde los clientes finales pueden:\n\n- Ver la **flota disponible** y las categorías de vehículo.\n- Consultar **delegaciones** (Madrid, Barcelona, Valencia).\n- Leer **información de servicios** y **seguros**.\n- Rellenar un **formulario de contacto**.\n- **Hacer una reserva online** con pago por tarjeta (Redsys).\n\nEl módulo expone **dos marcas** con experiencia web propia:\n\n| Marca | Especialidad | URLs |\n|---|---|---|\n| **Sunset Rent a Car** | Turismo / alquiler general (coches) | `/` · `/sunset/*` |\n| **Pinveco** | Furgonetas profesionales | `/pinveco/*` |\n\nAmbas marcas comparten la misma base de datos y se distinguen por **compañía** (`res.company`) y por **URLs**.\n\n---\n\n## A. Páginas Sunset\n\n### Home\n\n- **`/`** y **`/sunset`** → página principal (editable desde *Website* de Odoo).\n\n### Catálogo de flota\n\n- **`/sunset/flota`** — listado de la flota Sunset.\n- Atajos: **`/test/flota`**, **`/simple/flota`** (para pruebas y versiones simplificadas).\n\n### Categoría concreta\n\n- **`/sunset/categoria/<id>`** — página de una categoría (Tipo A, Tipo C…).\n\n### Delegaciones\n\n- **`/sunset/delegacion/<ciudad>`** — página de una delegación.\n\n### Servicios\n\n- **`/sunset/servicios/<servicio>`** — servicio individual.\n- **`/sunset/seguros`** — información de seguros.\n- **`/our-services`** — página de servicios general, con bloques pre-cargados:\n  - **Servicios principales**: Alquiler de Vehículos · Servicio de Chófer · Transporte Corporativo (cada uno con icono, descripción y 4 ventajas).\n  - **Servicios adicionales**: Seguro Completo · Entrega a Domicilio · Asistencia en Carretera · Mantenimiento.\n  - **Testimonios** de clientes (María González, Carlos Rodríguez, Ana Martín) con valoración.\n\n### Contacto\n\n- **`/contactus`** — página de contacto con:\n  - **Datos de la empresa**: Sunset Rent a Car, Calle Principal 123 (Madrid), +34 91 123 45 67, info@sunsetrentacar.com.\n  - **Horario**: L-V 8:00-20:00 · Sábados 9:00-18:00 · Domingos 10:00-16:00.\n  - **Tres delegaciones**: Madrid Centro · Barcelona · Valencia (cada una con dirección, teléfono y email propios).\n  - **Formulario de contacto**: nombre, email, teléfono, asunto, mensaje (los cuatro primeros obligatorios).\n\n### Envío del formulario de contacto\n\n- **`/contactus/enviar`** (POST) → procesa el formulario:\n  1. Valida que no falten campos obligatorios. Si faltan, devuelve la página con los datos y el aviso *\"Faltan campos obligatorios…\"*.\n  2. **Crea un lead** en CRM (`crm.lead`) con nombre, email, teléfono, descripción del asunto/mensaje. Marca origen *\"Website\"* si está disponible.\n  3. Renderiza la página de éxito (*\"Gracias, te hemos recibido el mensaje…\"*).\n\nEstos leads aparecen en el CRM estándar de Odoo (no en *Consultas de Reserva*).\n\n---\n\n## B. Páginas Pinveco\n\n### Home\n\n- **`/pinveco`** → home de Pinveco.\n\nMuestra:\n\n- **Catálogo de categorías** de furgonetas:\n  - Furgoneta Pequeña.\n  - Furgoneta Mediana.\n  - Furgoneta Grande.\n  - Furgón Isotermo.\n  - Furgoneta 9 Plazas.\n  - Furgón Plataforma.\n- **Totales en cabecera** (30 vehículos / 25 disponibles / 800 contratos como ejemplo de cifras).\n\n### Catálogo dinámico de flota\n\n- **`/pinveco/flota`** → catálogo de la flota Pinveco.\n\nFiltra los vehículos cuya compañía es \"Pinveco\" y los muestra con:\n\n- Nombre (limpio, sin matrícula).\n- Modelo, matrícula, color, año, categoría.\n- Pasajeros (asientos), precio orientativo.\n- Características (Aire acondicionado, GPS, Carga útil).\n- Icono de furgoneta.\n\n### Categoría de Pinveco\n\n- **`/pinveco/categoria/<id>`** — categoría concreta de furgoneta. Lista los vehículos de la compañía Pinveco que pertenecen a esa categoría.\n\n### Delegaciones Pinveco\n\n- **`/pinveco/delegacion/<ciudad>`** — página de delegación Pinveco.\n\nLas tres preconfiguradas:\n\n| Ciudad | Dirección | Teléfono | Email | Horario | Rating |\n|---|---|---|---|---|---|\n| **Madrid** | C/ Alcalá 200 | +34 913 221 100 | madrid@pinveco.com | L-V 7:00-21:00 · S 8:00-15:00 | 4.8 |\n| **Barcelona** | Av. Diagonal 500 | +34 933 445 566 | barcelona@pinveco.com | — | 4.9 |\n| **Valencia** | C/ Colón 85 | +34 963 778 899 | valencia@pinveco.com | — | 4.7 |\n\n> Si el cliente teclea una ciudad que no existe, devuelve un **404**.\n\n---\n\n## C. Diferencias entre las dos marcas\n\n| Aspecto | Sunset | Pinveco |\n|---|---|---|\n| **Producto** | Coches (turismo, premium) | Furgonetas profesionales |\n| **Color identitario** | Amarillo Sunset | Azul Pinveco |\n| **Servicios añadidos** | Chófer, transporte corporativo | — |\n| **Tres delegaciones** | Madrid, Barcelona, Valencia | Madrid, Barcelona, Valencia |\n| **Compañía Odoo** | Compañía Sunset | Compañía Pinveco |\n| **URL principal** | `/`, `/sunset/*` | `/pinveco/*` |\n\nEl sistema detecta el dominio desde el que accede el cliente y muestra automáticamente la marca correspondiente: color, imágenes, textos.\n\n---\n\n## D. Proceso de reserva online\n\nToda la reserva web vive en el dominio público (Sunset o Pinveco) y se compone de **tres pantallas + pasarela**:\n\n### Pantalla 1 — Selección de categoría\n\n**URL**: `/web/booking-enquiry` → \"Selecciona tu Categoría de Vehículo\"\n\n- Se ve una **rejilla de tarjetas**, una por categoría (Tipo A, B, C, D, E, F, K, T, V, W, X, Z).\n- Cada tarjeta lleva su **imagen** (combi pequeño, mediano, furgón grande, patinete eléctrico…) y una **descripción corta** (*\"Furgonetas compactas ideales para la ciudad\"*, etc.).\n- El sistema **excluye automáticamente** las categorías: *\"Furgoneta\"*, *\"Tipo E - Bici Eléctrica\"*, *\"Tipo E\"*, *\"Bici Eléctrica\"*.\n- El color (amarillo Sunset o azul Pinveco) y las imágenes se eligen automáticamente según el dominio.\n- Al hacer clic en una tarjeta → `/web/vehicle-detail/<id>`.\n\n### Pantalla 2 — Detalle de categoría y selección de tarifa\n\n**URL**: `/web/vehicle-detail/<id>` → ficha de la categoría.\n\n- **Cabecera** con nombre del tipo, descripción larga, plazas, A/C sí/no, volumen.\n- **Selector de tipo de alquiler** (dos botones radio):\n  - **Ofertas Fijas**: tarjetas con paquetes pre-definidos:\n    - `4h / 100km`\n    - `24h / 350km` etiquetada como **\"Más Popular\"**.\n    - `24h / 500km`\n    - El cliente clica una.\n  - **Tarifas Dinámicas**:\n    - Dos desplegables:\n      - **Duración del alquiler**: `4h` · `1-2d` · `3-5d` · `6-10d` · `11-20d` · `21-29d`.\n      - **Kilometraje incluido**: dinámico vía AJAX (`/web/get-valid-km-options`).\n    - Precio calculado con `/web/get-dynamic-pricing` mostrado en una tarjeta destacando el **€ por día**.\n- **Selector de ubicación**: desplegable con las ubicaciones donde hay vehículos. Si elige una sin disponibilidad → aviso *\"No hay vehículos disponibles\"*.\n- **Llamada AJAX** a `/web/get-available-vehicles` para mostrar disponibilidad real:\n  - Total · Ocupados (contratos en borrador o curso) · Reservados (otras consultas web abiertas) · Disponibles.\n- Si `Disponibles > 0` → aparece el **formulario de reserva**.\n- Si no → aviso *\"No hay vehículos disponibles\"*.\n\n### Formulario de reserva (sección 3)\n\nEn la misma página, oculto hasta tener **tipo + ubicación + disponibilidad**.\n\n#### Bloque \"Datos de contacto\"\n\n- **Nombre completo** *(obligatorio)*\n- **Email** *(obligatorio)*\n- **Teléfono** *(obligatorio)*\n- **Empresa** (opcional)\n\n#### Bloque \"Documentación\"\n\n- **DNI/NIE** *(obligatorio)*\n- **Fecha de expiración del DNI** (mes/año) *(obligatorio)*\n\n#### Bloque \"Dirección\"\n\n- **Calle** *(obligatorio)*\n- Calle 2 (opcional)\n- **Ciudad** *(obligatorio)*\n- **C.P.** *(obligatorio)*\n- **País** *(obligatorio, desplegable)*\n\n#### Bloque \"Conductor\"\n\n- **Carnet de Conducir** *(obligatorio)*\n- **Fecha de Nacimiento** *(obligatorio)*\n- **Fecha Expedición Carnet** *(obligatorio)*\n- **Fecha Caducidad Carnet** *(obligatorio)*\n\n#### Bloque \"Pago\"\n\n- **Número de Tarjeta** *(obligatorio)* — detecta el BIN y muestra el tipo (Visa, Mastercard, etc.).\n- **Tipo de Tarjeta** (oculto, deducido del BIN).\n- **Depósito de Seguridad** — se calcula automáticamente según las [reglas de depósito](./08-tarifas-seguros-depositos.md#c-reglas-de-deposito). Visible como caja info azul.\n- **Total a Pagar** — alquiler + depósito, en caja naranja.\n\n#### Bloque \"Fechas\"\n\n- **Fecha de inicio** *(obligatorio)*\n- **Fecha de fin** *(obligatorio)* — con validación de duración mínima según la tarifa elegida.\n- Un aviso en azul recuerda *\"Seleccione una tarifa para ver la duración mínima requerida\"*.\n\n---\n\n## E. Lo que pasa al enviar el formulario\n\n### Pantalla 4 — Pasarela Redsys\n\nAl enviar el formulario, se crea un `payment.transaction` con `provider_code = redsys` y todos los datos de la reserva guardados en `booking_data_json`. Se **redirige a la pasarela**.\n\n### Pantalla 5 — Página de éxito\n\n**URL**: `/rental/success`\n\n- Pantalla simple verde: *\"✓ ¡Pago realizado exitosamente! Tu reserva ha sido confirmada. Serás redirigido en breve…\"*\n- Redirige al home a los 3 segundos.\n- En segundo plano:\n  - Busca la última transacción Redsys sin booking creado.\n  - La fuerza a `done` si no lo estaba.\n  - Lanza la creación del Lead.\n\n### Pantalla 5b — Página de error\n\n**URL**: `/rental/error`\n\n- Pantalla roja: *\"✗ El pago no pudo ser procesado. Por favor, intenta nuevamente o contacta a soporte.\"*\n- Redirección al home en 5 segundos.\n\n---\n\n## F. Qué se crea realmente en Odoo\n\n**Sólo se crea un Lead — NO un contrato.** El contrato sigue siendo paso manual desde el backend.\n\nEn concreto:\n\n### Contacto (`res.partner`)\n\n- Si existe por email/teléfono → se reutiliza y actualiza dirección.\n- Si no → se crea nuevo con `customer_rank = 1`.\n\n### CRM Lead (tipo oportunidad)\n\n| Campo | Valor |\n|---|---|\n| **Nombre** | `Consulta de Reserva - <Nombre del cliente>` |\n| **Etapa** | La primera del pipeline |\n| **Cliente, email, teléfono** | Del formulario |\n| **Categoría seleccionada** | NO se asigna vehículo concreto; sólo bloquea la categoría |\n| **Fechas y horas de inicio/fin** | Del formulario |\n| **DNI, expiración del DNI** | Del formulario |\n| **Dirección completa** | Del formulario |\n| **Carnet, fechas de carnet, fecha de nacimiento** | Del formulario |\n| **Ubicación** | La que eligió |\n| **Descripción** | Resumen detallado con tipo de vehículo, tarifa €/día, precio total, depósito, total pagado, fechas, dirección, DNI, carnet, fecha de nacimiento, referencia Redsys y validación BIN |\n\n### Factura de depósito\n\nAutomática si el depósito > 0. Se crea y se marca como **pagada** inmediatamente.\n\n---\n\n## G. El operario procesa la consulta\n\nLa consulta cae en **Vehicles Rental → Consultas de Reserva** lista para revisar. El operario:\n\n1. Abre la consulta, comprueba los datos del cliente y la ubicación.\n2. Pulsa **Convertir a Oportunidad**:\n   - Si no había contacto → lo crea.\n   - Si no había vehículo concreto asignado → asigna automáticamente uno disponible de la categoría.\n3. Pulsa **Crear Contrato**:\n   - Se abre el wizard con todo precargado (cliente, vehículo, fechas, DNI, carnet, dirección…).\n   - Crea contrato + Sale Order + línea de pago.\n4. Pulsa **Imprimir Contrato** y **Enviar Contrato** para entregar la documentación al cliente.\n\nVer detalle en [05 · Consultas web y leads](./05-consultas-web-y-leads.md).\n\n---\n\n## H. Email de confirmación\n\n> **Importante**: el cliente **NO recibe email automático en el momento de pagar**.\n\nEl email se envía **manualmente** desde la ficha del Lead (botón \"Enviar Contrato\") **una vez que el operario ha generado el contrato real**.\n\nEn ese momento:\n- Se renderiza el PDF del contrato.\n- Se manda con la plantilla `email_template_vehicle_contract` al email del cliente.\n- Se adjunta el contrato.\n\nSi la plantilla no está instalada o configurada, salta error.\n\n---\n\n## I. Endpoints AJAX usados internamente\n\n| Endpoint | Propósito |\n|---|---|\n| `/web/get-valid-km-options` | Devuelve los rangos de km disponibles según categoría y duración. |\n| `/web/get-dynamic-pricing` | Calcula el precio €/día según categoría + duración + km. |\n| `/web/get-available-vehicles` | Cuenta total/ocupados/reservados/disponibles de una categoría en unas fechas y ubicación. |\n\nSi la web responde lento, suele ser por **muchas llamadas a estos endpoints** desde un cliente con conexión lenta. No es un error.\n\n---\n\n## Validaciones y restricciones del flujo web\n\n- **Campos obligatorios**: el formulario JS bloquea el envío si falta alguno.\n- **BIN inválido**: aviso al cliente *\"Tarjeta no reconocida\"*.\n- **Categorías excluidas**: bici eléctrica y patinete eléctrico no aparecen en `/web/booking-enquiry`.\n- **Fechas pasadas**: el formulario no permite seleccionar fechas anteriores a hoy.\n- **Duración mínima**: si eliges *4h*, el formulario fuerza Fecha fin = Fecha inicio + 4h.\n\n---\n\n## Errores frecuentes\n\n| Síntoma | Causa | Solución |\n|---|---|---|\n| Cliente paga pero no aparece el lead | El webhook de Redsys falló | El cron de recuperación lo crea en máximo 30 minutos. Si no, mirar logs Redsys. |\n| \"No hay vehículos disponibles\" | Realmente no hay, o la categoría seleccionada está mal | Comprobar inventario y categorías. |\n| BIN no reconocido | Tarjeta extranjera o BIN nuevo | El sistema asume débito por defecto, depósito mayor. |\n| Página de detalle de categoría sale en blanco | ID de categoría incorrecto en URL | Verificar el ID. |\n| Pinveco delegación 404 | Ciudad mal escrita en URL | Sólo Madrid, Barcelona, Valencia están configuradas. |\n\n---\n\n## Personalización\n\nLas páginas se pueden editar desde **Sitio web** de Odoo (modo edición visual). Los textos, imágenes y bloques de las páginas Sunset/Pinveco están en plantillas QWeb dentro de `views/templates/*.xml`.\n\n---\n\n## Relacionado\n\n- [05 · Consultas web y leads](./05-consultas-web-y-leads.md) — qué se crea al recibir una reserva web.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — la pasarela de pago.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — origen de los precios y depósito que se muestran al cliente.\n- [03 · Flota y vehículos](./03-flota-y-vehiculos.md) — categorías y vehículos publicados.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) · Siguiente: [14 · Emails y reportes →](./14-emails-y-reportes.md)\n", "14-emails-y-reportes.md": "# 14 · Emails y Reportes\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué cubre este capítulo?\n\nLos dos canales de **comunicación con el cliente** y de **documentación impresa**:\n\n- **Emails automáticos** que envía el sistema (plantillas).\n- **Reportes PDF**: contrato de alquiler, anexo de ampliación, anexo de sustitución, informes de rayones.\n\n---\n\n## A. Emails automáticos\n\n### Plantilla 1 — \"Vehicle Rental Booking Mail Template\"\n\n**Identificador interno**: `vehicle_rental_booking_mail_template`\n\n| Atributo | Valor |\n|---|---|\n| **Modelo** | `vehicle.contract` |\n| **Asunto** | *\"Important: Vehicle Rental Contract Information for Your Upcoming Journey\"* |\n| **Remitente** | Email de la compañía del contrato |\n| **Destinatario** | El cliente (`customer_id`) |\n| **Auto delete** | Sí (se borra del log tras enviar) |\n\n#### Contenido del email\n\nEmail HTML formal que incluye:\n\n- **Saludo** al cliente por nombre.\n- **Tabla con los datos de la reserva**:\n  - Número de referencia.\n  - Vehículo.\n  - Fecha y dirección de recogida (calle, ciudad, provincia, CP, país).\n  - Fecha y dirección de devolución (mismo desglose).\n- **Recordatorios**:\n  - Revisar términos y condiciones (con enlace a la web de la compañía).\n  - Detalles sobre seguro, depósito reembolsable, revisión visual del vehículo antes del viaje.\n- **Datos de contacto** de la compañía (nombre, teléfono, email, web).\n- **Firma** con el *Responsable* del contrato.\n\n#### Disparador típico\n\n**Confirmación de reserva**, automática cuando se pulsa **In Progress** en el contrato:\n\n- El botón *In Progress* del contrato abre el compositor de email con esta plantilla ya cargada.\n- El operario revisa y envía.\n\n---\n\n### Plantilla 2 — \"Contrato de Vehículo\"\n\n**Identificador interno**: `email_template_vehicle_contract`\n\n| Atributo | Valor |\n|---|---|\n| **Modelo** | `vehicle.contract` |\n| **Asunto** | *\"Contrato de Alquiler de Vehículo\"* |\n| **Idioma** | Español |\n| **Auto delete** | No (queda registro en el historial del contrato) |\n\n#### Contenido del email\n\nEmail para enviar el **PDF del contrato** al cliente. Incluye:\n\n- Encabezado *\"Estimado/a [nombre o 'cliente']\"*.\n- *\"Adjunto encontrará el contrato de alquiler de vehículo correspondiente a su reserva.\"*\n- **Detalles de la Reserva**:\n  - Número de Contrato.\n  - Vehículo.\n  - Modelo.\n  - Fecha de Inicio.\n  - Fecha de Fin.\n  - Total Alquiler en euros.\n- Petición de revisar términos y condiciones.\n- Despedida y firma del *\"equipo de SUNSET RENT\"*.\n- Aviso de mensaje automático al pie.\n\n#### Disparador típico\n\nCuando el operario pulsa el botón **Enviar Contrato** (icono sobre, verde) en la ficha del contrato.\n\n---\n\n### Plantilla 3 — Anexo de ampliación\n\nEl **anexo de ampliación** se envía al cliente al pulsar **Enviar a firmar** desde una [Ampliación de contrato](./07-contratos.md#ampliacion-de-contrato):\n\n- Si **Odoo Sign está instalado**, se abre el wizard de Sign → se envía un email automático con el anexo PDF para firmar online.\n- Si Sign no está instalado, se marca como *Enviado* y se debe enviar manualmente por otro canal.\n\n---\n\n### Otros emails del flujo\n\nEl sistema también dispara correos apoyándose en plantillas estándar de Odoo:\n\n| Email | Origen | Cuándo |\n|---|---|---|\n| **Acuse de envío del formulario web de contacto** | Plantilla estándar CRM | El cliente envía `/contactus/enviar`. Se crea un lead y se notifica opcionalmente. |\n| **Factura al cliente** | Plantilla estándar de Customer Invoice | Cuando se crea una factura y se pulsa *Enviar e Imprimir*. Incluye PDF adjunto. |\n| **Enlaces de pago / pasarela** | Plantillas de payment providers (Redsys) | Cuando el cliente paga la reserva online. |\n| **Recordatorios de factura vencida** | Estándar Odoo | Cuando una factura está fuera de plazo. |\n| **Acceso al portal** | Estándar Odoo | Cuando el operario concede acceso al portal a un cliente. |\n\n---\n\n### Cómo personalizar una plantilla\n\n1. **Activar modo desarrollador** en Odoo (Ajustes → Activar Modo Desarrollador).\n2. **Configuración → Técnico → Email → Plantillas**.\n3. Buscar la plantilla por nombre.\n4. Editar el cuerpo HTML, el asunto, el idioma o el destinatario.\n5. Guardar.\n\n> Las plantillas usan **variables QWeb** (`{{object.customer_id.name}}`, etc.). No modifiques las variables si no sabes lo que haces — puede romper el envío.\n\n---\n\n### Notificaciones internas en el chatter\n\nIndependientemente del email al cliente, el contrato muestra eventos en el **chatter** (panel inferior del formulario):\n\n- *\"💰 Factura Pagada — La factura X por importe Y ha sido pagada completamente\"* — cuando una factura asociada al contrato pasa a *Paid*.\n- Tabla de detalles cuando se produce una **sustitución de vehículo** (fecha, motivo, vehículo anterior + sustituto, kilometraje, diferencia de precio, enlace al addendum).\n- Mensajes de cambio de estado del contrato.\n- Adjuntos PDF (contrato impreso, anexos generados).\n\n---\n\n## B. Reportes PDF\n\n### Reporte 1 — Contrato de Alquiler\n\n**Identificador**: `vehicle_rental.vehicle_contract_report`\n\n**Acción de informe** vinculada al modelo `vehicle.contract`.\n\n#### Cómo se genera\n\nTres maneras:\n\n1. **Botón \"Imprimir Contrato\"** en la cabecera del contrato (icono impresora) — descarga el PDF.\n2. **Botón \"Enviar Contrato\"** (icono sobre, verde) — genera el PDF, lo guarda como adjunto `Contrato_<REF>.pdf` y lo manda por email.\n3. **Menú \"Print\" estándar de Odoo** desde la propia ficha del contrato.\n\n#### Contenido del PDF\n\n- **Título**: *\"CONTRATO DE ALQUILER DE VEHÍCULO\"*.\n- **Cabecera**: *\"SUNSET RENT - Alquiler de Vehículos\"*.\n- **Datos del Cliente**:\n  - Nombre, email, teléfono.\n  - DNI/NIE y fecha de expiración.\n  - Domicilio.\n  - Carnet de conducir, fecha de expedición y de caducidad.\n- **Datos del Vehículo**:\n  - Vehículo (marca/modelo).\n  - Modelo.\n  - Categoría.\n  - Matrícula.\n  - Demás datos de flota.\n- **Fechas de recogida y devolución** + direcciones completas.\n- **Tarifa y cálculo del total** (precio/día × días + extras + seguro − descuentos = total).\n- **Condiciones de alquiler** (los *Terms & Conditions* del contrato).\n- **Política de cancelación** si aplica.\n- **Firma del cliente y de la empresa** al pie.\n\n---\n\n### Reporte 2 — Anexo de Ampliación\n\n**Identificador**: `action_report_vehicle_contract_extension_addendum`\n\n#### Cómo se genera\n\nDesde una [Ampliación de contrato](./07-contratos.md#ampliacion-de-contrato):\n\n- **Botón \"Enviar a firmar\"** — lo manda como documento de Sign con el cliente como firmante.\n- **Acción de impresión estándar** desde la ficha de la ampliación.\n\n#### Contenido\n\n- Referencia del contrato original.\n- Datos del cliente.\n- **Fecha de fin original**.\n- **Nueva fecha de fin**.\n- **Días de ampliación**.\n- **Tarifa por día**.\n- **Importe ampliación** (días × tarifa).\n- Firmas.\n\nSe anexa al contrato original como prueba de la ampliación.\n\n---\n\n### Reporte 3 — Anexo de Sustitución\n\n**Identificador**: `action_report_vehicle_substitution_addendum`\n\n#### Cómo se genera\n\n- **Automáticamente** al confirmar el wizard de [sustitución de vehículo](./10-mantenimiento-y-sustituciones.md#e-sustituciones) si está marcado el checkbox *Generar Addendum al Contrato*.\n- **Manualmente** desde la ficha de la sustitución → botón **Generar Addendum**.\n\n#### Contenido\n\n- Cabecera con datos de la empresa y del contrato.\n- **Datos del cliente** (nombre, DNI).\n- **Tabla del vehículo anterior**:\n  - Nombre, matrícula.\n  - Fecha de sustitución.\n  - Km de devolución.\n  - Nivel de combustible.\n  - Daños (con descripción e imagen pintada).\n- **Tabla del vehículo sustituto**:\n  - Nombre, matrícula.\n  - Km de entrega.\n  - Combustible.\n  - Daños previos (si los hay).\n- **Motivo y notas** de la sustitución.\n- **Diferencia de precio** si aplica.\n- **Firmas** del cliente y de la empresa.\n\nQueda **adjunto al chatter** del contrato y de la sustitución.\n\n---\n\n### Reporte 4 — Informe de Rayones (Scratch Report)\n\nAunque el modelo `vehicle.scratch.report` es principalmente un **registro fotográfico**, también se puede imprimir un informe individual.\n\n#### Cómo se genera\n\nDesde la ficha del scratch report → menú **Print**.\n\n#### Contenido\n\n- Nombre del informe.\n- Vehículo.\n- Fotografía a tamaño 250 × 250.\n- Compañía.\n\n---\n\n## C. Tareas programadas (ir.cron)\n\nEl módulo registra **dos procesos automáticos** en *Configuración → Técnico → Acciones Planificadas* (ambos **activos por defecto**, ejecutándose **una vez al día**):\n\n### Cron 1 — Vehicle Rental: Vehicle Contract Invoice\n\n| Atributo | Valor |\n|---|---|\n| **Modelo** | `vehicle.contract` |\n| **Acción** | `model.action_create_rent_payment_invoice()` |\n| **Frecuencia** | Cada 1 día |\n\n**Función**: revisa los contratos en curso y genera de forma automática las **facturas periódicas del alquiler** (cuotas que vencen hoy según el *Payment Type*).\n\nEsto evita que un operario tenga que crear manualmente la factura cada mes/periodo.\n\n### Cron 2 — Vehicle Rental: Vehicle Maintenance Schedule\n\n| Atributo | Valor |\n|---|---|\n| **Modelo** | `maintenance.request` |\n| **Acción** | `model.action_create_schedule_maintenance()` |\n| **Frecuencia** | Cada 1 día |\n\n**Función**: para cada solicitud de mantenimiento existente comprueba si hoy coincide con su *Fecha Próximo Mantenimiento*. Si coincide:\n\n1. Calcula la siguiente fecha sumando los días del horario configurado.\n2. Crea automáticamente una **nueva solicitud de mantenimiento** para el vehículo.\n3. Recalibra la siguiente fecha en función del nuevo registro.\n\n### Cron 3 — Cron de Redsys\n\n(No incluido en `data/ir_cron.xml` sino dentro del propio módulo de pagos)\n\n**Función**: cada **30 minutos** revisa las transacciones de Redsys de las últimas 24 horas que están en `done` pero a las que les falta el lead, e intenta crearlo automáticamente.\n\nEvita pérdidas si fallara el webhook puntualmente.\n\n---\n\n## D. Resumen rápido de comunicaciones\n\n| Tarea | Cómo se hace |\n|---|---|\n| Enviar email de confirmación de reserva | Botón **In Progress** del contrato lanza el compositor con la plantilla cargada |\n| Enviar el PDF del contrato al cliente | Botón **Enviar Contrato** (icono sobre) |\n| Imprimir el PDF del contrato | Botón **Imprimir Contrato** (icono impresora) o Print del menú |\n| Enviar enlace de pago al cliente | Abrir la factura → **Enviar e Imprimir** |\n| Enviar anexo de ampliación a firmar | Botón **Enviar a firmar** en la ampliación |\n| Generar anexo de sustitución | Automático al confirmar el wizard, o botón **Generar Addendum** |\n| Imprimir informe de rayones | Menú **Print** desde la ficha del scratch report |\n\n---\n\n## Validaciones y errores\n\n| Síntoma | Causa | Solución |\n|---|---|---|\n| El botón *Enviar Contrato* da error | Plantilla `email_template_vehicle_contract` no cargada | Reinstalar/cargar `data/email_templates.xml`. |\n| El email no llega al cliente | Servidor de correo mal configurado | Configurar SMTP en *Ajustes → Servidores de correo*. |\n| El PDF sale en blanco o sin estilos | wkhtmltopdf no instalado o mal configurado | Instalar wkhtmltopdf en el servidor. |\n| Las cuotas no se facturan solas | El cron está desactivado o la fecha de la cuota es futura | Revisar *Configuración → Técnico → Acciones Planificadas*. |\n| Las nuevas órdenes de mantenimiento no aparecen | El vehículo no tiene *Horario de Mantenimiento* asignado | Asignar uno desde la ficha del vehículo. |\n\n---\n\n## Relacionado\n\n- [07 · Contratos](./07-contratos.md) — botones *Enviar Contrato* e *Imprimir Contrato*.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — flujo de email con enlace de pago.\n- [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md) — anexo de sustitución.\n- [11 · Daños y rayones](./11-danos-y-rayones.md) — informe de rayones.\n- [15 · Configuración](./15-configuracion.md) — políticas, términos y secuencias que alimentan los PDFs.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [13 · Portal web público](./13-portal-web-publico.md) · Siguiente: [15 · Configuración →](./15-configuracion.md)\n", "15-configuracion.md": "# 15 · Configuración\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué hay aquí?\n\nEl menú **Vehicles Rental → Configuraciones** agrupa la configuración de catálogos auxiliares:\n\n- Políticas de Cancelación.\n- Términos de Acuerdo de Alquiler.\n- Informes de Rayones (ya cubiertos en [11 · Daños y rayones](./11-danos-y-rayones.md#d-informes-de-rayones-scratch-reports)).\n- Horarios de Mantenimiento (ya cubiertos en [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md#b-horarios-de-mantenimiento)).\n\nAdicionalmente, otras configuraciones que no están bajo este menú pero conviene conocer:\n\n- Secuencias de numeración (contratos, grupos, ampliaciones, etc.).\n- Productos especiales que usa el módulo.\n- Permisos y grupos de seguridad.\n\n---\n\n## A. Políticas de Cancelación\n\n### ¿Qué son?\n\nLas **Políticas de Cancelación** (`cancellation.policy`) son el **catálogo de plantillas de condiciones** que regulan qué pasa si el cliente cancela una reserva o contrato.\n\n### Cómo acceder\n\n**Vehicles Rental → Configuraciones → Políticas de Cancelación**\n\n### Campos\n\n| Campo | Notas |\n|---|---|\n| **Title** | Nombre comercial (obligatorio). Ej.: *\"Política Flexible\"*, *\"Política No Reembolsable\"*, *\"Política 48h\"*. |\n| **Compañía** | A qué compañía aplica (multi-empresa). |\n| **Terms & Conditions** | Editor HTML con el texto completo de la cláusula que verá el cliente. |\n\n### Cómo se aplican\n\n1. Crear las políticas necesarias en este menú.\n2. Al crear un contrato (manual o desde la web), elegir la política aplicable en la pestaña **Términos de Alquiler** o **Cancellation Policy**.\n3. El texto aparece en el **contrato PDF** y en los **emails al cliente**.\n4. Si el cliente cancela el contrato (estado *Cancelado*), la política rige las condiciones del reembolso.\n\n### Ejemplos de políticas típicas\n\n#### Política Flexible\n\n> *\"Si el cliente cancela antes de las 24 horas previas a la fecha de inicio, se devolverá el 100 % del importe pagado. Cancelaciones posteriores se descontará el equivalente a 1 día de alquiler.\"*\n\n#### Política Estándar 48h\n\n> *\"Cancelaciones antes de 48h: reembolso del 100 % del alquiler (mantenido el depósito). Cancelaciones entre 24-48h: reembolso del 50 %. Cancelaciones con menos de 24h: sin reembolso.\"*\n\n#### Política No Reembolsable\n\n> *\"Una vez confirmada la reserva, el importe no es reembolsable. El depósito se devuelve en cualquier caso si no hay incidencias.\"*\n\n### Uso desde el contrato\n\nCuando un contrato pasa a **Cancelado**, en su pestaña *Cancellation Policy*:\n\n1. Eliges la **Policy** del catálogo.\n2. El campo **Terms & Conditions** se autorrellena con el texto de la política.\n3. Indicas el **Cancellation Charge** (importe a cobrar).\n4. Pulsas **Cancellation Charge** → factura emitida al cliente con el cargo de cancelación.\n\n---\n\n## B. Términos de Acuerdo de Alquiler\n\n### ¿Qué son?\n\nLas **Cláusulas Generales** del contrato de alquiler (`rental.agreement.terms`) — el \"letra pequeña\" que se muestra en el PDF del contrato y, cuando procede, en la web pública.\n\n### Cómo acceder\n\n**Vehicles Rental → Configuraciones → Términos de Acuerdo de Alquiler**\n\n### Campos\n\n| Campo | Notas |\n|---|---|\n| **Title** | Nombre del bloque de términos (obligatorio). Ej.: *\"Condiciones Generales SUNSET 2025\"*, *\"Términos Furgonetas Pinveco\"*. |\n| **Compañía** | Compañía emisora (obligatorio). |\n| **Terms and Conditions** | Editor HTML con todas las cláusulas (responsabilidad civil, kilometraje, combustible, depósito, sanciones, etc.). |\n\n### Cómo se usan\n\n1. Crear los textos desde este menú con el editor enriquecido (negrita, listas, enlaces, imágenes).\n2. Al crear un contrato, en la pestaña **Términos de Alquiler**:\n   - Elegir el **Acuerdo de Alquiler** del catálogo.\n   - Al seleccionarlo, **rellena automáticamente** el campo *Terms & Conditions* del contrato.\n3. El texto aparece en el **PDF del contrato** que se imprime y se envía al cliente.\n\n### Cláusulas típicas que debe contener\n\n- **Responsabilidad civil del cliente**: qué pasa si causa un accidente.\n- **Kilometraje**: límite incluido y precio del km extra.\n- **Combustible**: política de \"lleno a lleno\" o equivalente.\n- **Depósito**: importe, condiciones de retención y devolución.\n- **Sanciones de tráfico**: a cargo del cliente; recargo administrativo por gestión.\n- **Limpieza extrema**: cuándo aplica un cargo de limpieza.\n- **Daños**: cómo se valoran y se cobran.\n- **Conductor adicional**: si se permite y a qué coste.\n- **Edad mínima del conductor** y **antigüedad del carnet**.\n- **Devolución fuera de horario**.\n- **Robo o pérdida de las llaves**.\n- **Jurisdicción aplicable**.\n\n### Ejemplo de uso\n\n> **Caso:** Tienes dos textos legales: uno para Sunset (coches) y otro para Pinveco (furgonetas profesionales, con cláusulas específicas de carga).\n\n1. Crear *\"Condiciones Generales Sunset 2026\"* — asignar a la compañía Sunset.\n2. Crear *\"Condiciones Generales Pinveco 2026\"* — asignar a la compañía Pinveco.\n3. Cada vez que se crea un contrato en una compañía u otra, eliges el acuerdo correspondiente.\n\n---\n\n## C. Horarios de Mantenimiento\n\nYa cubiertos en [10 · Mantenimiento y sustituciones · B](./10-mantenimiento-y-sustituciones.md#b-horarios-de-mantenimiento).\n\n### Resumen\n\n**Vehicles Rental → Configuraciones → Horarios de Mantenimiento**\n\nCada horario es un \"patrón\" del tipo \"Cada X días\" que se asigna a un vehículo para que el cron diario genere automáticamente nuevas órdenes de mantenimiento.\n\n---\n\n## D. Informes de Rayones\n\nYa cubiertos en [11 · Daños y rayones · D](./11-danos-y-rayones.md#d-informes-de-rayones-scratch-reports).\n\n### Resumen\n\n**Vehicles Rental → Configuraciones → Informes de Rayones**\n\nCatálogo fotográfico de daños conocidos por vehículo. Se consulta antes de cada devolución para descartar daños preexistentes.\n\n---\n\n## E. Otras configuraciones\n\n### Categorías de Vehículo\n\nLas **categorías** (`fleet.vehicle.category` extendido por el módulo) — Tipo A, Tipo C, Tipo F, etc. — son **el pilar** sobre el que se montan las [tarifas](./08-tarifas-seguros-depositos.md#a-tarifas-de-vehiculos), [seguros](./08-tarifas-seguros-depositos.md#b-tarifas-de-seguros) y [reglas de depósito](./08-tarifas-seguros-depositos.md#c-reglas-de-deposito).\n\n#### Cómo acceder\n\n**Flota → Configuración → Categorías de Vehículo** (en la app *Flota* estándar de Odoo, no en *Vehicles Rental*).\n\n#### Campos\n\n- **Nombre**: identificador (*Tipo A*, *Tipo C*…).\n- **Tipo**: Coche / Furgoneta / etc.\n- **Compañía**.\n\n> **Importante**: una vez en producción, **no cambies el nombre interno** de una categoría que ya tenga tarifas asignadas, o las relaciones se pueden romper.\n\n### Modelos de Vehículo\n\n**Flota → Configuración → Modelos de vehículos**\n\nEl módulo añade el **tipo \"Furgoneta\"** a los modelos estándar de Odoo. Cuando el tipo es *Coche* o *Furgoneta*, se muestran los bloques *Modelo* (asientos, color, año) y *Motor* (combustible, transmisión, potencia, cilindrada, emisiones).\n\nVer [03 · Flota y vehículos](./03-flota-y-vehiculos.md#modelos-de-vehiculo).\n\n### Secuencias de numeración\n\nLas secuencias (`ir.sequence`) definen el formato y el contador de los códigos automáticos:\n\n| Secuencia | Formato | Uso |\n|---|---|---|\n| **Vehicle Contract** | `Contracts/0001`, `Contracts/0002`... | Referencia del contrato. |\n| **Vehicle Contract Group** | `Group/0001`... | Referencia del grupo. |\n| **Multi Booking** | `BR/00001`... | Referencia de la reserva múltiple. |\n| **Vehicle Substitution** | `SUB/0001`... | Referencia de la sustitución. |\n| **Vehicle Extension** | `EXT/0001`... | Referencia de la ampliación. |\n\n#### Cómo cambiar el formato o el contador\n\n1. **Activar modo desarrollador**.\n2. **Ajustes → Técnico → Secuencias**.\n3. Buscar la secuencia por nombre.\n4. Editar **Prefijo**, **Sufijo**, **Tamaño del número**, **Padding**, **Próximo número**.\n\n> Cuidado al cambiar el contador hacia atrás: puedes generar referencias duplicadas.\n\n### Productos especiales\n\nEl módulo usa varios **productos** internos que deben existir en el catálogo:\n\n| Producto | XML ID | Uso |\n|---|---|---|\n| **Vehicle Rent Charge** | `vehicle_rent_charge` | Líneas de cuotas y ampliaciones. |\n| **Vehicle Rent Deposit** | `vehicle_rent_deposit` | Depósito y devolución (nota de crédito). |\n| **Vehicle Rent Extra Charge** | `vehicle_rent_extra_charge` | Cargos por exceso de tiempo/km. |\n| **Vehicle Damage Amount** | `vehicle_damage_amount` | Importe de daños. |\n| **Vehicle Contract Cancellation Charge** | `vehicle_contract_cancellation_charge` | Cargo de cancelación. |\n\n#### Cómo verificarlos\n\n**Inventario → Productos** (o **Ventas → Productos**).\n\nSi alguno no existe, **el módulo falla** al intentar facturar. Hay que crearlo o reinstalar el módulo.\n\n### Diario contable\n\nCada compañía necesita un **Diario de tipo \"Ventas\"** configurado para que el módulo pueda emitir facturas.\n\n#### Cómo verificarlo\n\n**Contabilidad → Configuración → Diarios** — debe existir al menos uno con tipo *Sales*.\n\n> Si no hay, todas las acciones de facturar abortan con mensaje guía hacia *Contabilidad > Configuración > Diarios*.\n\n### Permisos y grupos\n\nEl módulo respeta los grupos de permisos estándar de Odoo:\n\n| Grupo | Capacidades |\n|---|---|\n| **Vehicle Rental / User** | Operativa básica: contratos, devoluciones, consultas. |\n| **Vehicle Rental / Manager** | Además: configurar tarifas, políticas, términos, reglas de depósito, categorías. |\n| **Portal** | Cliente externo: ve sólo sus facturas y consultas. |\n\nConfiguración desde **Ajustes → Usuarios y compañías → Usuarios** → pestaña *Permisos de acceso*.\n\nReglas más detalladas en `security/ir.model.access.csv` (no se modifica habitualmente).\n\n### Pasarela Redsys\n\n**Ajustes → Pasarelas de Pago → Redsys**\n\nCampos típicos:\n\n- Merchant Code.\n- Terminal.\n- Clave secreta.\n- Entorno: Test / Producción.\n- URLs de retorno.\n\nVer [09 · Pagos y Redsys](./09-pagos-y-redsys.md) para el detalle del flujo.\n\n### Servidor de correo\n\n**Ajustes → Servidores de correo**\n\nNecesario para que los emails se envíen al cliente. Si está mal configurado, los emails se quedan en cola.\n\n---\n\n## F. Categorías excluidas del portal web\n\nPor defecto, en el portal web (`/web/booking-enquiry`) se **excluyen** las siguientes categorías:\n\n- *Furgoneta*\n- *Tipo E - Bici Eléctrica*\n- *Tipo E*\n- *Bici Eléctrica*\n\nSi quieres incluir o excluir más categorías, se modifica en el código del controller `pinveco_home_controller.py` / `sunset_home_controller.py` — esta operación requiere intervención técnica.\n\n---\n\n## G. Multi-compañía: Sunset vs Pinveco\n\nEl módulo está pensado para operar **dos marcas simultáneamente**:\n\n- **Sunset Rent a Car** — Compañía Odoo \"Sunset\".\n- **Pinveco** — Compañía Odoo \"Pinveco\".\n\nCada compañía:\n\n- Tiene su propia configuración contable (diarios, impuestos, banco).\n- Tiene sus propias tarifas, seguros, depósitos, políticas.\n- Tiene sus propios vehículos en la flota.\n- Tiene sus propios contratos.\n\nEl usuario puede cambiar de compañía activa desde el **selector superior derecho** de Odoo.\n\n### Cómo dar de alta una segunda compañía\n\n**Ajustes → Compañías → Crear**\n\n1. Nombre, dirección, NIF.\n2. Logo.\n3. Configurar contabilidad.\n4. Configurar pasarela de pagos (si aplica).\n5. Asignar usuarios a esa compañía.\n\n---\n\n## H. Datos iniciales recomendados\n\nCuando se instala el módulo por primera vez, recomendado configurar **en este orden**:\n\n1. **Compañías** (si hay multi-marca: Sunset y Pinveco).\n2. **Diarios contables** de ventas para cada compañía.\n3. **Productos especiales** (verificar que existen los 5 productos listados arriba).\n4. **Categorías de vehículo** (Tipo A, Tipo C, etc.).\n5. **Modelos de vehículo**.\n6. **Vehículos** (la flota).\n7. **Horarios de mantenimiento** y asignarlos a los vehículos.\n8. **Tarifas de vehículos** (precios por categoría/temporada).\n9. **Tarifas de seguros** (Básico/Sin Franquicia × duración × conductor).\n10. **Reglas de depósito** (por categoría y tipo de tarjeta).\n11. **Políticas de cancelación**.\n12. **Términos de acuerdo de alquiler**.\n13. **Pasarela Redsys** (si se va a cobrar online).\n14. **Servidor de correo**.\n15. **Plantillas de email** (verificar que están cargadas y traducidas).\n16. **Usuarios y permisos**.\n\nUna vez configurado todo lo anterior, **ya se pueden crear los primeros contratos**.\n\n---\n\n## I. Multi-idioma\n\nEl módulo incluye traducciones en:\n\n- **Español (es)** — traducción principal.\n- **Francés (fr)** — completa.\n- **Italiano (it)** — completa.\n- **Árabe (ar_001)** — completa.\n\n### Cómo activar otro idioma\n\n1. **Ajustes → Traducciones → Idiomas → Activar idioma**.\n2. Recargar la página.\n3. El idioma del usuario se cambia desde **Preferencias → Idioma**.\n\n---\n\n## Relacionado\n\n- Todos los demás capítulos: la configuración alimenta todo el sistema.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — el núcleo de la configuración funcional.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [14 · Emails y reportes](./14-emails-y-reportes.md) · Siguiente: [16 · Solución de problemas →](./16-solucion-de-problemas.md)\n", "16-solucion-de-problemas.md": "# 16 · Solución de Problemas\n\n[← Volver al índice](./README.md)\n\n---\n\n## Cómo usar este capítulo\n\nCuando algo no funciona, busca el síntoma en la tabla. Cada caso indica **causa, comprobaciones y solución**.\n\nSi el problema es muy específico, mira también el capítulo correspondiente:\n\n- Reservas/leads → [05](./05-consultas-web-y-leads.md) / [06](./06-reservas.md).\n- Contratos → [07](./07-contratos.md).\n- Pagos → [09](./09-pagos-y-redsys.md).\n- Daños → [11](./11-danos-y-rayones.md).\n- Devolución → [12](./12-devolucion-y-facturacion.md).\n- Portal web → [13](./13-portal-web-publico.md).\n- Emails/PDFs → [14](./14-emails-y-reportes.md).\n\n---\n\n## A. Problemas con contratos\n\n### El botón \"In Progress\" no aparece\n\n**Causa**: el contrato no está en estado *Borrador*.\n\n**Solución**: sólo desde *Borrador* se puede activar. Si está en otro estado, no se puede volver atrás — duplica el contrato si necesitas reactivar.\n\n---\n\n### \"No se puede activar este contrato porque las fechas se solapan con otro(s) contrato(s) en curso para el mismo vehículo: REF1 (dd/mm/yyyy → dd/mm/yyyy)...\"\n\n**Causa**: ya existe otro contrato *En Progreso* o *Devuelto* del mismo vehículo en el mismo rango de fechas.\n\n**Solución**:\n1. Anotar la referencia del contrato conflictivo.\n2. Abrirlo y revisar las fechas reales.\n3. Si fue un error, cancelar o ajustar uno de los dos.\n4. Si las fechas son correctas, **el vehículo está físicamente ocupado** — usar otro vehículo.\n\n---\n\n### \"Drop-off Date debe ser mayor\"\n\n**Causa**: la fecha de devolución es anterior o igual a la de recogida.\n\n**Solución**: corregir las fechas. Si son del mismo día, asegurarse de que la hora de devolución es posterior a la de recogida.\n\n---\n\n### \"Elija su unidad de alquiler preferida\" al activar\n\n**Causa**: el campo *Tipo de Alquiler* (`rent_type`) está vacío.\n\n**Solución**: en el bloque *Rent Details*, elegir el tipo (Días/Semanas/Meses/Horas/Años/KM/Millas).\n\n---\n\n### \"Debe definir las fechas de recogida y devolución antes de activar el contrato\"\n\n**Causa**: falta una de las dos fechas.\n\n**Solución**: rellenar *Pick-up Date* y *Drop-off Date*.\n\n---\n\n### \"The Rent per Day/Week/... must be greater than zero\"\n\n**Causa**: el campo *Precio del alquiler* está a 0.\n\n**Solución**:\n1. Comprobar que el vehículo tiene categoría asignada.\n2. Comprobar que hay una **tarifa vigente** para esa categoría + duración + km. Si no, crear una en *Tarifas de Vehículos*.\n3. Si no se encuentra tarifa, introducir el precio a mano y rellenar **Motivo del Descuento**.\n\n---\n\n### \"El precio calculado automáticamente es X €/día pero el precio actual es Y €/día. Si esto es intencional, indica el motivo en Motivo del Descuento\"\n\n**Causa**: editaste el precio y el sistema detecta que difiere del calculado por las reglas.\n\n**Solución**: rellenar el campo **Motivo del Descuento** (texto libre) en el contrato. Ejemplos: *\"Cliente VIP\"*, *\"Promoción navidad\"*, *\"Precio web\"*.\n\n---\n\n### \"El vehículo seleccionado no tiene una categoría asignada\"\n\n**Causa**: el modelo del vehículo no tiene categoría.\n\n**Solución**: ir a *Flota → Modelos de vehículos*, abrir el modelo y asignarle una categoría.\n\n---\n\n### \"Error: Campos no válidos: Recoger ciudad, Ciudad de entrega\"\n\n**Causa**: el contrato se intenta confirmar sin completar las ciudades de recogida y entrega.\n\n**Solución**: editar el contrato en estado *Borrador*, rellenar ambas ciudades en la sección *Detalles de Recogida y Devolución*.\n\n---\n\n### \"No se pueden crear cuotas\"\n\n**Causa**: faltan campos obligatorios para generar el calendario.\n\n**Solución**: verificar que están rellenos:\n- Tipo de Alquiler.\n- Fechas de inicio y fin.\n- Renta > 0.\n- Tipo de Pago.\n\n---\n\n### El botón \"Create Installment\" no aparece\n\n**Causa**: o no estás en *En Progreso*, o ya hay cuotas creadas.\n\n**Solución**: si ya hay cuotas, ir a la pestaña *Vehicle Payment Details* para verlas. Si no, primero pasar a *En Progreso*.\n\n---\n\n### \"Esta ampliación ya tiene factura creada\"\n\n**Causa**: ya pulsaste *Crear factura de ampliación* anteriormente.\n\n**Solución**: ir a la factura existente con el botón *Ver factura*. Si quieres anularla, va por Contabilidad.\n\n---\n\n### \"La nueva fecha de fin debe ser posterior a la fecha de fin original del contrato\"\n\n**Causa**: en una ampliación, has puesto una fecha igual o anterior a la original.\n\n**Solución**: poner una fecha posterior a la actual de fin del contrato.\n\n---\n\n## B. Problemas con la flota\n\n### No puedo pasar el vehículo a \"Under Maintenance\"\n\n**Causa**: tiene un contrato activo.\n\n**Solución**: devolver primero el contrato (botón *Return* en el contrato) o sustituir el vehículo en ese contrato.\n\n---\n\n### El odómetro no se actualiza\n\n**Causa**: el botón *Update Vehicle Data* exige odómetro nuevo > odómetro actual.\n\n**Solución**: introducir un valor superior al actual del vehículo en flota.\n\n---\n\n### Un vehículo no aparece en el asistente de reserva\n\n**Causas posibles**:\n1. Está en estado *En Mantenimiento*.\n2. Tiene un contrato solapado en las fechas seleccionadas.\n3. Su categoría no coincide con la elegida en el wizard.\n4. Es de otra compañía.\n\n**Solución**: comprobar estado, contratos solapados (pestaña *Rental Contracts* del vehículo), categoría y compañía.\n\n---\n\n## C. Problemas con tarifas y depósitos\n\n### No se aplica tarifa automática\n\n**Causas posibles**:\n1. No hay regla de tarifa vigente para la categoría + duración + km.\n2. La regla está archivada (inactiva).\n3. La regla está fuera de su rango *Válido Desde / Hasta*.\n4. El vehículo no tiene categoría.\n\n**Solución**: ir a *Tarifas de Vehículos*, quitar los filtros automáticos (*Activas + Vigentes Hoy*) para ver todas. Crear o ajustar la regla.\n\n---\n\n### Depósito calculado a 0 €\n\n**Causas posibles**:\n1. No hay regla de depósito para esa categoría + tipo de tarjeta.\n2. El campo *Tipo de Tarjeta para Depósito* no está rellenado en el contrato.\n3. La casilla *Usar Depósito de Regla* no está marcada y no hay depósito manual.\n\n**Solución**: revisar *Reglas de Depósitos* y rellenar el tipo de tarjeta en el contrato.\n\n---\n\n### El seguro sale demasiado caro\n\n**Causa**: la casilla *Conductor Especial (-25 o +60 años)* está marcada y eleva el precio.\n\n**Solución**: verificar la fecha de nacimiento del cliente. Si no aplica, desmarcar el checkbox.\n\n---\n\n## D. Problemas con facturas\n\n### \"If you don't define a journal of type 'Sales' in this company...\"\n\n**Causa**: no hay diario de ventas configurado.\n\n**Solución**: ir a *Contabilidad → Configuración → Diarios* y crear uno con tipo *Sales*.\n\n---\n\n### La factura no se publica automáticamente\n\n**Causas posibles**:\n1. La factura tiene impuestos mal configurados.\n2. El cliente no tiene los campos obligatorios completos.\n3. Falta una cuenta contable en el producto.\n\n**Solución**: abrir la factura en *borrador*, completar lo que falta, pulsar *Confirmar*.\n\n---\n\n### El cron de facturación de cuotas no se ejecuta\n\n**Causas posibles**:\n1. El cron está desactivado.\n2. El servidor Odoo no está ejecutando crons (proceso `odoo-cron` parado).\n3. La fecha de la cuota es futura.\n\n**Solución**:\n1. *Configuración → Técnico → Acciones Planificadas* → buscar \"Vehicle Contract Invoice\" y activarlo.\n2. Verificar que el servidor está corriendo en modo con `-c odoo.conf` con workers.\n3. Esperar a que llegue la fecha.\n\n---\n\n## E. Problemas con Redsys / pagos online\n\n### Cliente paga pero no aparece el lead\n\n**Causas posibles**:\n1. El webhook de Redsys falló (problema de red entre Redsys y tu servidor).\n2. La URL del webhook está mal configurada.\n3. El cliente cerró la página antes de volver a `/rental/success`.\n\n**Solución**:\n1. Esperar 30 minutos: el **cron de recuperación** revisa transacciones huérfanas y crea el lead.\n2. Si no ocurre, ir a *Configuración técnica → Transacciones de pago*, buscar la transacción del cliente y verificar su estado.\n3. Si está en `done` pero sin lead, lanzar manualmente `/rental/manual-webhook?order_number=XXX` (sólo administradores).\n4. Revisar logs con prefijo `REDSYS:`.\n\n---\n\n### \"Tarjeta no reconocida\" en el formulario web\n\n**Causa**: el servicio Freebinchecker no reconoce el BIN (tarjeta extranjera o nueva).\n\n**Solución**: el sistema asume *débito* por defecto. El cliente puede continuar — sólo afecta al cálculo del depósito.\n\n---\n\n### El TPV de Redsys da error genérico\n\n**Causas posibles**:\n1. Credenciales mal configuradas (Merchant Code, Terminal, Clave).\n2. Entorno *test* vs *producción* mezclado.\n3. URL de retorno mal puesta en el panel de Redsys.\n\n**Solución**: revisar *Ajustes → Pasarelas de Pago → Redsys* y contrastar con la documentación de tu banco/TPV.\n\n---\n\n### Factura de depósito no se concilia\n\n**Causa**: el diario bancario de Redsys no está bien configurado.\n\n**Solución**: *Contabilidad → Configuración → Diarios* — verificar que existe un diario tipo *Banco* asociado a Redsys.\n\n---\n\n## F. Problemas con emails\n\n### El email \"Enviar Contrato\" da error\n\n**Causa**: la plantilla `email_template_vehicle_contract` no está cargada.\n\n**Solución**:\n1. *Configuración → Técnico → Email → Plantillas* — buscarla.\n2. Si no existe, **actualizar el módulo** desde *Apps → Vehicle Rental → Actualizar*.\n3. Esto recarga `data/email_templates.xml`.\n\n---\n\n### Los emails no llegan al cliente\n\n**Causa**: servidor de correo SMTP mal configurado o saturado.\n\n**Solución**:\n1. *Ajustes → Servidores de correo* — verificar configuración.\n2. *Configuración → Técnico → Email → Emails* — ver cola; si están en *Failed*, reintentar.\n3. Comprobar que el dominio remitente está autorizado (SPF, DKIM).\n\n---\n\n### Falla el formulario de contacto en `/contactus/enviar`\n\n**Causa**: faltan campos obligatorios.\n\n**Solución**: el formulario muestra *\"Faltan campos obligatorios...\"*. Verificar nombre, email, teléfono y mensaje.\n\n---\n\n## G. Problemas con el PDF del contrato\n\n### El PDF sale en blanco o sin estilos\n\n**Causa**: wkhtmltopdf no está instalado o tiene versión incompatible.\n\n**Solución**: instalar `wkhtmltopdf 0.12.5` (versión recomendada por Odoo) en el servidor:\n\n```bash\n# Ubuntu/Debian\nsudo apt install wkhtmltopdf\n```\n\n---\n\n### El daño pintado no aparece en el PDF\n\n**Causa**: el PDF se generó **antes** de pintar el daño.\n\n**Solución**: volver a imprimir el PDF (botón *Imprimir Contrato* o *Enviar Contrato*).\n\n---\n\n## H. Problemas con la web pública\n\n### \"No hay vehículos disponibles\" para todas las fechas\n\n**Causas posibles**:\n1. Realmente no hay vehículos de esa categoría libres.\n2. Todos los vehículos están en *En Mantenimiento*.\n3. Hay otras consultas web abiertas (`leads` sin contrato) bloqueando los huecos.\n\n**Solución**:\n1. *Disponibilidad* del panel para ver ocupación visual.\n2. *Consultas de Reserva* para ver leads abiertos: convertir a contrato o descartar los antiguos.\n\n---\n\n### Una categoría no aparece en `/web/booking-enquiry`\n\n**Causa**: está en la lista de **categorías excluidas** del controller:\n\n- Furgoneta\n- Tipo E - Bici Eléctrica\n- Tipo E\n- Bici Eléctrica\n\n**Solución**: requiere modificación del código del controller. Tarea técnica.\n\n---\n\n### La página de Pinveco da 404 para una delegación\n\n**Causa**: sólo Madrid, Barcelona y Valencia están configuradas en el código.\n\n**Solución**: requiere modificación del controller `pinveco_home_controller.py` para añadir más delegaciones.\n\n---\n\n## I. Problemas con traducciones\n\n### Las traducciones no se aplican\n\n**Causa**: caché de traducciones de Odoo.\n\n**Solución**:\n1. *Ajustes → Traducciones → Cargar/Actualizar traducciones*.\n2. Reiniciar el servidor Odoo.\n3. Limpiar caché del navegador (Ctrl+Shift+R).\n\n---\n\n### Algunos textos siguen en inglés\n\n**Causa**: cadenas no traducidas en el código del módulo, o usuario con idioma erróneo.\n\n**Solución**:\n1. *Preferencias del usuario → Idioma → Español*.\n2. Si la cadena no existe en español, contactar a desarrollo para añadirla a `i18n/es.po`.\n\n---\n\n## J. Buenas prácticas\n\n### Antes de pulsar \"In Progress\"\n\nVerificar que todos estos campos están bien:\n\n- Cliente con email, teléfono, DNI, carnet.\n- Vehículo correcto.\n- Fechas (hora incluida).\n- Direcciones de recogida y devolución.\n- Tipo de alquiler y precio.\n- Seguro elegido.\n- Depósito configurado.\n- Documentos del cliente subidos.\n\n### Antes de devolver un vehículo\n\n1. **Inspeccionar el coche** físicamente: exterior, interior, depósito de combustible, kilometraje.\n2. **Comparar con scratch reports** previos.\n3. **Hacer fotos** de cualquier daño nuevo.\n4. **Pintar el daño** en el painter si lo hay.\n5. **Sólo entonces** pulsar *Return*.\n\n### Antes de cancelar un contrato\n\n1. Verificar con el cliente las condiciones de la política.\n2. Confirmar el importe del cargo de cancelación.\n3. Acordar la devolución del depósito.\n4. Documentar el motivo en el campo *Cancellation Reasons*.\n\n### Periodicidad recomendada de tareas\n\n| Tarea | Frecuencia |\n|---|---|\n| Revisar **Consultas de Reserva** | Cada mañana. |\n| Revisar **Pending Invoices** en el panel | Cada mañana. |\n| Verificar **Solicitudes de mantenimiento** pendientes | Cada mañana. |\n| Actualizar **Tarifas** por temporada | Mensual o trimestral. |\n| Revisar **scratch reports** de la flota | Tras cada devolución. |\n| Conciliar **pagos Redsys** | Diario (lo hace solo el sistema, sólo supervisar). |\n| Backup de la base de datos | Diario (responsabilidad de IT). |\n\n---\n\n## K. Cuándo escalar a un técnico\n\nLlamar a tu equipo de IT o al proveedor del módulo (Cositt) si:\n\n- Los **crons no se ejecutan** después de comprobar que están activos.\n- Las **facturas no se generan** y los logs muestran errores Python.\n- El **portal web no carga** o devuelve 500.\n- Redsys **rechaza todas las transacciones** (problema de credenciales o entorno).\n- Aparecen errores con menciones a `Traceback`, `MissingError`, `ValidationError` que no entiendes.\n- Necesitas **modificar lógica del módulo** (cambiar categorías excluidas, añadir delegaciones, etc.).\n\n---\n\n## L. Comprobaciones rápidas (checklist técnico)\n\nAntes de cargar la culpa al módulo, comprueba lo básico:\n\n- ✅ Servidor Odoo arrancado y respondiendo.\n- ✅ Base de datos accesible.\n- ✅ wkhtmltopdf instalado en versión compatible (0.12.5).\n- ✅ SMTP configurado y operativo.\n- ✅ Redsys configurado en modo correcto (test/producción).\n- ✅ Cron de Odoo ejecutándose.\n- ✅ Plantillas de email cargadas.\n- ✅ Productos especiales existen en el catálogo.\n- ✅ Diarios contables tipo *Sales* configurados.\n- ✅ Categorías de vehículo con tarifas vigentes.\n\n---\n\n## Relacionado\n\n- Todos los capítulos anteriores: cada uno tiene su propia sección de errores frecuentes.\n- [01 · Introducción](./01-introduccion.md) — recordatorio del menú y flujos.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [15 · Configuración](./15-configuracion.md)\n"};

const renderer = new marked.Renderer();
renderer.heading = function({ text, depth }) {
  const id = text.toLowerCase()
    .replace(/[áàâä]/g,'a').replace(/[éèêë]/g,'e')
    .replace(/[íìîï]/g,'i').replace(/[óòôö]/g,'o')
    .replace(/[úùûü]/g,'u').replace(/ñ/g,'n')
    .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');
  return `<h${depth} id="${id}">${text}</h${depth}>\n`;
};
renderer.paragraph = function({ text }) {
  if (/^\[←/.test(text.trim()) || /^\[→/.test(text.trim())) return '';
  return `<p>${text}</p>\n`;
};
marked.use({ renderer, gfm: true, breaks: false });

function buildSidebar() {
  let html = '', lastSection;
  for (const ch of CHAPTERS) {
    if (ch.section !== lastSection) {
      if (ch.section) html += `<div class="nav-section">${ch.section}</div>`;
      lastSection = ch.section;
    }
    html += `<div class="nav-item" data-file="${ch.file}" onclick="navigate('${ch.file}')">${ch.title}</div>`;
  }
  document.getElementById('nav-items').innerHTML = html;
}

function navigate(file, anchor) {
  window.location.hash = anchor ? `${file}#${anchor}` : file;
}

function loadPage(file, anchor) {
  currentFile = file;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.file === file));
  const ch = CHAPTERS.find(c => c.file === file);
  document.getElementById('bc-title').textContent = ch ? ch.title : file;
  document.title = (ch ? ch.title + ' — ' : '') + 'Guía de Uso · Sunset Rent';

  const md = CONTENT[file];
  const content = document.getElementById('content');

  if (!md) {
    content.innerHTML = `<p style="color:red">Archivo no encontrado: ${file}</p>`;
    return;
  }

  content.innerHTML = marked.parse(md);

  content.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (/\.md(#|$)/.test(href) && !href.startsWith('http')) {
      a.addEventListener('click', e => {
        e.preventDefault();
        const [mdFile, anch] = href.replace('./', '').split('#');
        navigate(mdFile, anch || null);
      });
    } else if (href.startsWith('http')) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener');
    }
  });

  if (window.hljs) content.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));

  const idx = CHAPTERS.findIndex(c => c.file === file);
  const prev = idx > 0 ? CHAPTERS[idx - 1] : null;
  const next = idx < CHAPTERS.length - 1 ? CHAPTERS[idx + 1] : null;
  const navEl = document.createElement('div');
  navEl.className = 'chapter-nav';
  navEl.innerHTML = `
    ${prev ? `<button class="chapter-btn" onclick="navigate('${prev.file}')">← ${prev.title}</button>` : '<span class="chapter-btn ghost">.</span>'}
    ${next ? `<button class="chapter-btn" onclick="navigate('${next.file}')">${next.title} →</button>` : '<span class="chapter-btn ghost">.</span>'}
  `;
  content.appendChild(navEl);

  if (anchor) {
    setTimeout(() => {
      const el = document.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  } else {
    window.scrollTo(0, 0);
  }
  closeSidebar();
}

function resolveHash() {
  const raw = window.location.hash.replace('#', '') || 'README.md';
  const parts = raw.split('#');
  const file = CHAPTERS.find(c => c.file === parts[0]) ? parts[0] : 'README.md';
  loadPage(file, parts[1] || null);
}

window.addEventListener('hashchange', resolveHash);
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

buildSidebar();
resolveHash();
</script>
</body>
