o de ventas de la compañía. El usuario después las valida/publica como cualquier otra factura de Odoo.\n\n---\n\n## Ampliación de contrato\n\n### ¿Qué es?\n\nUna **Ampliación** (`vehicle.contract.extension`) sirve para **alargar la fecha de fin** de un contrato ya activo (ej. el cliente decide seguir tres días más).\n\nGenera:\n- Un **anexo firmable**.\n- Una **factura de ampliación** propia.\n- **Actualiza automáticamente la fecha de fin del contrato** al facturar.\n\n### Cómo se crea\n\nDesde el contrato:\n- Botón **Nueva ampliación** (acción del modelo, `action_new_extension`), o\n- Desde el menú **Vehicles Rental → Ampliaciones → Crear**.\n\nAl abrirse el formulario, el sistema **sugiere por defecto la tarifa diaria del contrato** como \"Tarifa por día\".\n\n### Campos del formulario\n\n| Campo | Notas |\n|---|---|\n| **Contrato** | Referencia al contrato origen (obligatorio). |\n| **Cliente** | Hereda del contrato (sólo lectura). |\n| **Fecha fin original** | Sólo lectura. |\n| **Nueva fecha de fin** | Obligatoria. Debe ser **posterior** a la original. Si no, error: *\"La nueva fecha de fin debe ser posterior a la fecha de fin original del contrato\"*. |\n| **Días de ampliación** | Calculado automáticamente (diferencia en días). |\n| **Tarifa por día** | Editable. Por defecto, la del contrato. |\n| **Importe ampliación** | Calculado: días × tarifa. |\n| **Estado** | Borrador / Enviado a firmar / Firmado / Facturado / Cancelado. |\n| **Factura ampliación** y **Estado pago** | Sólo lectura. |\n\n### Botones de la ampliación\n\n| Botón | Estado requerido | Qué hace |\n|---|---|---|\n| **Enviar a firmar** | Borrador | Si Odoo Sign está instalado, abre el wizard de Sign con la ampliación como referencia y el cliente como firmante. Estado pasa a *Enviado a firmar*. Si Sign no está, marca como *Enviado* manualmente. |\n| **Marcar como enviado** | Borrador | Para indicar manualmente que se envió por otro canal. |\n| **Marcar como firmado** | Borrador o Enviado | Marca como *Firmado* sin pasar por Sign (firma presencial). |\n| **Cancelar** | Cualquier estado salvo Facturado | Pasa a *Cancelado*. |\n| **Crear factura de ampliación** | Sólo Firmado | Genera factura al cliente con producto *Vehicle Rent Charge*, cantidad = días, precio = tarifa diaria. Pasa a **Facturado** **y reemplaza la fecha de fin del contrato** por la nueva. |\n| **Ver factura** | Si existe | Abre la factura. |\n\n> Cuando Odoo Sign devuelve la firma del cliente, el estado se actualiza **automáticamente** a *Firmado* sin intervención manual.\n\n### Anexo PDF\n\nEl anexo se renderiza desde el botón *Enviar a firmar* como documento de Sign y queda asociado al contrato/cliente. También se puede imprimir suelto con el reporte `action_report_vehicle_contract_extension_addendum`.\n\n### Ejemplo\n\n> **Caso:** Contrato hasta el 15 de junio. El cliente decide quedarse hasta el 20.\n>\n> 1. Crear ampliación. Fecha original: 15-jun. Nueva fecha: 20-jun. Tarifa: 35 €/día (hereda del contrato). Importe: 5 × 35 = 175 €.\n> 2. Pulsar *Enviar a firmar* → cliente firma online.\n> 3. Pulsar *Crear factura de ampliación* → se genera la factura por 175 €.\n> 4. La fecha de fin del contrato se actualiza a 20-jun automáticamente.\n\n---\n\n## Contratos en grupo\n\n### ¿Para qué sirven?\n\nUn **Grupo de Contratos** (`vehicle.contract.group`) permite que un mismo cliente tenga **varios contratos a la vez** (ej. una flota de 5 coches alquilados en bloque) y **se facture todo de forma consolidada en una sola factura**.\n\nSe generan automáticamente al usar [Reserva Múltiple](./06-reservas.md#b-reserva-multiple), o se pueden crear a mano desde el menú **Contratos Grupo**.\n\n### Campos del grupo\n\n| Campo | Notas |\n|---|---|\n| **Referencia** | Autogenerada. |\n| **Cliente** | Obligatorio. |\n| **Compañía y Moneda** | Heredadas. |\n| **Fecha Inicio / Fin** | Para sincronizar contratos hijos. |\n| **Tipo de Pago** | Diario / Semanal / Mensual / Trimestral / Anual / Pago Completo. |\n| **Tipo de Tarifa** | Tarifa Estándar / FLEXIRENT. |\n| **Tipo de Tarjeta** | Débito / Crédito (al cambiar, propaga la elección a todos los contratos hijos). |\n| **Impuestos** | Aplicables. |\n| **Contratos** | Lista de contratos hijo. |\n| **Nº Contratos** | Contador. |\n| **Importe Total** y **Depósito Total** | Sumatorios. |\n| **Facturas Consolidadas** | La factura única generada. |\n| **Observaciones** | Texto libre. |\n\n### Estado del grupo (calculado automáticamente)\n\n| Estado | Cuándo |\n|---|---|\n| **Borrador** | Sin contratos o todos en borrador. |\n| **Activo** | Al menos un contrato en progreso. |\n| **Devolución Parcial** | Coexisten contratos en progreso y devueltos. |\n| **Finalizado** | Todos los contratos devuelto/cancelado (los no cancelados son todos devuelto). |\n| **Cancelado** | Todos los contratos cancelados. |\n\n### Botones del grupo\n\n| Botón | Qué hace |\n|---|---|\n| **Ver contratos del grupo** | Lista los contratos hijo. |\n| **Ver facturas del grupo** | Lista las facturas consolidadas. |\n| **Añadir Vehículo al Grupo** | Abre el [Asistente de Reserva](./06-reservas.md) precargado con cliente, fechas, tipo de tarifa y vinculado a este grupo. El nuevo contrato queda ligado automáticamente. |\n| **Activar todos** | Recorre todos los contratos *Borrador* del grupo y los pasa a *En Progreso* (valida solapamientos, fechas, tipo de alquiler). Si algún contrato falla, muestra la lista de errores. Después crea automáticamente las cuotas en cada uno. |\n| **Facturación consolidada** | Genera **UNA SOLA factura** al cliente con todas las líneas, prefijadas con el vehículo entre corchetes: ej. `[Tesla M3 - 1234ABC] Installment 1`. Incluye cuotas pendientes, depósitos no facturados, seguro × días, servicios extras de cada contrato. Si no hay nada que facturar → error *\"No hay conceptos pendientes de facturar\"*. |\n\n### Ejemplo\n\n> **Caso:** Empresa de mensajería alquila 5 furgonetas durante 6 meses.\n>\n> 1. Crear *Reserva Múltiple* con cliente \"Mensajería Sevilla S.L.\" y 5 líneas (una por furgoneta).\n> 2. Confirmar → se generan grupo + 5 contratos.\n> 3. Cada mes, pulsar **Facturación consolidada** → factura única con 5 líneas (una por furgoneta) que se manda al cliente.\n\n---\n\n## Firma digital\n\nEl módulo se apoya en **Odoo Sign** (módulo `sign`, ya declarado como dependencia) para firmar:\n\n### Contratos\n\n- El botón **Enviar Contrato** **no es Sign directamente**: renderiza el PDF, lo adjunta a un email con la plantilla `email_template_vehicle_contract` y abre el compositor para que el operario lo envíe al cliente.\n- Adicionalmente, dentro del contrato, el cliente puede dejar su **firma** en el campo *Signature* (widget táctil) al pie, con la *Date* justo encima.\n\n### Ampliaciones\n\n- Botón explícito **Enviar a firmar**.\n- Si Odoo Sign está activo, abre la acción `sign.action_sign_send_request` con la ampliación como `reference_doc` y el cliente como firmante.\n- Cuando el cliente firma en Sign, el módulo lo detecta automáticamente y cambia el estado de la ampliación de *Enviado a firmar* a *Firmado*.\n\n### Sustituciones\n\n- La sustitución guarda **dos firmas binarias** (`customer_signature` y `company_signature`) que se rellenan en el paso 4 del [wizard de sustitución](./10-mantenimiento-y-sustituciones.md#e-sustituciones) y quedan estampadas en el anexo PDF.\n\n---\n\n## Imprimir y enviar contrato\n\n### Botón \"Imprimir Contrato\"\n\n(Icono impresora en la cabecera.)\n\nLanza el reporte `vehicle_rental.vehicle_contract_report` y descarga el PDF.\n\n### Botón \"Enviar Contrato\"\n\n(Icono sobre, verde, en la cabecera.)\n\n1. Genera el PDF.\n2. Lo guarda como adjunto `Contrato_<REF>.pdf` en el contrato.\n3. Abre el compositor de email con la plantilla `email_template_vehicle_contract` ya cargada, destinatario = cliente.\n4. El operario revisa y envía.\n\n### Qué muestra el PDF\n\nTítulo: **CONTRATO DE ALQUILER DE VEHÍCULO**.\nCabecera: \"SUNSET RENT - Alquiler de Vehículos\".\n\nContenido:\n\n- **Datos del Cliente**: nombre, email, teléfono, DNI/NIE + fecha de expiración, domicilio, carnet + fecha de expedición + fecha de caducidad.\n- **Datos del Vehículo**: vehículo, modelo, categoría, matrícula y datos de flota.\n- **Fechas de recogida y devolución** + direcciones.\n- **Tarifa y cálculo del total**.\n- **Condiciones de alquiler** (términos seleccionados).\n- **Política de cancelación** si aplica.\n- **Firma del cliente y de la empresa** al pie.\n\nVer más detalles en [14 · Emails y reportes](./14-emails-y-reportes.md).\n\n---\n\n## Recorrido típico de un alquiler (resumen)\n\n1. Operador abre **Reservar Vehículo** → elige cliente, fechas, categoría, duración, km, tarifa → ve precio → elige vehículo → *Crear contrato*.\n2. Se abre el **contrato en Borrador** → completa DNI, carnet, dirección, seguro, fotos, términos.\n3. Pulsa **In Progress** → contrato activo y se abre email de confirmación al cliente.\n4. Pulsa **Create Installment** → genera cuotas según *Payment Type*.\n5. Día a día, las cuotas se facturan (automáticamente con el cron o manualmente con *Create Invoice* por cuota).\n6. *(Opcional)* Si el cliente quiere extender → crear **Ampliación** → enviar a firmar → al firmar y facturar, se mueve la fecha de fin.\n7. *(Opcional)* Si hay avería → **Sustituir Vehículo** (wizard 4 pasos) → cambio de vehículo + addendum + ajuste de precio.\n8. Al final → **Return** → registrar odómetro/daños → **Damage Invoice** si hay daños → **Return Deposit Invoice** para devolver el depósito.\n9. Si hay cancelación: **Cancel** → rellenar política → **Cancellation Charge**.\n\n---\n\n## Relacionado\n\n- [06 · Reservas](./06-reservas.md) — cómo se crea un contrato desde cero.\n- [05 · Consultas web y leads](./05-consultas-web-y-leads.md) — cómo se crea desde una reserva web.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — de dónde salen los precios.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — formas de cobro.\n- [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md) — sustituciones de vehículo.\n- [11 · Daños y rayones](./11-danos-y-rayones.md) — el painter de daños y la facturación.\n- [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) — proceso de cierre del contrato.\n- [14 · Emails y reportes](./14-emails-y-reportes.md) — plantillas y PDFs.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [06 · Reservas](./06-reservas.md) · Siguiente: [08 · Tarifas, seguros y depósitos →](./08-tarifas-seguros-depositos.md)\n", "08-tarifas-seguros-depositos.md": "# 08 · Tarifas, Seguros y Depósitos\n\n[← Volver al índice](./README.md)\n\n---\n\n## Índice del capítulo\n\n- [A · Tarifas de vehículos](#tarifas-de-vehiculos)\n- [B · Tarifas de seguros](#tarifas-de-seguros)\n- [C · Reglas de depósito](#reglas-de-deposito)\n- [D · Pólizas de seguro (documentales)](#polizas-de-seguro)\n- [E · Opciones de pago (cuotas)](#opciones-de-pago)\n- [F · Servicios extras](#servicios-extras)\n- [G · Cómo se calcula el total del contrato](#calculo-del-total)\n\n---\n\n## A. Tarifas de vehículos\n\n### ¿Para qué sirven?\n\nLas **Tarifas de Vehículos** (`vehicle.pricing.rule`) definen el **precio por día (o por paquete)** del alquiler, en función de:\n\n- La **categoría** del vehículo (Tipo A, Tipo C, Tipo F, etc.).\n- Los **kilómetros incluidos**.\n- La **duración** del alquiler.\n- El **periodo de vigencia** (alta/baja temporada, promociones).\n\nSin tarifa aplicable no se calcula precio automático: el contrato exige introducirlo a mano.\n\n### Dónde se configuran\n\n**Vehicles Rental → Tarifas de Vehículos**\n\nPor defecto, la pantalla aplica dos filtros automáticos: **Activas** y **Vigentes hoy**.\n\n### Vista lista\n\n| Columna | Significado |\n|---|---|\n| **Categoría de Vehículo** | Tipo A, Tipo C, etc. |\n| **Tipo** | Estándar / FLEXIRENT — color azul si FLEXIRENT, gris si está desactivada. |\n| **Km Límite** | Tope de km incluidos. |\n| **Duración** | Rango (`1-2d`, `3-5d`, etc.). |\n| **Km Incluidos** | Cantidad numérica. |\n| **Días Paquete** | Solo FLEXIRENT. |\n| **Precio/Día** | Con IVA. |\n| **Sin IVA** | Calculado. |\n| **Vigente Desde / Hasta** | Periodo de validez. |\n\nFiltros: Activas, Inactivas, Tarifas Estándar, FLEXIRENT, Vigentes Hoy.\n\n### Vista formulario\n\n#### Cabecera\n\n- **Duplicar con Nuevas Fechas** — copia la tarifa para un periodo nuevo sin rellenarla otra vez. Útil para crear tarifas de temporada.\n- **Archivar/Desarchivar** (estrella) — oculta tarifas obsoletas sin borrarlas. Si está inactiva aparece un cartel rojo *\"Inactiva\"*.\n- **Nombre** — se genera automáticamente, no se edita:\n  - Estándar: `Tipo A - 100 Km - 1-2 días`.\n  - FLEXIRENT: `Tipo C - FLEXIRENT 3000km / 30 días`.\n\n#### Información General\n\n| Campo | Notas |\n|---|---|\n| **Categoría de Vehículo** | Obligatorio. Tipo A, Tipo C, etc. |\n| **Tipo de Tarifa** | *Tarifa Estándar* (precio por día) o *Flexirent – Larga Temporada* (paquete cerrado de días con km incluidos). |\n| **Compañía** | En entornos multicompañía. |\n\n#### Vigencia\n\n- **Válido Desde** — obligatorio. Por defecto, hoy.\n- **Válido Hasta** — vacío = sin caducidad.\n\n#### Pestaña \"Configuración Estándar\" (sólo si Estándar)\n\n- **Rango de Kilometraje**: 100 Km · 350 Km · 500 Km · 650 Km · 850 Km · Sin límite.\n- **Rango de Duración**: 4h (mañana o tarde) · 1-2 días · 3-5 días · 6-10 días · 11-20 días · 21-29 días.\n- **Precio (IVA inc.)** y **Precio sin IVA** (divide entre 1,21).\n- Aviso azul: *\"Esta tarifa se aplica por día de alquiler. El total se calcula multiplicando este precio por el número de días.\"*\n\n#### Pestaña \"Configuración FLEXIRENT\" (sólo si FLEXIRENT)\n\n- **Kilometraje Total Incluido**: ej. 3.000 km para un paquete de 30 días.\n- **Duración (días)**: por defecto 30.\n- **Precio por Km Extra**: por defecto 0,21 €. Se cobra cuando el cliente excede los km incluidos.\n- **Precio Total Paquete** (IVA inc. y sin IVA).\n- Aviso amarillo: *\"FLEXIRENT: Paquete de larga temporada. El precio es total del paquete, no por día. Los km adicionales se cobran a X €/km + IVA.\"*\n\n#### Pestaña \"Notas y Condiciones\"\n\nCampo libre para condiciones especiales o restricciones.\n\n### Cómo se aplican al crear un contrato\n\nCuando rellenas un contrato y Odoo conoce **vehículo + fechas + km totales**, busca la tarifa con estos criterios:\n\n1. Misma **categoría** que el vehículo del contrato.\n2. **Tipo estándar** (la búsqueda principal usa siempre estándar; FLEXIRENT requiere selección expresa).\n3. **Rango de km** que cubre el total (≤100, ≤350, ≤500, ≤650, ≤850 o sin límite).\n4. **Rango de duración** que encaja con los días del alquiler.\n5. Que **hoy** esté dentro de *Válido Desde / Válido Hasta*.\n6. **Activa**.\n\nLa tarifa encontrada se muestra como **\"Tarifa Aplicada\"** en el contrato y su precio rellena el campo **\"Precio Calculado (Vehículo)\"**.\n\n> Si el usuario **cambia el precio a mano**, Odoo lo detecta (`price_manually_modified = True`) y **exige rellenar el campo \"Motivo del Descuento\"**.\n\nSi no se encuentra tarifa, no bloquea el formulario — sólo deja el precio a 0 y registra un aviso.\n\n### Validaciones\n\n- Fecha \"Válido Hasta\" debe ser **posterior** a \"Válido Desde\".\n- Precio **mayor que cero**.\n- Tarifa estándar exige Km y Duración; FLEXIRENT exige Km Total.\n- **No puede haber dos tarifas** con la misma combinación de categoría + tipo + km + duración + fecha de inicio + compañía.\n\n### Ejemplos\n\n- **Alta temporada (julio-agosto)**: duplicas las tarifas activas con el botón *Duplicar con Nuevas Fechas*, subes precio y pones `Válido Desde 2026-07-01 / Válido Hasta 2026-08-31`.\n- **Baja temporada**: tarifas con precios más bajos para \"11-20 días\" y \"21-29 días\" del Tipo A.\n- **Descuento por duración**: la propia tabla ya está pensada así — el precio/día baja cuando el rango de duración sube.\n- **FLEXIRENT**: paquete cerrado tipo \"3.000 km / 30 días = 1.200 €\", todo lo que exceda se cobra a 0,21 €/km.\n\n---\n\n## B. Tarifas de seguros\n\n### Tipos de seguro disponibles\n\nSólo hay **dos coberturas**:\n\n- **Seguro Básico – Franquicia 300 €**: el cliente paga los primeros 300 € de daños.\n- **Seguro Sin Franquicia**: cobertura total de daños. El cliente no paga nada.\n\n### Dónde se configuran\n\n**Vehicles Rental → Tarifas de Seguros**\n\nFiltros automáticos: *Activas + Vigentes Hoy*.\n\n### Vista lista\n\n| Columna | Significado |\n|---|---|\n| **Tipo de Seguro** | Verde = Básico · Naranja = Sin Franquicia. |\n| **Rango de Duración** | 1-3 días, 4-7 días, etc. |\n| **Tipo de Conductor** | Normal / Especial. |\n| **Precio por Día** | Con IVA y sin IVA. |\n| **Válido Desde / Hasta** | Periodo. |\n\n### Vista formulario — campos\n\n| Campo | Notas |\n|---|---|\n| **Tipo de Seguro** | Básico (Franquicia 300€) / Sin Franquicia. |\n| **Rango de Duración** | 1-3 días · 4-7 días · 8-15 días · 16-30 días · 31-60 días · 61-180 días · 181-365 días. |\n| **Tipo de Conductor** | *Normal* o *Especial (<25 o >60 años)* — el especial paga más caro. |\n| **Precio por Día (IVA incluido)** | Editable. |\n| **Precio por Día (sin IVA)** | Calculado. |\n| **Válido Desde / Hasta** | Periodo. |\n| **Notas y Coberturas** | Texto libre. |\n\nUna **bandera lateral verde \"Sin Franquicia\"** aparece cuando se elige esa modalidad.\n\n**Avisos contextuales** dentro del formulario:\n\n- Si tipo = Básico → cartel azul con coberturas y aviso de franquicia.\n- Si tipo = Sin Franquicia → cartel verde \"Cobertura total de daños sin franquicia\".\n- Si conductor = Especial → cartel amarillo recordando el motivo de la tarifa más alta.\n\n### Cómo se asignan\n\n**El seguro NO se asigna por vehículo ni por categoría**. Se aplica a **todos los contratos** — es **obligatorio**.\n\nLa tarifa que aplica al contrato se decide cruzando tres parámetros que el operario indica en el contrato:\n\n1. **Tipo de seguro** elegido (Básico / Sin Franquicia).\n2. **Días totales** del alquiler → determina el rango de duración.\n3. **¿Conductor especial?** (checkbox del contrato — se rellena según fecha de nacimiento del cliente).\n\nEs decir, hay **una tarifa por cada combinación (tipo × duración × tipo conductor)**. Cualquiera que sea el vehículo, se cobra el precio de esa fila.\n\n### Cómo aparece en el contrato\n\nBloque **\"🛡️ Seguro y Cobertura\"** del contrato:\n\n| Campo | Notas |\n|---|---|\n| **Tipo de Seguro** | Obligatorio. Por defecto *Básico*. Editable sólo en Borrador. |\n| **Conductor Especial (-25 o +60 años)** | Checkbox. |\n| **Precio Seguro/Día** | Calculado. Sólo lectura. |\n| **Total Seguro** | = precio/día × días totales. Sólo lectura. |\n\nDebajo aparece un cartel azul (Básico) o verde (Sin Franquicia) recordando la cobertura.\n\n### Precio de respaldo\n\nSi no se ha definido tarifa para la combinación buscada, se aplica un **precio de respaldo**:\n\n- **8 €/día para Básico**.\n- **12 €/día para Sin Franquicia**.\n\n### Validaciones\n\n- Precio **mayor que cero**.\n- Fecha Hasta posterior a Desde.\n- No puede haber dos tarifas con (tipo + duración + conductor + fecha inicio + compañía) repetidos.\n\n---\n\n## C. Reglas de depósito\n\n### ¿Qué es el depósito dinámico?\n\nEs el sistema que calcula **automáticamente la fianza** que debe pagar el cliente al alquilar, según:\n\n1. La **categoría del vehículo**.\n2. El **tipo de tarjeta** con la que va a pagar (débito / crédito).\n3. Opcionalmente, un **porcentaje sobre el precio del alquiler**.\n\n> Las tarjetas de **crédito** suelen tener depósito menor (porque garantizan el cobro mejor). Las de **débito** llevan depósito mayor.\n\nEn la **web pública**, el sistema detecta el tipo de tarjeta de forma automática consultando los **6 primeros dígitos (BIN)** contra el servicio externo **Freebinchecker**, y muestra al cliente el depósito recalculado en tiempo real.\n\n### Dónde se configura\n\n**Vehicles Rental → Reglas de Depósitos**\n\n### Vista lista\n\n| Columna | Significado |\n|---|---|\n| **Nombre** | Auto: \"Tipo A - Tarjeta de Débito\". |\n| **Categoría de Vehículo** | A qué categoría aplica. |\n| **Tipo de Tarjeta** | Etiqueta naranja = Débito · Azul = Crédito. |\n| **Depósito Fijo** | Importe fijo. |\n| **% Alquiler** | Porcentaje sobre el alquiler. |\n| **Válido Desde / Hasta** | Periodo. |\n| **Activa** | Interruptor. |\n\n### Vista formulario\n\n#### Identificación\n\n- Botón estrella **Archivar**.\n- **Categoría de Vehículo** (obligatoria).\n- **Tipo de Tarjeta**: Débito / Crédito.\n\n#### Configuración de Depósito\n\n| Campo | Significado |\n|---|---|\n| **Depósito Fijo** | Importe en €. |\n| **Porcentaje sobre Alquiler (%)** | Ej. 15 = 15 % del precio del alquiler. |\n| **Aplicar Ambos (Fijo + Porcentaje)** | Si marcado: depósito = fijo **+** porcentaje. Si no: se toma **el mayor de los dos**. |\n| **Depósito Mínimo** | Nunca cobrar menos que esto. |\n| **Depósito Máximo** | Nunca cobrar más que esto (0 = sin tope). |\n\n#### Vigencia\n\n- **Válido Desde / Hasta**.\n\n#### Información Adicional\n\n- Moneda, Compañía, Notas.\n\n### Cómo se aplica al crear el contrato\n\nEn el contrato hay un selector **\"Tipo de Tarjeta para Depósito\"** (débito/crédito). Cuando se rellena **vehículo + tipo de tarjeta**, Odoo:\n\n1. Busca la regla vigente para esa categoría y tipo de tarjeta.\n2. Calcula el depósito sobre el precio total del alquiler.\n3. Muestra el resultado en el campo **\"Depósito Calculado (Automático)\"**.\n\nSi está activo el flag **\"Usar Depósito de Regla\"** (por defecto sí), ese importe se usa en la facturación. Si se desactiva, el usuario puede introducir un depósito manual.\n\n### Ejemplos\n\n**Ejemplo 1 — Depósito fijo simple**:\n- Tipo A · Tarjeta Débito → Fijo 50 € · Mínimo 50 € · Máximo sin límite.\n- Tipo A · Tarjeta Crédito → Fijo 25 € · Mínimo 25 € · Máximo sin límite.\n\n**Ejemplo 2 — Depósito por porcentaje con horquilla**:\n- Tipo C · Débito → Fijo 0 € · Porcentaje 15 % · Aplicar Ambos = No · Mínimo 30 € · Máximo 150 €.\n- Resultado para un alquiler de 100 € → 15 % = 15 € → se aplica el **mínimo (30 €)**.\n- Resultado para un alquiler de 1.500 € → 15 % = 225 € → se aplica el **máximo (150 €)**.\n\n### Devolución del depósito\n\nEl contrato dispone, además del depósito normal, de:\n\n- **Factura de Depósito** (`deposit_invoice_id`) con su estado de pago.\n- **Factura de Devolución de Depósito** (`return_deposit_invoice_id`) con su estado.\n\nEs decir, se cobra al inicio con una factura, y al cerrar se emite una nota de crédito para reintegrar al cliente (total o parcial si hubo daños).\n\nCuando el cliente paga la reserva por web con **Redsys**, el sistema crea **automáticamente** la factura del depósito y la marca como **pagada y conciliada** contra el diario bancario de Redsys.\n\nVer [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) para el detalle del cierre.\n\n### Validaciones\n\n- Al menos uno de Fijo o Porcentaje > 0.\n- Mínimo ≤ Máximo (si Máximo > 0).\n- No puede repetirse (categoría + tarjeta + fecha + compañía).\n\n---\n\n## D. Pólizas de seguro\n\n### ¿Para qué sirven?\n\nLas **Pólizas de Seguro** (`insurance.policy`) permiten **archivar pólizas de seguro asociadas a un contrato concreto**: número, importe, documento PDF/imagen escaneada.\n\n> **NO se usan para tarificar** — eso lo hacen las [Tarifas de Seguros](#tarifas-de-seguros). Las pólizas son un **registro documental**: la póliza real del vehículo o del contrato.\n\n### Campos\n\n| Campo | Notas |\n|---|---|\n| **Policy Number** | Número de póliza. Obligatorio. |\n| **Name** | Nombre de la póliza. Obligatorio. |\n| **Description** | Descripción libre. |\n| **File Name** | Nombre del archivo adjunto. |\n| **Document** | Campo binario: PDF/imagen de la póliza. |\n| **Policy Amount** | Importe de la póliza. Debe ser > 0. |\n| **Compañía** y **Moneda** | Heredadas. |\n| **Vehicle Contract** | Contrato al que pertenece. Se borra en cascada si se borra el contrato. |\n\nLas pólizas viven **dentro del contrato** como lista adjunta (pestaña *Insurance Policy*). No tienen menú propio.\n\n---\n\n## E. Opciones de pago\n\n### ¿Para qué sirven?\n\nLas **Opciones de Pago** (`vehicle.payment.option`) definen el **calendario de cobros del contrato**: las cuotas en las que se le va a facturar al cliente.\n\n### Modalidades disponibles\n\nEl contrato tiene un campo **Tipo de Pago** con estas opciones:\n\n| Valor | Significado |\n|---|---|\n| **Daily** | Diario — una cuota por día. |\n| **Weekly** | Semanal — una cuota por semana. |\n| **Monthly** | Mensual — una cuota por mes. |\n| **Quarterly** | Trimestral — una cuota por trimestre. |\n| **Yearly** | Anual — una cuota por año. |\n| **Full Payment** | Pago único — una sola cuota por el total. |\n\nCombinado con el **Tipo de Tarifa** (`rent_type`) del contrato (Horas / Días / Semanas / Meses / Años / Kilómetros / Millas).\n\n### Cómo se eligen en el contrato\n\nEn la pestaña **Vehicle Payment Details** del contrato se ve la lista de cuotas generadas. Cada cuota tiene:\n\n| Campo | Significado |\n|---|---|\n| **Name** | Nombre/concepto, traducible (ej. *Cuota Enero*, *Pago Inicial*). |\n| **Payment Date** | Fecha de cobro. Obligatoria. |\n| **Payment Amount** | Importe. |\n| **Invoice Item** | Producto que aparecerá en la factura. |\n| **Invoice** | Factura generada (vínculo). |\n| **Payment State** | Sincronizado desde la factura: No pagado / Parcial / Pagado / Reembolsado. |\n\n### Qué pasa al pulsar \"Crear factura de cuota\"\n\nAl ejecutar **Create Invoice** sobre una cuota, Odoo genera una factura del cliente que incluye **automáticamente, en este orden**:\n\n1. **Alquiler del vehículo** (con el importe de la cuota).\n2. **Seguro** (precio/día × días totales).\n3. **Depósito de Seguridad** (el calculado de la regla si está activo, o el manual).\n4. **Km Extra (FLEXIRENT)** si el alquiler ha excedido el paquete.\n5. **Servicios Extras** del contrato.\n6. **Cargos Extras** (horas/días/semanas/meses extras pasados sobre lo contratado).\n\nEl importe total de la factura sustituye al *Payment Amount* de la cuota.\n\n> Si la cuota tiene importe 0 → aviso amarillo *\"Please add the proper payment amount\"* y no se crea.\n\n---\n\n## F. Servicios extras\n\n### Catálogo\n\nLos **Servicios Extras** (`extra.service`) son **productos** del catálogo de Odoo marcados como tales: silla bebé, GPS, conductor adicional, cadenas, portaesquís, etc.\n\nSe crean desde **Inventario / Ventas → Productos** y se añaden al contrato como líneas de servicio.\n\n### Campos por línea (dentro del contrato)\n\n| Campo | Notas |\n|---|---|\n| **Product** | Producto. Obligatorio. Se selecciona del catálogo. |\n| **Description** | Descripción libre que sustituye al nombre del producto en la factura. |\n| **Quantity** | Por defecto 1. |\n| **Amount** | Precio unitario. Al elegir un producto se autocompleta con su precio de tarifa (`lst_price`) y se puede ajustar. |\n| **Sub Total** | Calculado = cantidad × importe. |\n| **Moneda** | Heredada de la compañía. |\n| **Vehicle Contract** | Contrato al que pertenece. |\n\n### Cómo se añaden\n\nEn el contrato, pestaña **Extra Services**:\n\n1. Pulsar **Añadir línea**.\n2. Elegir el producto.\n3. Ajustar cantidad y descripción si quieres.\n4. El precio se rellena solo desde el catálogo.\n\nEl total se suma al campo **Total Cargos por Servicios Extras** (`extra_service_charge`) y entra en el **Total General con IVA**.\n\nCuando se genera la factura (manual o automática), **cada extra produce una línea propia** con su descripción, cantidad, precio y los impuestos del propio producto.\n\n### Ejemplos\n\n- **GPS Navegador** — 5 €/día.\n- **Silla de Bebé Grupo 1** — 3 €/día.\n- **Conductor Adicional** — precio fijo por contrato.\n- **Cadenas de Nieve** — 8 €/día.\n\n---\n\n## G. Cómo se calcula el total del contrato\n\nLa **lógica de tarificación** (`vehicle.contract.pricing`) junta todo lo anterior y calcula el total. El usuario en pantalla sólo ve los campos resultado, pero conviene entender el cálculo paso a paso.\n\n### Paso 1 — Precio del alquiler del vehículo\n\n- `calculated_rent` ← buscar tarifa estándar más reciente activa para la categoría del vehículo.\n- Si el campo *Renta* del contrato está vacío, se autoasigna.\n- Si el usuario lo edita a mano, se marca como modificado y se exige **Motivo del Descuento** (salvo que venga de reserva web).\n\n### Paso 2 — Subtotal Vehículo\n\n`subtotal_vehicle_rent = renta × total_días + coste_km_extra`\n\n> El coste km extra sólo aplica si la tarifa es **FLEXIRENT** y el cliente ha pasado el paquete: `extra_km_used × precio_km_extra`.\n\n### Paso 3 — Coste del Seguro\n\n- Se busca la tarifa de seguro por (tipo + rango de días + conductor especial).\n- `total_insurance_cost = precio_seguro_por_día × total_días`.\n- Si no hay tarifa: precio por defecto 8 € (Básico) o 12 € (Sin Franquicia).\n\n### Paso 4 — Depósito\n\n- Si **\"Usar Depósito de Regla\"** está activo → `calculated_deposit = regla.calcular_depósito(subtotal_vehículo)`.\n- Si no → el depósito es el manual introducido por el usuario.\n\n### Paso 5 — Servicios Extras\n\nSuma de todas las líneas de extras (`extra_service_charge`).\n\n### Paso 6 — Cargos Extras (penalizaciones)\n\nPor horas, días, semanas, meses o años contratados de más.\n\n### Paso 7 — Totales finales\n\n- **Total General (IVA incluido)** = Subtotal Vehículo + Total Seguro + Servicios Extras.\n- **Total General (sin IVA)** = el anterior dividido entre 1,21.\n- **El depósito y los cargos extras** aparecen como líneas separadas en la factura final.\n\n### Reglas especiales y avisos en pantalla\n\n- **Aviso amarillo** si cambias el precio del alquiler: *\"El precio calculado automáticamente es X €/día pero el precio actual es Y €/día. Si esto es intencional, indica el motivo en Motivo del Descuento\"*.\n- **Bloqueo** si el vehículo no tiene categoría asignada: *\"El vehículo seleccionado no tiene una categoría asignada\"*.\n- **Botón \"Recalcular Precio\"** en el contrato: aplica de nuevo las tarifas vigentes. Notificación verde *\"Precio Recalculado\"* o amarilla *\"No se encontró tarifa\"*.\n- **Botón \"Ver Tarifa Aplicada\"**: abre la ficha de la regla de tarificación que se está usando.\n- **Aviso FLEXIRENT** (amarillo) cuando se han usado km extras: *\"Se han utilizado N km adicionales\"*.\n- **Carteles informativos** según tipo de seguro (azul Básico / verde Sin Franquicia).\n\n### Botón \"Crear Factura Automática\"\n\nGenera una factura del cliente con:\n\n- Línea 1: **Alquiler del vehículo**, descripción con matrícula, fechas, días y km.\n- Línea 2: **Seguro** (siempre, con etiqueta \"Conductor Especial\" si aplica).\n- Línea 3: **Km Extra FLEXIRENT** si los hay.\n- Línea 4 y siguientes: una línea por cada **servicio extra**.\n\nLa factura queda vinculada al contrato y aparece en el panel de control de alquileres.\n\n---\n\n## Resumen rápido para el operario\n\n| Tarea | Menú |\n|---|---|\n| Cambiar precio del alquiler de Tipo A en alta temporada | Vehicles Rental → Tarifas de Vehículos |\n| Subir el precio del seguro Sin Franquicia para alquileres largos | Vehicles Rental → Tarifas de Seguros |\n| Cambiar el depósito que se cobra a tarjetas débito | Vehicles Rental → Reglas de Depósitos |\n| Añadir GPS o silla de bebé a un contrato | Contrato → pestaña *Servicios Extras* |\n| Recalcular precio si cambias fechas o km | Contrato → botón *Recalcular Precio* |\n| Ver qué tarifa se está aplicando | Contrato → botón *Ver Tarifa Aplicada* |\n\n---\n\n## Relacionado\n\n- [07 · Contratos](./07-contratos.md) — donde se ven aplicados los precios calculados.\n- [09 · Pagos y Redsys](./09-pagos-y-redsys.md) — cobro online del depósito y de las cuotas.\n- [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) — devolución del depósito.\n- [03 · Flota y vehículos](./03-flota-y-vehiculos.md) — el campo *Categoría* del vehículo es crítico para que aplique tarifa.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [07 · Contratos](./07-contratos.md) · Siguiente: [09 · Pagos y Redsys →](./09-pagos-y-redsys.md)\n", "09-pagos-y-redsys.md": "# 09 · Pagos y Redsys\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿Qué cubre este capítulo?\n\nCómo se cobra al cliente:\n\n- **Formas de pago** disponibles (cuotas, pago único).\n- **Pasarela Redsys** integrada con Odoo (cobro online con tarjeta).\n- **Enlaces de pago** que se mandan al cliente.\n- **Seguimiento de pagos** y reconciliación contable.\n\n---\n\n## Formas de pago\n\nLas **modalidades de cobro** están explicadas con detalle en [08 · Tarifas, seguros y depósitos · Opciones de pago](./08-tarifas-seguros-depositos.md#e-opciones-de-pago).\n\nResumen rápido del campo **Tipo de Pago** del contrato:\n\n| Modalidad | Significado |\n|---|---|\n| **Daily** | Una cuota por día. |\n| **Weekly** | Una cuota por semana. |\n| **Monthly** | Una cuota por mes. |\n| **Quarterly** | Una cuota por trimestre. |\n| **Yearly** | Una cuota por año. |\n| **Full Payment** | Una sola cuota por el total. |\n\nUna vez activado el contrato con el botón **In Progress**, se pulsa **Create Installment** y se genera el calendario de cuotas según el Tipo de Pago elegido.\n\n---\n\n## Pasarela Redsys\n\n### ¿Para qué se usa?\n\nCobrar **online al cliente** desde la web pública (reserva por internet) y desde el portal del cliente cuando se le envía un enlace de pago. La pasarela está integrada con el módulo oficial `payment_redsys` de Odoo.\n\n### Cómo se configura\n\nLa configuración real de credenciales (Merchant Code, Terminal, Clave secreta de Redsys, entorno producción/test, URLs de retorno) se hace desde el **menú estándar de Odoo**:\n\n**Ajustes → Pasarelas de Pago → Redsys**\n\nEn este módulo, lo único añadido es:\n\n- Lógica para **crear automáticamente la oportunidad CRM** y la **factura del depósito** cuando el pago termina con éxito.\n- **Webhook propio** para confirmar la transacción y desbloquear estados.\n- Páginas de éxito y error con URL `/rental/success` y `/rental/error`.\n\n---\n\n## Flujo completo del pago online (reserva web)\n\n### Paso 1 — El cliente rellena la reserva\n\nEn la web pública, en la página de detalle del vehículo (`/web/vehicle-detail/<id>`), el cliente:\n\n1. Selecciona tipo de alquiler (oferta fija o tarifa dinámica).\n2. Elige fechas, ubicación.\n3. Rellena el formulario: nombre, email, teléfono, DNI/NIE, fecha de expiración del DNI, dirección, fecha de nacimiento, carnet de conducir, fechas de expedición y caducidad.\n4. Introduce el **número de tarjeta** (sólo los 6 primeros dígitos / BIN son lo que ve el sistema).\n5. Selecciona el **tipo de tarjeta** (débito/crédito) — automatizado por BIN.\n\n### Paso 2 — Validación BIN y cálculo de depósito\n\nJavaScript valida el BIN contra **Freebinchecker** (`https://lookup.binlist.net/{BIN}`):\n\n- Autocompleta el tipo de tarjeta (Visa, Mastercard, Visa Débito, etc.).\n- Recalcula el **depósito** en pantalla según las [reglas de depósito](./08-tarifas-seguros-depositos.md#c-reglas-de-deposito).\n- Muestra el **total a pagar** (alquiler + depósito).\n\n### Paso 3 — Envío del formulario\n\nEl cliente pulsa enviar. Odoo crea una `payment.transaction` con:\n\n- **Importe** = alquiler + depósito.\n- **Proveedor** = Redsys.\n- **Referencia única** tipo `RENT-1716728400` (timestamp).\n- **Datos de la reserva** guardados en `booking_data_json` y en sesión.\n\n### Paso 4 — Redirección al TPV de Redsys\n\nURL: `/payment/process/{tx_id}` → el cliente paga con su tarjeta en la pantalla de Redsys.\n\n### Paso 5 — Redsys notifica el resultado\n\nPor **dos canales** independientes:\n\n#### Canal 1 — Webhook server-to-server (`/payment/redsys/webhook`)\n\nRedsys envía `Ds_Order` y `Ds_Response`:\n\n- Si `Ds_Response = 0000` (éxito) y la transacción está en `error`, `pending` o `draft` → se fuerza a `done`.\n- Si el método estándar falla, hace fallback a actualización directa en BD.\n\n#### Canal 2 — Redirección del usuario\n\n- A `/rental/success` (éxito).\n- A `/rental/error` (fallo).\n\n### Paso 6 — Al confirmar el pago (`done`)\n\nEl sistema, de forma **idempotente** (no se duplica si llega dos veces):\n\n1. **Contacto** — busca o crea `res.partner` por email o teléfono. Actualiza dirección.\n2. **Verifica disponibilidad** — comprueba que haya vehículos disponibles en la categoría reservada. Si no hay → error y aviso de **reembolso automático**.\n3. **Crea CRM Lead** (`Consulta de Reserva - {cliente}`) en etapa 1 con:\n   - Fechas y horas de recogida/entrega.\n   - Categoría seleccionada.\n   - DNI, fecha de caducidad DNI.\n   - Carnet de conducir + fechas expedición y caducidad.\n   - Fecha de nacimiento.\n   - Dirección completa.\n   - Resumen económico: precio alquiler, depósito, total pagado, tipo de tarjeta, BIN.\n4. **Crea factura del depósito** — la concilia contra el diario bancario de Redsys y la deja como **Pagada**.\n5. Marca la transacción como `booking_created = True` para evitar duplicación.\n6. Limpia la sesión del booking.\n\n### Paso 7 — Crear el contrato (manual)\n\n**El contrato NO se crea automáticamente** al pagar. Se crea cuando el comercial:\n\n1. Abre el Lead en **Consultas de Reserva**.\n2. Pulsa **Convertir a Oportunidad**.\n3. Pulsa **Crear Contrato**.\n\nVer [05 · Consultas web y leads](./05-consultas-web-y-leads.md) para el detalle.\n\n---\n\n## Páginas de retorno\n\n### Página de éxito `/rental/success`\n\n- Muestra una pantalla simple verde: *\"✓ ¡Pago realizado exitosamente! Tu reserva ha sido confirmada. Serás redirigido en breve…\"*.\n- Redirige al home a los **3 segundos**.\n- En segundo plano confirma:\n  - Lee `booking_data` de la sesión.\n  - Busca la última transacción Redsys con `booking_created = False`.\n  - La fuerza a `done` si no lo está y dispara la creación del lead.\n\n### Página de error `/rental/error`\n\n- HTML simple con mensaje rojo: *\"✗ El pago ha sido cancelado o ha fallado\"*.\n- Enlace para *\"Volver a reservar\"*.\n- Redirección al home en 5 segundos.\n\n---\n\n## Estados de la transacción\n\n| Estado | Significado |\n|---|---|\n| **draft** | Recién creada, sin enviar a Redsys. |\n| **pending** | Pendiente de respuesta del TPV. |\n| **authorized** | Autorizada por el banco, sin capturar. |\n| **done** | Pago capturado y confirmado. |\n| **error** | Rechazo o fallo. |\n| **cancel** | Cancelada por el cliente. |\n\nSobre el Lead/factura, el estado relevante es **`booking_created`**: `True` cuando ya se generó la oportunidad CRM tras el pago.\n\n---\n\n## Gestión de errores y reintentos\n\n### Errores frecuentes\n\n- Errores se registran con prefijo `REDSYS:` en los logs de Odoo.\n- Si falta algún dato obligatorio del booking → `ValidationError` y aviso de reembolso.\n- Si no hay vehículos disponibles en la categoría → `ValidationError` y se sugiere reembolso automático.\n- Si la creación de la factura de depósito falla, el flujo continúa (el lead se crea igualmente) y se anota un warning.\n\n### Endpoint manual de pruebas\n\n`/rental/manual-webhook?order_number=XXX`\n\nPermite **disparar a mano** el procesamiento de una transacción para testing. Sólo administradores deberían acceder.\n\n### Cron de recuperación\n\nHay un **trabajo programado** (`_cron_process_orphaned_transactions`) que cada **30 minutos** revisa las transacciones de Redsys de las últimas 24 horas que están en `done` pero a las que les falta el lead, e intenta crearlo automáticamente.\n\nEsto evita pérdidas si fallara el webhook puntualmente.\n\n---\n\n## Enlaces de pago al cliente\n\n### Cómo se le envía un enlace de pago\n\nEl módulo `payment_redsys` y el sistema estándar de Odoo permiten **generar enlaces de pago** para cobros puntuales:\n\n1. Desde la factura del contrato (cuota o factura general), abrir la factura.\n2. Pulsar **\"Enviar e Imprimir\"** (botón estándar de Odoo).\n3. Odoo prepara un email al cliente que incluye:\n   - **PDF de la factura** adjunto.\n   - **Enlace al portal del cliente** donde puede ver la factura.\n   - **Botón \"Pagar Ahora\"** en el portal que abre el formulario de pago con Redsys.\n4. El cliente entra al portal, elige Redsys, paga en el TPV, y al volver se le marca la factura como **Pagada**.\n\n### Cómo se marca la factura como pagada automáticamente\n\nCuando llega la confirmación de Redsys (webhook o regreso del usuario), el módulo:\n\n1. Crea un `account.payment` por el importe de la transacción.\n2. Lo postea (`action_post`).\n3. Llama a `register_payment` sobre la factura para conciliarlo.\n4. Si fallara, hace **reconciliación manual** vinculando la línea contable del pago con la línea de cobro de la factura.\n\nEl estado **Payment State** de la factura pasa a **Pagado** y se ve reflejado en:\n\n- La propia factura.\n- La cuota (`vehicle.payment.option`) ligada a esa factura.\n- El campo **Estado del Depósito** (`deposit_payment_state`) si era el depósito.\n- El campo **Estado Devolución Depósito** (`return_deposit_state`) si era la devolución.\n\n---\n\n## Comunicación por email\n\n| Email | Cuándo se envía | Disparador |\n|---|---|---|\n| **Confirmación de reserva tras pago** | Después del pago exitoso por web | Automático tras Redsys (estándar Odoo Mail). |\n| **Notificación interna** al comercial | Cuando se crea el Lead desde una reserva web | Automático. |\n| **Envío del contrato al cliente** | Cuando el operario pulsa *Enviar Contrato* en el contrato | Manual con plantilla `email_template_vehicle_contract`. |\n| **Factura por email** | Cuando el operario pulsa *Enviar e Imprimir* en la factura | Manual con plantilla estándar de factura. |\n| **Recordatorios de factura vencida** | Cuando una factura está fuera de plazo | Estándar Odoo. |\n\nVer el detalle de plantillas en [14 · Emails y reportes](./14-emails-y-reportes.md).\n\n---\n\n## Modos de cobro habituales\n\n### Cliente que reserva por web (la mayoría)\n\n1. Paga el **depósito + alquiler** completo online con tarjeta.\n2. Lead aparece en el sistema con `booking_created = True`.\n3. Operario crea el contrato; ya está todo cobrado.\n4. Al devolver el coche, se gestiona la **devolución del depósito** (ver [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md)).\n\n### Cliente presencial que paga en efectivo / transferencia\n\n1. Recepción crea el contrato manualmente con [Reservar Vehículo](./06-reservas.md).\n2. Pulsa **Create Installment** → genera cuotas.\n3. Pulsa **Create Invoice** en cada cuota → emite la factura.\n4. Cobra al cliente manualmente (en efectivo o por transferencia) → registra el pago en la factura desde Contabilidad.\n\n### Cliente que paga después (a crédito)\n\n1. Recepción crea el contrato y la factura.\n2. Manda la factura por email con **Enviar e Imprimir**.\n3. El cliente recibe el email con el enlace al portal.\n4. Paga en el portal con Redsys (o por transferencia, lo que prefiera).\n5. La factura se marca como pagada automáticamente al confirmarse el pago.\n\n---\n\n## Validaciones y restricciones\n\n- **Provider Redsys mal configurado** → el botón *Pagar* en el portal no aparece o sale error de conexión. Verificar credenciales en *Ajustes → Pasarelas de Pago → Redsys*.\n- **BIN inválido** → la web pública avisa al cliente *\"Tarjeta no reconocida\"* y bloquea el envío.\n- **Pago duplicado** → si el webhook llega dos veces, el sistema detecta `booking_created = True` y NO duplica el lead/factura.\n- **Tarjeta declinada** → cliente vuelve a `/rental/error`, no se crea nada en el sistema.\n\n---\n\n## Relacionado\n\n- [05 · Consultas web y leads](./05-consultas-web-y-leads.md) — qué se crea automáticamente al recibir un pago web.\n- [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) — cómo se calcula el depósito que se cobra.\n- [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) — cómo se devuelve el depósito al cliente.\n- [13 · Portal web público](./13-portal-web-publico.md) — el formulario que el cliente rellena.\n- [14 · Emails y reportes](./14-emails-y-reportes.md) — plantillas de email.\n- [16 · Solución de problemas](./16-solucion-de-problemas.md) — qué hacer si un pago no llega bien.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [08 · Tarifas, seguros y depósitos](./08-tarifas-seguros-depositos.md) · Siguiente: [10 · Mantenimiento y sustituciones →](./10-mantenimiento-y-sustituciones.md)\n", "10-mantenimiento-y-sustituciones.md": "# 10 · Mantenimiento y Sustituciones\n\n[← Volver al índice](./README.md)\n\n---\n\n## Índice del capítulo\n\n- [A · Solicitudes de mantenimiento](#solicitudes-de-mantenimiento)\n- [B · Horarios de mantenimiento](#horarios-de-mantenimiento)\n- [C · Facturación al proveedor (taller)](#facturacion-al-proveedor)\n- [D · Gastos del vehículo](#gastos-del-vehiculo)\n- [E · Sustituciones de vehículo](#sustituciones)\n\n---\n\n## A. Solicitudes de mantenimiento\n\n### ¿Qué son?\n\nLas **solicitudes de mantenimiento** (`maintenance.request`) son las **órdenes de taller** asociadas a un vehículo: cambio de aceite, revisión periódica, reparación, ITV…\n\nEl módulo hereda la pantalla estándar de **Mantenimiento de Odoo** y añade campos específicos del alquiler.\n\n### Cómo acceder\n\n**Vehicles Rental → Solicitudes de mantenimiento**\n\nLas solicitudes que aparecen son las que tienen un vehículo de flota asignado.\n\n### Campos añadidos por el módulo\n\n| Campo | Notas |\n|---|---|\n| **Vehículo de flota** (`fleet_vehicle_id`) | Vehículo afectado. Visible cuando se rellena, en sólo lectura. |\n| **Próximo Horario de Mantenimiento** (`maintenance_schedule_id`) | El horario que originó la solicitud. |\n| **Fecha Próximo Mantenimiento** (`upcoming_maintenance_date`) | Cuándo toca la próxima revisión. |\n\n### Botones añadidos en cabecera\n\n| Botón | Cuándo | Qué hace |\n|---|---|---|\n| **Create Bill** | Hay piezas o servicios añadidos y aún no se ha generado factura | Abre el wizard de facturación al proveedor (ver [C](#facturacion-al-proveedor)). |\n| **Maintenance Bill** (botón estadístico) | Cuando ya hay factura | Abre la factura del proveedor. |\n\n### Pestaña \"Piezas y Servicios Usados\"\n\nDos bloques editables:\n\n#### Repuestos de Vehículo Requeridos\n\nTabla con:\n\n- **Producto** (de tipo *consumible*).\n- **Descripción** — se autocompleta con el nombre del producto.\n- **Cantidad** (default 1).\n- **Precio unidad** — se autocompleta con el precio de venta del producto.\n- **Subtotal** = cantidad × precio.\n\n#### Servicios de Vehículo Requeridos\n\nTabla con:\n\n- **Producto** (de tipo *servicio*).\n- **Descripción**.\n- **Cargo del servicio**.\n\n#### Bloque de totales (abajo a la derecha)\n\n- **Parts Price** — suma de repuestos.\n- **Service Charges** — suma de servicios.\n- **Total** estimado.\n\n### Estados de la solicitud\n\nStatusbar estándar de Odoo Mantenimiento:\n\n```\nNuevo → En curso → Reparado → Hecho (o Cancelado)\n```\n\n### Cómo se crean\n\nTres maneras:\n\n#### 1. Manual desde la ficha del vehículo\n\n1. Abrir la ficha del vehículo en **Flota → Vehículos**.\n2. Pulsar **Crear Solicitud de Mantenimiento** (amarillo, en cabecera).\n3. Se genera una nueva orden con el vehículo y el horario asignado.\n\n#### 2. Automática (cron diario)\n\nSi el vehículo tiene asignado un **Horario de Mantenimiento**, una tarea programada (`action_create_schedule_maintenance`) revisa cada noche si hoy coincide con la *Fecha Próximo Mantenimiento* y, si coincide:\n\n1. Calcula la siguiente fecha sumando los días del horario.\n2. Crea una **nueva solicitud de mantenimiento** para el vehículo.\n3. Recalibra la siguiente fecha.\n\nEsto mantiene el calendario al día sin intervención humana.\n\n#### 3. Manual desde el menú\n\n**Vehicles Rental → Solicitudes de mantenimiento → Crear** — pero hay que rellenar todo, no recomendado.\n\n---\n\n## B. Horarios de mantenimiento\n\n### ¿Qué son?\n\nUn pequeño **catálogo** (`maintenance.schedule`) que define **cada cuántos días toca revisión**.\n\n### Cómo acceder\n\n**Vehicles Rental → Configuraciones → Horarios de Mantenimiento**\n\n### Campos\n\n| Campo | Notas |\n|---|---|\n| **Name** | Nombre descriptivo. Ej.: *30 Días*, *6 Meses*. |\n| **Maintenance Days** | Número de días entre revisiones. Validación: > 0. |\n| **Compañía** | Heredada. |\n\n### Cómo se asignan al vehículo\n\n1. **Configuración → Maintenance Schedules → Crear**: por ejemplo *Cada 30 días*, *Cada 90 días*.\n2. En la ficha del vehículo, seleccionar el horario en el campo **Horario de Mantenimiento**.\n3. A partir de ese momento, las órdenes de mantenimiento se calculan tomando la fecha de la última revisión y sumando los días configurados.\n4. El cron diario genera las nuevas órdenes cuando llega la fecha.\n\n### Ejemplos\n\n- **30 Días** — revisión mensual de aceite y niveles para flota de uso intensivo.\n- **6 Meses** — revisión general.\n- **365 Días** — ITV anual.\n- **15.000 KM** — *(no contemplado por días sino por km; este sistema sólo soporta días, el control por km va aparte)*.\n\n---\n\n## C. Facturación al proveedor\n\n### ¿Para qué?\n\nCuando un taller externo te repara un coche, te emite una factura. Desde la solicitud de mantenimiento puedes **registrar esa factura de proveedor** directamente.\n\n### Cómo se usa\n\nDesde una solicitud de mantenimiento con **piezas y/o servicios cargados**:\n\n1. Pulsar **Create Bill** en la cabecera.\n2. Se abre el wizard `maintenance.request.bill`:\n   - **Vendor / Proveedor** — el taller o suministrador (obligatorio).\n   - Botones **Create Bill** y **Cancel**.\n3. Al pulsar **Create Bill**:\n   - Crea una **factura de proveedor** (`account.move` tipo `in_invoice`) con:\n     - Sección **Vehicle Maintenance Parts** + una línea por cada repuesto (producto, cantidad, precio).\n     - Sección **Vehicle Maintenance Services** + una línea por cada servicio.\n     - Fecha de factura: hoy.\n   - La factura queda **vinculada a la solicitud y al vehículo** (visible desde el botón *Maintenance Bills* en la ficha del coche).\n   - Aterriza en la factura recién creada para revisar/postear.\n\n### Dónde se ven las facturas de mantenimiento\n\n- Desde la ficha del **vehículo** → botón estadístico **Maintenance Bills**.\n- Desde la **solicitud de mantenimiento** → botón estadístico **Maintenance Bill**.\n\n---\n\n## D. Gastos del vehículo\n\n### ¿Para qué?\n\nRegistrar gastos imputados a un vehículo concreto (combustible, peajes, multas, lavados, recambios pagados al contado…) para conocer el coste real de cada coche.\n\n### Cómo activarlos\n\nEn la ficha del vehículo:\n\n1. Marcar la casilla **¿Hay Gastos del Vehículo?**.\n2. Aparece la pestaña **Vehicle Expenses**.\n\n### Campos por gasto (sobre `hr.expense`)\n\nEl módulo añade a los gastos estándar de Odoo:\n\n- **Fleet Vehicle** — vehículo al que se imputa.\n- **Vehicle Contract** — contrato al que se imputa (opcional).\n- **Driver** — conductor (`res.partner`) que originó el gasto. Si el conductor tiene un único empleado vinculado, se rellena automáticamente el campo *Employee*; si tiene varios, hay que elegirlo a mano. Si no es empleado → error.\n\nFiltros añadidos al buscador de Gastos: **Contract**, **Vehicle**, **Driver**.\n\n### Cómo se registra un gasto\n\n1. En la pestaña *Vehicle Expenses* de la ficha del vehículo, pulsar **Añadir línea**.\n2. Rellenar:\n   - **Producto** (gasto).\n   - **Importe** (con impuestos si procede).\n   - **Fecha**.\n   - **Distribución analítica** (cuenta analítica).\n   - **Recibo adjunto** (foto del ticket o factura).\n3. Pulsar **Create Report** para enviar el gasto a aprobación.\n\n---\n\n## E. Sustituciones\n\n### ¿Qué es una sustitución?\n\nUna **sustitución** (`vehicle.contract.substitution`) es cuando, **durante un alquiler activo** (`En Progreso`), se **cambia el vehículo asignado por otro**:\n\n- Avería.\n- Accidente.\n- Mantenimiento programado urgente.\n- Mejora de categoría.\n- Reducción de categoría.\n- Solicitud del cliente.\n- Otro motivo.\n\nEl contrato **NO se cierra**: simplemente \"cambia\" el vehículo y se guarda un registro histórico con anexo PDF firmable.\n\n### Cómo acceder\n\n- **Desde el contrato** (forma habitual): botón **Sustituir Vehículo** en la cabecera (sólo visible si el contrato está *En Progreso*).\n- **Listado global**: **Vehicles Rental → Sustituciones de Vehículos**.\n\n### Wizard de sustitución (4 pasos)\n\n#### Paso 1 — Inspección del Vehículo Actual\n\nCampos:\n\n| Campo | Notas |\n|---|---|\n| **Vehículo actual** y **Matrícula** | Sólo lectura. Si hubo sustituciones previas, toma el último sustituto, no el original. |\n| **Fecha de Sustitución** | Por defecto: ahora. |\n| **Motivo de Sustitución** | Obligatorio. Avería / Accidente / Mantenimiento Programado / Mejora de Categoría / Reducción de Categoría / Solicitud del Cliente / Otro. |\n| **Notas del Motivo** | Texto libre. |\n| **Kilometraje de Devolución** | Obligatorio. No puede ser menor al último registrado. |\n| **Nivel de Combustible** | Vacío / 1/4 / 2/4 / 3/4 / Lleno. Obligatorio. |\n| **¿Tiene daños?** | Checkbox. Si activa, se muestran: descripción HTML + monto estimado + botón **Abrir Editor de Daños - Vehículo Devuelto**. |\n\n#### Paso 2 — Seleccionar Vehículo Sustituto\n\n| Campo | Notas |\n|---|---|\n| **Vehículo Sustituto** | Sólo vehículos en estado *Disponible* y SIN contratos solapados en el período del contrato actual. Se calcula dinámicamente. |\n| **Matrícula** y **Categoría** | Sólo lectura. |\n\nSi no se selecciona vehículo o no se indica motivo, **notificación de error al avanzar**.\n\n#### Paso 3 — Inspección del Vehículo Sustituto\n\n| Campo | Notas |\n|---|---|\n| **Kilometraje de Entrega** | Se inicializa con el odómetro actual del nuevo vehículo. |\n| **Nivel de Combustible** | Por defecto Lleno. |\n| **¿Tiene daños previos?** | Checkbox. Si activa: descripción + botón **Abrir Editor de Daños - Vehículo Sustituto**. |\n\n#### Paso 4 — Confirmación y Documentos\n\n| Campo | Notas |\n|---|---|\n| **Tarifa Vehículo Actual** y **Tarifa Vehículo Sustituto** | Sólo lectura. |\n| **¿Hay diferencia de precio?** | Si las tarifas no coinciden. |\n| **Diferencia de Precio** | Positiva si el nuevo es más caro, negativa si es más barato. |\n| **Aplicar diferencia de precio al contrato** | Checkbox. |\n| **Generar Addendum al Contrato** | Checkbox. Por defecto activado. |\n| **Firma del Cliente** y **Firma de la Empresa** | Widgets de firma (táctil). |\n\n### Botones del wizard\n\n- **Anterior** — vuelve al paso previo.\n- **Siguiente** — valida y avanza.\n- En el paso 4: **Confirmar Sustitución**.\n\n### Qué pasa al confirmar\n\n1. **Valida** que el contrato siga *En Progreso*, que el nuevo vehículo esté *Disponible* y que no tenga contratos solapados. Si hay solapamiento → *\"El vehículo X NO está disponible en el período del contrato. Tiene contratos superpuestos: REF1, REF2... Por favor, seleccione otro vehículo\"*.\n2. **Crea el registro** `vehicle.contract.substitution` con toda la información (fechas, motivo, datos del viejo y del nuevo, daños, firmas, diferencia de precio).\n3. **Libera el vehículo original** (lo pone como *Disponible*).\n4. **Cambia el vehículo del contrato al nuevo** (`vehicle_id` → nuevo) y actualiza `last_odometer`.\n5. Registra **entradas de odómetro en Fleet** para ambos vehículos.\n6. Si el viejo tenía daños y monto > 0 → crea **factura de daños** automáticamente.\n7. Si hay diferencia de precio y se ha marcado aplicarla → crea **factura de ajuste**:\n   - `out_invoice` si el sustituto es más caro.\n   - `out_refund` (nota de crédito) si es más barato.\n8. Si se marcó *Generar Addendum* → genera el **PDF del anexo** (informe `action_report_vehicle_substitution_addendum`) y lo adjunta al chatter.\n9. Publica un **mensaje formateado en el chatter** del contrato con tabla de detalles: fecha, motivo, vehículo anterior (nombre + matrícula), vehículo sustituto, kilometraje, diferencia de precio si aplica, y enlace *\"Ver Addendum/Anexo\"*.\n\n### Listado de sustituciones\n\nDesde el contrato, el botón estadístico **Sustituciones** abre la lista. Cada sustitución muestra como \"nombre\" el patrón:\n\n```\nREF_CONTRATO - MATRÍCULA_VIEJA → MATRÍCULA_NUEVA (fecha)\n```\n\n### Botones adicionales en cada sustitución\n\n| Botón | Qué hace |\n|---|---|\n| **Generar Addendum** | Genera el PDF del anexo. |\n| **Factura de Daños** | Crea la factura de daños del vehículo viejo si hay daños y monto. |\n| **Factura de Ajuste de Precio** | Crea la factura de la diferencia. |\n\n### Painter de daños en sustituciones\n\nTanto en el paso 1 (vehículo devuelto) como en el paso 3 (sustituto) hay un botón **Abrir Editor de Daños** que lanza el **painter visual** sobre la silueta del coche. Ver [11 · Daños y rayones](./11-danos-y-rayones.md).\n\nLa imagen pintada queda guardada como:\n\n- *Imagen de Daños Pintada (Original)* — del vehículo devuelto.\n- *Imagen de Daños Pintada (Sustituto)* — del vehículo entregado.\n\nAmbas se reflejan en el anexo PDF.\n\n### Ejemplo\n\n> **Caso:** Cliente alquila un Renault Megane del 10 al 25 de junio. El día 15, se avería el motor. Hay un Volkswagen Golf disponible.\n>\n> 1. Operario abre el contrato → pulsa **Sustituir Vehículo**.\n> 2. **Paso 1**: Vehículo actual = Renault Megane. Fecha: 15-jun 14:00. Motivo: Avería. Km devolución: 42.350. Combustible: 1/2. Sí hay daños → describe \"Motor con fallo bielas, no arranca\". Monto estimado: 0 € (lo cubre el seguro del taller).\n> 3. **Paso 2**: Vehículo sustituto = Volkswagen Golf (mismo Tipo C).\n> 4. **Paso 3**: Km entrega del Golf: 28.100. Combustible: Lleno. Sin daños previos.\n> 5. **Paso 4**: Misma tarifa → no hay diferencia. Generar Addendum: sí. Cliente firma y empresa firma. **Confirmar Sustitución**.\n> 6. El sistema cambia el vehículo del contrato al Golf, libera el Megane, genera el PDF del anexo y lo adjunta al chatter. El contrato sigue activo hasta el 25-jun, pero ya con el Golf.\n\n### Anexo PDF de sustitución\n\nResumen de lo que muestra:\n\n- Cabecera con datos de la empresa y del contrato.\n- Datos del cliente (nombre, DNI).\n- **Tabla del vehículo anterior**: nombre, matrícula, fecha de sustitución, km devolución, nivel de combustible, daños (con descripción e imagen pintada).\n- **Tabla del vehículo sustituto**: nombre, matrícula, km entrega, combustible, daños previos.\n- **Motivo y notas**.\n- **Diferencia de precio** si aplica.\n- **Firmas** del cliente y de la empresa.\n\nVer [14 · Emails y reportes](./14-emails-y-reportes.md).\n\n---\n\n## Tareas programadas relacionadas\n\n| Tarea | Frecuencia | Qué hace |\n|---|---|---|\n| **Vehicle Rental: Vehicle Maintenance Schedule** | Diaria | Genera nuevas solicitudes de mantenimiento cuando llega la fecha programada según el horario asignado al vehículo. |\n\n---\n\n## Relacionado\n\n- [03 · Flota y vehículos](./03-flota-y-vehiculos.md) — botones de mantenimiento y campo *Horario de Mantenimiento*.\n- [07 · Contratos](./07-contratos.md) — desde donde se lanza la sustitución.\n- [11 · Daños y rayones](./11-danos-y-rayones.md) — el painter visual usado en sustituciones.\n- [14 · Emails y reportes](./14-emails-y-reportes.md) — anexo PDF de sustitución.\n- [15 · Configuración](./15-configuracion.md) — gestión de horarios de mantenimiento.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [09 · Pagos y Redsys](./09-pagos-y-redsys.md) · Siguiente: [11 · Daños y rayones →](./11-danos-y-rayones.md)\n", "11-danos-y-rayones.md": "# 11 · Daños y Rayones\n\n[← Volver al índice](./README.md)\n\n---\n\n## Índice del capítulo\n\n- [Visión general](#vision-general)\n- [A · Wizard de daños](#wizard-de-danos)\n- [B · Painter de daños (visual)](#painter-de-danos)\n- [C · Painter para sustituciones](#painter-para-sustituciones)\n- [D · Informes de rayones](#informes-de-rayones)\n- [E · Cómo se cobra al cliente](#como-se-cobra-al-cliente)\n\n---\n\n## Visión general\n\nEl módulo gestiona los **daños y rayones** del vehículo con **tres herramientas complementarias**:\n\n| Herramienta | Para qué |\n|---|---|\n| **Painter de daños** | Marcar visualmente **dónde** está el daño (sobre el dibujo del coche). |\n| **Wizard de Daños** | Indicar **cuánto cuesta** el daño y emitir la factura al cliente. |\n| **Informes de Rayones** (Scratch Reports) | Mantener un **histórico permanente** de daños conocidos por vehículo (referencia previa al alquiler). |\n\nLa idea es que ante una devolución con daños, el operario:\n\n1. Compara con el **scratch report** previo (¿el rayón ya estaba?).\n2. Si es nuevo, lo marca con el **painter** sobre el dibujo del coche.\n3. Lanza el **wizard de daños** para emitir la factura al cliente.\n\n---\n\n## A. Wizard de Daños\n\n### ¿Cuándo se usa?\n\nCuando se devuelve un vehículo con **desperfectos** que hay que cobrar al cliente. Es la forma de transformar un daño físico en una **factura emitida**.\n\n### Cómo se invoca\n\nDesde la ficha del **contrato** en estado **Devuelto**:\n\n- Pulsar el botón **Damage Invoice** en la cabecera.\n\n(Sólo aparece si todavía no se ha facturado daños y el contrato está en estado *Devuelto*.)\n\n### Qué pide el wizard\n\nEs una ventana modal (`vehicle.damage`) con:\n\n| Campo | Notas |\n|---|---|\n| **Damage Amount** | Importe del daño (obligatorio). Lo decide el operario. |\n| **Currency** | Moneda. |\n| Pestaña **Descriptions** | Editor enriquecido (HTML) para describir el daño detalladamente: zona afectada, gravedad, tipo de reparación necesaria. |\n\nBotones: **Create Invoice** y **Cancel**.\n\n### Qué pasa al pulsar \"Create Invoice\"\n\n1. Si el importe está vacío → aviso *\"Please add the proper amount\"*.\n2. Guarda la descripción y el importe en el contrato (campos `damage_amount` y `damage_description`).\n3. Crea una **factura de cliente** (`account.move` tipo `out_invoice`) en el journal de ventas del contrato, con una línea **\"Vehicle Damage Amount\"** por el importe indicado.\n4. La factura se **publica automáticamente** (acción `action_post`).\n5. La factura queda **enlazada al contrato** y el contrato se marca con `is_invoice_done = True`.\n\n> Tras la factura, la **pestaña \"Vehicle Damages\"** del contrato se hace visible y muestra el importe, la descripción y la galería de fotos del daño.\n\n---\n\n## B. Painter de Daños\n\n### ¿Qué es?\n\nUna **herramienta visual sobre lienzo** (canvas HTML) que permite **señalar gráficamente** dónde está el daño en el dibujo del vehículo. Es como un editor de imagen ligero, dentro de Odoo, que se abre como ventana modal asociada al contrato.\n\n### Cómo se accede\n\nDesde el contrato:\n\n- Pestaña **\"Daños del Vehículo\"** → botón **Abrir Editor de Daños**.\n\n### Barra de herramientas del painter\n\n| Herramienta | Para qué |\n|---|---|\n| **Marcador** (pincel) | Trazar líneas/manchas marcando golpes y rayones. |\n| **Texto** | Anotar texto sobre la imagen (ej. \"Abolladura puerta trasera\"). |\n| **Borrador** | Eliminar trazos. |\n| **Paleta de colores** | **Naranja** (#FF8C00) — para daños menores. **Amarillo** (#FFD700) — para daños mayores. (Convención visual). |\n| **Grosor** | Control deslizante 1 a 20. |\n| **Tamaño de texto** | Control deslizante 12 a 48. |\n| **Descargar** | Guarda la imagen anotada en local (PNG). |\n\n### Lienzo\n\n- Tamaño: **800 × 600 píxeles**.\n- Cursor en cruz para precisión.\n- **Imagen base**: carga la imagen previamente pintada si ya existía (para añadir nuevos daños sobre los anteriores); si no, un dibujo en blanco del coche.\n\n### Pie del modal\n\n| Botón | Qué hace |\n|---|---|\n| **Guardar** | Cierra el modal y persiste la imagen en el campo del contrato `painted_damage_image`. Hace commit explícito a base de datos para asegurar que se guarda. Notifica éxito o error. |\n| **Cancelar** | Descarta cambios. |\n\n### Cómo se usa en la práctica\n\n1. El cliente devuelve el coche.\n2. El operario abre el contrato → pestaña **Daños del Vehículo** → **Abrir Editor de Daños**.\n3. Se abre el lienzo con el dibujo del coche.\n4. Con el **marcador**, traza una línea sobre la zona dañada (ej. puerta trasera derecha).\n5. Con la herramienta **Texto**, escribe una nota *\"Abolladura ~5cm\"*.\n6. **Guardar**. La imagen queda asociada al contrato.\n7. Lanza el **Wizard de Daños** para emitir la factura.\n\n### Botón \"Limpiar Imagen\"\n\nEn la misma pestaña hay un botón **Limpiar Imagen** que **borra la imagen pintada** del contrato (vuelve al dibujo en blanco). Útil si te confundes y quieres rehacer.\n\n---\n\n## C. Painter para sustituciones\n\n### ¿Qué es?\n\nVariante específica del painter (`vehicle.substitution.damage.painter`) para cuando el cliente **cambia de vehículo durante un alquiler** (sustitución). Permite documentar daños **tanto del coche que devuelve como del coche que recoge**.\n\nVer [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md#e-sustituciones) para entender cuándo se usa el flujo de sustitución.\n\n### Cuándo aparece\n\nDentro del **wizard de sustitución** (`vehicle.substitution.wizard`):\n\n- **Paso 1 (Inspección del Vehículo Actual)** → botón **Abrir Editor de Daños - Vehículo Devuelto** (sólo si está marcado *¿Tiene daños?*).\n- **Paso 3 (Inspección del Vehículo Sustituto)** → botón **Abrir Editor de Daños - Vehículo Sustituto** (sólo si está marcado *¿Tiene daños previos?*).\n\n### Campos clave\n\n| Campo | Significado |\n|---|---|\n| **Vehículo** | Vehículo concreto que se está revisando. |\n| **Tipo de Daño** | *Vehículo Devuelto* (`old`) o *Vehículo Sustituto* (`new`). |\n| **Imagen Base del Vehículo** | Se carga desde la imagen del vehículo si la hay. |\n\n### Qué pasa al guardar\n\nLa imagen pintada se almacena en el wizard de sustitución como:\n\n- `old_vehicle_painted_damage_image` (si era el devuelto).\n- `new_vehicle_painted_damage_image` (si era el sustituto).\n\nY se marca el flag `..._has_damage = True` correspondiente, de modo que el proceso de sustitución **recuerda dónde tiene golpes cada vehículo**.\n\nEstas imágenes acaban en el **anexo PDF de sustitución** que firma el cliente.\n\n---\n\n## D. Informes de Rayones (Scratch Reports)\n\n### ¿Qué son?\n\nUn **histórico permanente** (`vehicle.scratch.report`), **por vehículo**, de fotos de arañazos y desperfectos. Pensado para guardar como referencia el estado \"anterior\" del coche.\n\n> Útil para que el equipo de devoluciones pueda **consultar rápidamente** si un golpe ya existía antes del alquiler en curso (y por tanto NO se cobra al cliente actual).\n\n### Cómo acceder\n\n**Vehicles Rental → Configuraciones → Informes de Rayones**\n\nVista lista con Nombre / Vehículo / Compañía y buscador por nombre.\n\n### Campos del formulario\n\n| Campo | Notas |\n|---|---|\n| **Name** | Obligatorio. Título descriptivo. Ej. *\"Rayón puerta trasera derecha\"* o *\"Estado del coche el 01/05/2026\"*. |\n| **Vehicle** | Obligatorio. Selector contra `fleet.vehicle`. |\n| **Compañía** | Obligatorio. |\n| **Avatar / Imagen** | Obligatorio. Tamaño recomendado 250 × 250. Foto del rayón o del estado del coche. |\n\n### Cómo se usa en la práctica\n\n#### Antes del alquiler\n\n1. Al recoger un coche del taller o de un alquiler anterior, hacer una **inspección 360°** y fotografiar cualquier daño previo.\n2. **Vehicles Rental → Configuraciones → Informes de Rayones → Crear**.\n3. Subir la foto, indicar vehículo y darle un nombre descriptivo.\n4. Guardar. Ese rayón ya está registrado **a nombre del coche**, no de ningún cliente.\n\n#### Cuando vuelve un cliente\n\n1. Devuelve el coche con rayones.\n2. Operario abre los **Scratch Reports del vehículo** (filtrar por `Vehicle`).\n3. Compara: ¿este rayón está en los reports? Si sí → **NO se cobra**, ya existía.\n4. ¿Es nuevo? → se documenta con el **painter** y se factura con el **wizard de daños**.\n\n### Vinculación con el contrato\n\nDentro del contrato (campo *Custom Scratch Report* + *Scratch Report*), el operario puede **anexar el report relevante** al iniciar el alquiler como prueba documental del estado del vehículo antes de entregarlo al cliente.\n\n---\n\n## E. Cómo se cobra al cliente\n\n### Flujo completo de cierre con daños\n\n1. **El cliente devuelve el coche** → pulsar **Return** en el contrato → estado pasa a *Devuelto*.\n2. **Inspección** del coche por el operario.\n3. **Comparar con el Scratch Report** previo (si lo hubiera) para descartar daños preexistentes.\n4. Si hay **daños nuevos**:\n   - Abrir el **Painter** desde la pestaña *Daños del Vehículo* y marcar la zona.\n   - Hacer fotos del daño y subirlas (al wizard o como adjuntos del contrato).\n5. Pulsar **Damage Invoice** en la cabecera del contrato.\n6. En el wizard, indicar:\n   - **Damage Amount** (importe a cobrar).\n   - **Descripción** detallada.\n7. **Create Invoice** → factura emitida automáticamente al cliente.\n8. Si además hay que **descontar del depósito**, ir al wizard **Return Deposit Invoice** y poner el importe a devolver = depósito − daños. Ver [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md).\n\n### Si el daño es alto y supera el depósito\n\n- El **depósito se devuelve a 0 €** (o se mantiene como compensación parcial).\n- La **factura de daños** queda emitida por el importe total.\n- El cliente debe **pagar la diferencia** (depósito ya retenido + diferencia pendiente).\n\n### Si el daño viene cubierto por el seguro\n\n- El módulo **NO gestiona la reclamación al seguro automáticamente**. Es una gestión administrativa que se hace fuera de Odoo (con la compañía aseguradora).\n- En el contrato puedes facturar el daño al cliente igualmente (que él reclame a su seguro) o no facturarlo (asumir el coste).\n- Lo que sí queda **documentado** en Odoo es:\n  - La **imagen pintada** del daño.\n  - La **descripción** en el campo de daños.\n  - La **factura** si la hay.\n\n---\n\n## Vista de los daños desde el contrato\n\nUna vez registrados los daños, en la ficha del contrato verás:\n\n### Pestaña \"Daños del Vehículo\"\n\nVisor de la imagen pintada con el dibujo del coche y las marcas del operario. Acompañado de los botones:\n\n- **Abrir Editor de Daños** — para volver a editar.\n- **Limpiar Imagen** — para empezar de cero.\n\n### Pestaña \"Vehicle Damages\"\n\nVisible **sólo cuando ya hay factura de daños**. Contiene:\n\n- **Damage Amount** (importe facturado).\n- **Damage Description** (descripción HTML).\n- **Galería de fotos** del daño (subidas como adjuntos).\n\n---\n\n## Validaciones y restricciones\n\n- **Damage Amount > 0** para poder generar la factura.\n- **No se puede facturar dos veces** los daños del mismo contrato (el botón *Damage Invoice* desaparece tras la primera factura).\n- **Sólo en estado Devuelto** se pueden facturar daños. En *En Progreso* no aparece el botón.\n- **Imagen pintada**: si el navegador del usuario es muy antiguo y el canvas falla, el painter avisa con error en el chat de Odoo.\n- **El scratch report exige imagen**: no se puede guardar sin foto.\n\n---\n\n## Errores frecuentes\n\n| Mensaje / Síntoma | Causa | Solución |\n|---|---|---|\n| *\"Please add the proper amount\"* | Damage Amount vacío al pulsar Create Invoice | Rellenar el importe. |\n| El painter no carga imagen | Caché del navegador o problema de assets | Refrescar (Ctrl+F5). Si persiste, contactar a IT. |\n| La imagen pintada no se guarda | Conexión interrumpida o sesión caducada | Volver a abrir, repetir, guardar (hay commit explícito). |\n| El daño no aparece en el PDF del contrato | El PDF se generó antes de pintar | Volver a imprimir el PDF para que incluya la nueva imagen. |\n\n---\n\n## Ejemplos de uso\n\n### Daño leve detectado en la devolución\n\n> **Caso:** El cliente devuelve el coche con un pequeño abollón en el parachoques trasero.\n\n1. Operario pulsa **Return** en el contrato.\n2. Abre la pestaña *Daños del Vehículo* → **Abrir Editor de Daños**.\n3. En el lienzo, marca con el rotulador **naranja** el parachoques trasero.\n4. Añade texto *\"Abolladura 3cm, parachoques trasero, sin pintura levantada\"*.\n5. Guarda.\n6. Pulsa **Damage Invoice** en la cabecera. Importe: 80 €. Descripción: pega la nota del párrafo anterior.\n7. **Create Invoice** → factura de 80 € emitida.\n8. Pulsa **Return Deposit Invoice**. Importe a devolver: depósito (150 €) − daños (80 €) = **70 €**.\n9. Cliente recibe nota de crédito de 70 € + factura de daños de 80 €. Saldo neto: 10 € (mantiene esa parte el cliente paga 0, recibe 70 del depósito, pero le emiten una factura de 80 → debe 10).\n\n### Daño preexistente que aparece en el scratch report\n\n> **Caso:** Cliente devuelve con un rayón en la puerta. Operario sospecha que ya estaba.\n\n1. Filtra **Scratch Reports** por el vehículo.\n2. Encuentra un report del mes pasado *\"Rayón puerta trasera derecha\"* con foto.\n3. Compara: es el mismo rayón.\n4. **NO emite factura de daños**.\n5. Devuelve el depósito íntegro al cliente.\n\n### Daño grave durante el alquiler que motiva sustitución\n\n> **Caso:** A mitad del alquiler, el coche choca y queda inutilizable. Se sustituye.\n\n1. Se sigue el flujo de [sustitución](./10-mantenimiento-y-sustituciones.md#e-sustituciones).\n2. En el **paso 1** del wizard de sustitución, se marca *Tiene daños* → se pinta sobre el painter de sustitución → se indica un **monto estimado** del daño.\n3. Al confirmar, **el sistema crea automáticamente la factura de daños** sin intervención manual adicional.\n4. El alquiler continúa con el coche sustituto.\n\n---\n\n## Relacionado\n\n- [07 · Contratos](./07-contratos.md#pestanas-del-contrato) — pestañas *Daños del Vehículo* y *Vehicle Damages*.\n- [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md#e-sustituciones) — painter para sustituciones.\n- [12 · Devolución y facturación final](./12-devolucion-y-facturacion.md) — proceso completo de cierre.\n- [14 · Emails y reportes](./14-emails-y-reportes.md) — reporte PDF de scratch report.\n\n---\n\n[← Volver al índice](./README.md) · Anterior: [10 · Mantenimiento y sustituciones](./10-mantenimiento-y-sustituciones.md) · Siguiente: [12 · Devolución y facturación final →](./12-devolucion-y-facturacion.md)\n", "12-devolucion-y-facturacion.md": "# 12 · Devolución y facturación final\n\n[← Volver al índice](./README.md)\n\n---\n\n## ¿De qué trata este capítulo?\n\nEl **cierre del alquiler**: cuando el cliente trae el vehículo de vuelta y hay que:\n\n1. Marcar el contrato como **Devuelto**.\n2. Inspeccionar el coche y registrar daños/excesos si los hay.\n3. Emitir las **facturas finales** (daños, cargos extras, servicios).\n4. **Devolver el depósito** al cliente (total o parcialmente).\n\nEs el último paso antes de cerrar definitivamente el caso.\n\n---\n\n## Resumen visual del proceso\n\n```\n[Contrato En Progreso]\n        |\n        | Cliente devuelve el coche\n        v\n    [Return]  ← botón de la cabecera\n        |\n        v\n[Contrato Devuelto] ─────┐\n        |                │\n        | Inspección     │\n        |                │\n        v                │\n  ¿Hay daños?            │\n   ├── Sí → Painter → Damage Invoice (factura cliente)\n   └── No                │\n        |                │\n        v                │\n  ¿Hay cargos extras?    │\n   ├── Sí → Extra Charge Invoice\n   └── No                │\n        |                │\n        v                │\n  ¿Hubo depósito?        │\n   └── Sí → Return Deposit Invoice (nota de crédito)\n                         │\n                         v\n                  [Cierre completo]\n```\n\n---\n\n## Paso 1 — Devolver el contrato\n\n### Botón \"Return\"\n\nCuando el contrato está **En Progreso** y ya tiene cuotas creadas, aparece en la cabecera el **botón verde Return**.\n\nAl pulsarlo, el contrato pasa al estado **Devuelto** (`c_return`).\n\n### Qué cambia tras pulsar Return\n\n| Elemento | Antes (En Progreso) | Después (Devuelto) |\n|---|---|---|\n| Cabecera | Botones *Sustituir Vehículo*, *Return*, *Cancel* | Botones *Damage Invoice*, *Return Deposit Invoice* |\n| Pestaña *Vehicle Damages* | Oculta | Visible |\n| Pestaña *Documents* | Permite añadir | Bloqueada (no se pueden añadir más) |\n| Pestaña *Términos de Alquiler* | Editable | Sólo lectura |\n| Pestaña *Vehicle Images* | Editable | Sólo lectura |\n| Pestaña *Insurance Policy* | Editable | Sólo lectura |\n| Campo *Last Odometer* | Editable | Sólo lectura |\n| Campo *Date* del cliente | Editable | Sólo lectura |\n| Campo *Signature* del cliente | Editable | Sólo lectura |\n\n> Una vez en Devuelto, el alquiler queda **cerrado documentalmente**. Sólo quedan acciones de facturación y devolución de depósito.\n\n---\n\n## Paso 2 — Inspeccionar el vehículo\n\n### Comprobaciones recomendadas\n\n1. **Kilómetros**: comparar con los km de inicio. Si superan los contratados → registrar **cargos extras**.\n2. **Combustible**: confirmar que el cliente lo devuelve al mismo nivel pactado.\n3. **Estado del exterior**: rayones, abolladuras, cristales… → consultar el [Scratch Report](./11-danos-y-rayones.md#d-informes-de-rayones-scratch-reports) previo para descartar lo que ya existía.\n4. **Estado del interior**: limpieza, tapicería, asientos, salpicadero.\n5. **Documentación**: que devuelva las llaves y la documentación del coche.\n\n### Si hay daños\n\n1. Abrir la pestaña *Daños del Vehículo* → **Abrir Editor de Daños**.\n2. Marcar visualmente la zona en el [painter](./11-danos-y-rayones.md#b-painter-de-danos).\n3. Hacer fotos del daño (las subes como adjuntos al wizard).\n4. Pulsar **Damage Invoice** en la cabecera → indicar importe + descripción → **Create Invoice**.\n\n### Si hay cargos extras (días/horas/km de más)\n\n1. En el bloque *Extra Charges Details* del contrato, marcar el checkbox **If any extra charges**.\n2. Aparecen campos para indicar:\n   - Cantidad extra (días/horas/km/etc. según el tipo de alquiler).\n   - Precio por unidad extra (heredado del campo del vehículo en *Extra Charge Details*).\n3. El sistema calcula automáticamente el **Total Extra Charges**.\n4. Pulsar **Extra Charge Invoice** (botón cerca del bloque de facturas) → genera factura `vehicle_rent_extra_charge`.\n\n### Si hay servicios extras pendientes de facturar\n\nPulsar **Create Extra Service Invoice** en la cabecera → genera una factura con una línea por cada producto de la pestaña *Extra Services*.\n\n---\n\n## Paso 3 — Devolver el depósito\n\n### Cuándo aparece el botón \"Return Deposit Invoice\"\n\nSólo si se cumplen estos cuatro:\n\n1. El contrato está en estado **Devuelto**.\n2. Hubo un **depósito** registrado en el contrato.\n3. Se generó la **factura del depósito** previamente (`deposit_invoice_id`).\n4. Aún **no se ha devuelto** (`return_deposit_invoice_id` está vacío).\n\n### Wizard \"Return Deposit\" (`return.deposit`)\n\nEs una ventana modal simple con:\n\n| Campo | Notas |\n|---|---|\n| **Contract** | El contrato actual. Sólo lectura. |\n| **Total Deposit** | El depósito cobrado al cliente. Sólo lectura. |\n| **Amount to Return** | Campo editable. Por defecto se propone el total del depósito, pero el operario puede reducirlo si descuenta daños, combustible no repuesto, etc. |\n\n### Qué hace al pulsar \"Crear\"\n\n1. Genera una **nota de crédito** al cliente (`account.move` tipo `out_refund`):\n   - Producto: **\"Vehicle Rent Deposit\"**.\n   - Importe: el indicado en *Amount to Return*.\n2. La guarda en el campo `return_deposit_invoice_id` del contrato.\n3. **Abre la nota de crédito en pantalla** para que el operario la valide.\n\nSi el campo *Amount to Return* está vacío → notificación amarilla: *\"Please note: A return deposit amount is required.\"*\n\n### Casos típicos del importe a devolver\n\n| Situación | Importe a devolver |\n|---|---|\n| Devolución sin incidencias | = total del depósito |\n| Hay daños menores que cubre el depósito | = depósito − coste de los daños |\n| Hay daños que superan el depósito | = 0 (y emites factura de daños por la diferencia) |\n| Combustible no repuesto | = depósito − coste del combustible |\n| Limpieza extrema necesaria | = depósito − coste de la limpieza |\n| Multas o sanciones pendientes | = depósito − coste de las multas |\n\n### Conciliació
